# doc-review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。〇〇コンサルティングから北都フーズへの提案書で、営業部門デジタル化の支援を契約するかを決めてもらう。読むのは営業本部長で、審議するのは経営会議

主結論:
  主張: 当社は、営業担当30名の顧客訪問記録を個人の手元ではなく会社の資産として蓄積し、活用できる状態にするご支援を提案します。最初の3か月で現状を診断し、続く6か月で SFA(営業支援システム)の導入と、現場で使われ続ける状態になるまでの定着を支援します
  行: [10, 12, 18, 20, 43, 45]
  決裁事項:
    - 内容: 当社は、営業担当30名の顧客訪問記録を個人の手元ではなく会社の資産として蓄積し、活用できる状態にするご支援を提案します。最初の3か月で現状を診断し、続く6か月で SFA(営業支援システム)の導入と、現場で使われ続ける状態になるまでの定着を支援します
      行: [12]
    - 内容: 現状診断が終わる3か月目の時点で、診断結果をもとに導入フェーズへ進むかどうかをご判断いただけます
      行: [21]
    - 内容: プロジェクトを円滑に進めるため、御社には次のご協力をお願いする想定です。具体的な人選や負荷は、キックオフの際にご相談させてください
      行: [159, 161]
    - 内容: プロジェクトの責任者:営業本部長にお願いし、継続判断などの重要事項をご判断いただきます
      行: [163]
    - 内容: 窓口のご担当者:社内の日程調整や資料のご提供をお願いする方を1名
      行: [164]
    - 内容: 試行メンバー:フェーズ2の試行導入に参加いただく営業担当を数名(ベテランの方を含めて)
      行: [165]
    - 内容: ヒアリングへのご協力:営業担当・管理職の方に、1人あたり1時間程度のお時間
      行: [166]
    - 内容: 研修と記録:営業担当30名と管理職の方の研修へのご参加と、営業担当の方の毎日の記録
      行: [167]
    - 内容: 本資料について、営業本部長からご意見・ご質問をいただき、必要に応じて内容を修正します
      行: [171, 173]
    - 内容: 経営会議でご審議いただきます
      行: [174]
    - 内容: ご承認後、契約を締結し、キックオフを行います
      行: [175]
    - 内容: 経営会議の前に、過去1〜2年の異動・退職の件数と、そのときに担当が替わった顧客の数をお教えいただければ、効果の式のうち年間に担当が替わる顧客数を本資料に追加できます。ご検討いただけますと幸いです
      行: [177]
  制約:
    - 内容: 期間 9か月(現状診断 3か月+SFA 導入・定着支援 6か月)
      行: [18]
    - 内容: 費用 月額300万円、総額2,700万円(SFA のライセンス費は別途)
      行: [19]
    - 内容: 全体展開と研修:営業担当30名と管理職の方を対象に研修を行います
      行: [68]
  比べた案:
    - 内容: 現状診断のあと、導入フェーズへ進まない
      行: [21, 141]
    - 内容: SFA 導入よりも先に取り組むべきこと(中身は本文に書かれていない)
      行: [141]
  前提:
    - 種別: 前提
      内容: 失注の原因が情報の抜け落ちである
      行: [95]
      書き手の明示: あり
    - 種別: 前提
      内容: 営業担当が毎日記録を入れて、初めて引き継ぎにも新人育成にも使える情報がたまる
      行: [73]
      書き手の明示: あり
    - 種別: 前提
      内容: 記録に残っていない経緯や顧客との約束事が、SFA を入れると記録されるようになる
      行: [35, 95]
      書き手の明示: なし
    - 種別: 前提
      内容: 台帳に、最初の1か月で改善幅を除く数字を算出できる過去の引き継ぎ実績が残っている
      行: [117]
      書き手の明示: なし
    - 種別: 前提
      内容: 全体展開から9か月目の効果測定までの間に、指標の導入後の値が出る
      行: [109, 191, 193]
      書き手の明示: なし
    - 種別: 前提
      内容: 3か月目にフェーズ2へ進まないと判断すれば、フェーズ2の費用は発生しない
      行: [21, 127, 128]
      書き手の明示: なし
  依存:
    - 顧客の情報が担当者個人のもとにある
    - 異動・退職の引き継ぎでの失注
    - 今後、引き継ぎの機会は増えていく
    - フェーズ1 現状診断
    - フェーズ2 SFA 導入・定着支援
    - 現場で使われ続けるための工夫
    - 引き継ぎによる失注の削減
    - 新人の立ち上がり期間の短縮
    - 投資額に見合う効果の判断
    - 費用
    - 3か月目の継続判断

論点:
  - 名前: 顧客の情報が担当者個人のもとにある
    種類: 論証
    主張: 顧客の情報が担当者個人のもとにある
    行: [25, 27]
    論拠: 訪問記録が個人の Excel にあるため、基本的に担当者本人しか分からない
    根拠:
      - 種別: 事実
        内容: 訪問記録は、現在、担当者それぞれの Excel ファイルに保存されています
        行: [14]
        重み: 裏づけ
      - 種別: 事実
        内容: 訪問記録が個人の Excel にあるため、どの顧客と、いつ、どのような話をしたのかは、基本的に担当者本人しか分かりません
        行: [29]
        重み: 決裁に要る
      - 種別: 事実
        内容: 書式や記録の細かさも人によって違います
        行: [29]
        重み: 裏づけ
      - 種別: 事実
        内容: 上長やほかの担当者が顧客の状況を知ろうとしても、本人に聞くほかないのが実情です
        行: [29]
        重み: 裏づけ

  - 名前: 異動・退職の引き継ぎでの失注
    種類: 論証
    主張: 異動・退職の引き継ぎでの失注
    行: [31]
    論拠: 本文にない(2社の発言と情報の抜け落ちをつなぐ言葉はなく、理由は現状診断で確認するとしている)
    根拠:
      - 種別: 推論
        内容: 担当者が異動・退職するとき、顧客の情報は後任に十分引き継がれないおそれがあります
        行: [14]
        重み: 決裁に要る
      # 発言と確かめていないことは1つの根拠にまとめた。発言だけを本編に残すと、元より根拠が強く読める
      - 種別: 事実
        内容: 営業本部長からは、引き継ぎで2社を失ったとうかがっています。資料では確かめておらず、失注の理由、件数、金額は現状診断で確認します
        行: [14, 33]
        重み: 決裁に要る
      - 種別: 事実
        内容: 担当者が替わるとき、後任者は前任者の Excel と口頭の説明を手がかりに顧客を引き継ぐことになります
        行: [35]
        重み: 補足
      - 種別: 推論
        内容: 記録に残っていない経緯や顧客との約束事は、ここで抜け落ちやすくなります
        行: [35]
        重み: 裏づけ
    限界や条件:
      - 内容: その2社の時期や理由もうかがっていません
        行: [33]
      - 内容: 情報が届かなかった失注と、前任者との関係が切れて起きた失注がどのくらい混じっているか、その件数と金額はどの程度かは、現状診断で具体的に確認します
        行: [35]

  - 名前: 今後、引き継ぎの機会は増えていく
    種類: 論証
    主張: 今後、引き継ぎの機会は増えていく
    行: [37]
    論拠: 本文にない(平均年齢の高さから数年のうちに退職が増えると言える理由は書かれていない)
    根拠:
      - 種別: 推論
        内容: 御社の営業担当は平均年齢が高く、今後数年のうちに退職に伴う引き継ぎが増えていくと見込まれます
        行: [39]
        重み: 決裁に要る
      - 種別: 意見
        内容: ベテラン担当者が長年かけて築いてきた顧客との関係や知見を、在籍しているうちに会社として残しておけるかどうかが問われています
        行: [39]
        重み: 裏づけ
      - 種別: 推論
        内容: 対策を始めるなら、早いほど残せる情報は多くなります
        行: [39]
        重み: 裏づけ

  - 名前: フェーズ1 現状診断
    種類: 記述
    主張: SFA を入れる前に、御社の営業の実態と、引き継ぎで何が起きているのかを把握します
    行: [47, 49]
    根拠:
      - 種別: 事実
        内容: フェーズ1の成果物として、診断報告書、効果の試算、SFA の要件と製品比較(候補製品ごとの見積もりを含む)、導入計画書(効果目標を含む)をお渡しします
        行: [58]
        重み: 決裁に要る
      - 種別: 推論
        内容: ここを丁寧に行うことで、現場に合わない仕組みを入れてしまう事態を避けやすくします
        行: [49]
        重み: 裏づけ
      - 種別: 事実
        内容: 訪問記録の実態調査:30名の Excel に何が、どの程度の細かさで、どのくらいの頻度で記録されているかを確認します
        行: [51]
        重み: 裏づけ
      - 種別: 事実
        内容: 引き継ぎ失注の分析:過去の異動・退職で担当が替わった顧客を洗い出し、失注の件数・金額・原因を整理します
        行: [52]
        重み: 裏づけ
      - 種別: 事実
        内容: 営業担当・管理職へのヒアリング:日々の業務の流れ、記録や報告にかけている手間、新しいツールへの不安や要望をうかがいます
        行: [53]
        重み: 裏づけ
      - 種別: 事実
        内容: 新人の立ち上がりの実態把握:独り立ちまでにかかっている期間と、その間に困っていることを確認します
        行: [54]
        重み: 裏づけ
      - 種別: 事実
        内容: SFA の要件整理と製品選定の支援:記録すべき項目を絞り込み、候補となる製品を比較して選定をお手伝いします
        行: [55]
        重み: 裏づけ
      - 種別: 事実
        内容: 導入計画と効果目標の策定:フェーズ2の詳細な計画と、効果を測る指標の定義・目標値を決めます
        行: [56]
        重み: 裏づけ

  - 名前: フェーズ2 SFA 導入・定着支援
    種類: 記述
    主張: フェーズ1で決めた計画に沿って SFA を導入し、営業担当が日常的に使う状態まで支援します
    行: [60, 62]
    根拠:
      - 種別: 事実
        内容: 全体展開と研修:営業担当30名と管理職の方を対象に研修を行います
        行: [68]
        重み: 決裁に要る
      - 種別: 事実
        内容: 初期設定:入力項目、画面、閲覧権限などを、SFA ベンダーと連携しながら御社の業務に合わせて設定します
        行: [64]
        重み: 裏づけ
      - 種別: 事実
        内容: 既存データの移行:Excel の記録のうち、どの顧客のどの情報を移すかを決め、移行を支援します
        行: [65]
        重み: 裏づけ
      - 種別: 事実
        内容: 試行導入:一部の営業担当に先行して使っていただき、使いにくい点を直してから全体に広げます
        行: [66]
        重み: 裏づけ
      - 種別: 事実
        内容: 引き継ぎルールの整備:異動・退職の際に SFA に何を残し、後任者が何を確認するかを決め、社内のルールとして定めます
        行: [67]
        重み: 裏づけ
      - 種別: 事実
        内容: 効果測定と運用の引き渡し:効果目標に対する結果を測定し、支援終了後も御社だけで運用を続けられるよう体制を整えます
        行: [69]
        重み: 裏づけ

  - 名前: 現場で使われ続けるための工夫
    種類: 論証
    主張: 当社は、営業担当が記録を入れ続けることを最も重要な課題と考え、4つの工夫を組み込んでいます
    行: [71, 73]
    論拠: SFA は、入れただけでは効果を見込めず、営業担当が毎日記録を入れて、初めて使える情報がたまる
    根拠:
      - 種別: 意見
        内容: 営業担当が毎日記録を入れて、初めて引き継ぎにも新人育成にも使える情報がたまります
        行: [73]
        重み: 決裁に要る
      - 種別: 意見
        内容: SFA は、入れただけでは効果を見込めません
        行: [73]
        重み: 裏づけ
      - 種別: 推論
        内容: 御社の営業担当は平均年齢が高く、新しいツールへの抵抗も予想されます
        行: [75]
        重み: 裏づけ
      - 種別: 事実
        内容: 営業担当3名にうかがったところ、2名は賛成、1名は入力の手間を心配されていました。ただし、これは支援の終了後も入力が続くかを確かめたものではありません
        行: [75]
        重み: 裏づけ
      - 種別: 意見
        内容: 入力の手間が多いほど、記録は続きません。ヒアリングを通じて「引き継ぎに本当に必要な情報は何か」を現場と一緒に見極め、項目を絞り込みます
        行: [78]
        重み: 裏づけ
      - 種別: 事実
        内容: 試行メンバーには、若手だけでなくベテランの方にも入っていただきます。現場の第一線にいる方の意見を設定に反映し、実際に使える仕組みに近づけます。また、試行を経験した方が、全体展開の際に周囲へ使い方を伝える役割を担えます
        行: [81]
        重み: 裏づけ
      - 種別: 事実
        内容: 現在の日報や上長への報告がどのように作られているかを診断で確認し、SFA への入力で代わりにできるものは置き換えます。Excel と SFA の二重入力が生じないようにします
        行: [84]
        重み: 裏づけ
      - 種別: 事実
        内容: 集合研修だけで終わらせず、操作に不安のある方には個別にサポートします。全体展開の後も入力状況を確認し、記録が止まっている方には早めに声をかけます。ベテランの方に記録をお願いする際には、それがご本人の仕事を会社に残し、後輩に引き継ぐことでもあるとお伝えしていきます
        行: [87]
        重み: 裏づけ
    並列:
      切り口: 入力を続けてもらうための手立てで分けている
      項目:
        - 内容: 入力項目を最小限に絞る
          行: [77]
        - 内容: ベテランの担当者に試行段階から参加していただく
          行: [80]
        - 内容: 代わりにできる日報や報告は入力に置き換える
          行: [83]
        - 内容: 一人ひとりに合わせて支援する
          行: [86]

  - 名前: 引き継ぎによる失注の削減
    種類: 論証
    主張: 失注の原因が情報の抜け落ちであれば、その分の失注は減らせると見込みます
    行: [91, 93, 95]
    論拠: 本文にない(記録を確認できることと失注が減ることのあいだをつなぐ言葉は書かれていない)
    根拠:
      - 種別: 推論
        内容: 顧客ごとの訪問履歴や商談の経緯が SFA に記録され続ければ、後任者は着任前に過去のやりとりを確認できます
        行: [95]
        重み: 決裁に要る
      - 種別: 推論
        内容: 引き継ぎルールを整えることで、前任者の Excel と口頭の説明に頼る引き継ぎを改めます
        行: [95]
        重み: 裏づけ

  - 名前: 新人の立ち上がり期間の短縮
    種類: 論証
    主張: 新人の立ち上がり期間の短縮
    行: [97]
    論拠: 本文にない(経緯をつかんで訪問できることと、立ち上がりが短くなることのあいだをつなぐ言葉は書かれていない)
    根拠:
      - 種別: 推論
        内容: SFA に記録がたまれば、新人は担当する顧客の過去の記録を読んで、これまでの経緯をつかんだうえで訪問できると見込みます
        行: [99]
        重み: 決裁に要る
      - 種別: 推論
        内容: 上長も新人の訪問状況を SFA で確認でき、つまずきに早く気づいて助言しやすくなります
        行: [99]
        重み: 裏づけ

  - 名前: 同じ規模の食品卸での事例
    種類: 論証
    主張: 御社と同規模の食品卸であるB社では、SFA の導入後に受注率が12%から15%に上がりました
    行: [101]
    論拠: 本文にない(本文自身が、原因が営業記録の共有かどうかは言えず、指標も異なるとしている)
    根拠:
      - 種別: 事実
        内容: 御社と同規模の食品卸であるB社では、SFA の導入後に受注率が12%から15%に上がりました
        行: [103]
        重み: 裏づけ
    限界や条件:
      - 内容: 受注率が上がった原因が営業記録の共有かどうかは、この数字からは言えません。B社と御社では顧客の構成や営業体制が異なります。また、B社で改善したのは受注率であり、本提案で主に目指す引き継ぎ失注の削減や新人の立ち上がり短縮とは指標が異なります。B社と同じ数字をお約束するものではなく、御社での効果目標は現状診断の結果をもとに設定します
        行: [105]

  - 名前: 効果の測り方
    種類: 記述
    主張: 引き継ぎ顧客の失注率と新人の独り立ちまでの期間は、導入前後を比べて効果を確認します
    行: [107, 109]
    根拠:
      - 種別: 事実
        内容: 導入前の数値はフェーズ1で測定し、目標値は導入計画の中で御社と合意して決めます。失注率の定義も御社と決めます
        行: [109]
