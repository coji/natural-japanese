# doc.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。北都フーズの営業本部長と経営会議が読み、営業部門デジタル化支援を発注するかを決める提案書

主結論:
  主張: 当社は、この訪問記録を個人の手元ではなく会社の資産として蓄積し、活用できる状態にするご支援を提案します。
  行: [10, 12, 14, 20]
  決裁事項:
    - 内容: 最初の3か月で現状を診断し、続く6か月で SFA(営業支援システム)の導入と、現場で使われ続ける状態になるまでの定着を支援します。
      行: [14, 18]
    - 内容: 月額300万円、総額2,700万円(SFA のライセンス費は別途)
      行: [19]
    - 内容: 現状診断が終わる3か月目の時点で、診断結果をもとに導入フェーズへ進むかどうかをご判断いただけます
      行: [21]
  制約:
    - 内容: 9か月(現状診断 3か月+SFA 導入・定着支援 6か月)
      行: [18]
    - 内容: 月額300万円、総額2,700万円(SFA のライセンス費は別途)
      行: [19]
    - 内容: 御社の営業担当30名
      行: [12]
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 訪問記録が担当者それぞれの Excel にあるから、顧客の情報が後任に十分引き継がれず、失注が起きている
      行: [12]
      書き手の明示: あり
    - 種別: 前提
      内容: 営業担当が毎日記録を入れて、初めて引き継ぎにも新人育成にも使える情報がたまる
      行: [71]
      書き手の明示: あり
    - 種別: 前提
      内容: 引き継ぎ失注の金額は、投資額に見合う大きさである
      行: [14, 121]
      書き手の明示: なし
    - 種別: 前提
      内容: 引き継ぎで抜け落ちる経緯や約束事を、最小限に絞った入力項目で残せる
      行: [33, 74, 93]
      書き手の明示: なし
    - 種別: 前提
      内容: 3か月目に進まないと判断すれば、フェーズ2の費用は発生しない
      行: [21, 157]
      書き手の明示: なし
    - 種別: 前提
      内容: 支援期間の中で、導入前後を比べられるだけの引き継ぎと新人の配属が起きる
      行: [67, 107, 153]
      書き手の明示: なし
  依存:
    - 異動・退職のたびに失注が起きている
    - 今後、引き継ぎの機会は増えていく
    - 現場で使われ続けるための工夫
    - 引き継ぎによる失注の削減
    - 投資額に見合う効果があるかの判断について
    - 費用
    - 3か月目の継続判断

論点:
  - 名前: 顧客の情報が担当者個人のもとにある
    種類: 論証
    主張: どの顧客と、いつ、どのような話をしたのかは、基本的に担当者本人しか分かりません。
    行: [27, 29]
    論拠: 訪問記録が個人の Excel にあるため
    根拠:
      - 種別: 事実
        内容: 訪問記録が個人の Excel にある
        行: [29]
        重み: 決裁に要る
      - 種別: 事実
        内容: 書式や記録の細かさも人によって違います
        行: [29]
        重み: 裏づけ
      - 種別: 事実
        内容: 上長やほかの担当者が顧客の状況を知ろうとしても、本人に聞くほかないのが実情です
        行: [29]
        重み: 補足

  - 名前: 異動・退職のたびに失注が起きている
    種類: 論証
    主張: 御社ではこの引き継ぎの場面で実際に失注が起きています。
    行: [25, 31, 33]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 後任者は前任者の Excel と口頭の説明を手がかりに顧客を引き継ぐことになります
        行: [33]
        重み: 補足
      - 種別: 推論
        内容: 記録に残っていない経緯や顧客との約束事は、ここで抜け落ちやすくなります
        行: [33]
        重み: 裏づけ
      - 種別: 事実
        内容: 御社ではこの引き継ぎの場面で実際に失注が起きています
        行: [33]
        重み: 決裁に要る
    限界や条件:
      - 内容: どのような情報が抜けたことで失注に至ったのか、その件数と金額はどの程度か、は現状診断で具体的に確認します
        行: [33]

  - 名前: 今後、引き継ぎの機会は増えていく
    種類: 論証
    主張: 今後数年のうちに退職に伴う引き継ぎが増えていくと見込まれます。
    行: [35, 37]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 御社の営業担当は平均年齢が高く
        行: [37]
        重み: 決裁に要る
      - 種別: 意見
        内容: ベテラン担当者が長年かけて築いてきた顧客との関係や知見を、在籍しているうちに会社として残しておけるかどうかが問われています
        行: [37]
        重み: 裏づけ
      - 種別: 推論
        内容: 対策を始めるなら、早いほど残せる情報は多くなります
        行: [37]
        重み: 裏づけ

  - 名前: フェーズ1 現状診断
    種類: 記述
    主張: SFA を入れる前に、御社の営業の実態と、引き継ぎで何が起きているのかを把握する3か月の作業と成果物を並べている
    行: [41, 43, 45, 47]
    根拠:
      - 種別: 意見
        内容: ここを丁寧に行うことで、現場に合わない仕組みを入れてしまう事態を避けます
        行: [47]
        重み: 補足
      - 種別: 事実
        内容: 訪問記録の実態調査
        行: [49]
        重み: 裏づけ
      - 種別: 事実
        内容: 引き継ぎ失注の分析:過去の異動・退職で担当が替わった顧客を洗い出し、失注の件数・金額・原因を整理します
        行: [50]
        重み: 決裁に要る
      - 種別: 事実
        内容: 営業担当・管理職へのヒアリング
        行: [51]
        重み: 裏づけ
      - 種別: 事実
        内容: 新人の立ち上がりの実態把握
        行: [52]
        重み: 裏づけ
      - 種別: 事実
        内容: SFA の要件整理と製品選定の支援
        行: [53]
        重み: 裏づけ
      - 種別: 事実
        内容: 導入計画と効果目標の策定:フェーズ2の詳細な計画と、効果を測る指標・目標値を決めます
        行: [54]
        重み: 裏づけ
      - 種別: 事実
        内容: フェーズ1の成果物として、診断報告書、SFA の要件と製品比較、導入計画書(効果目標を含む)をお渡しします
        行: [56]
        重み: 決裁に要る
    並列:
      切り口: 診断の作業
      項目:
        - 内容: 訪問記録の実態調査
          行: [49]
        - 内容: 引き継ぎ失注の分析
          行: [50]
        - 内容: 営業担当・管理職へのヒアリング
          行: [51]
        - 内容: 新人の立ち上がりの実態把握
          行: [52]
        - 内容: SFA の要件整理と製品選定の支援
          行: [53]
        - 内容: 導入計画と効果目標の策定
          行: [54]

  - 名前: フェーズ2 SFA 導入・定着支援
    種類: 記述
    主張: フェーズ1で決めた計画に沿って SFA を導入し、営業担当が日常的に使う状態まで支援する6か月の作業を並べている
    行: [58, 60]
    根拠:
      - 種別: 事実
        内容: 初期設定
        行: [62]
        重み: 裏づけ
      - 種別: 事実
        内容: 既存データの移行:Excel の記録のうち、どの顧客のどの情報を移すかを決め、移行を支援します
        行: [63]
        重み: 裏づけ
      - 種別: 事実
        内容: 試行導入:一部の営業担当に先行して使っていただき、使いにくい点を直してから全体に広げます
        行: [64]
        重み: 裏づけ
      - 種別: 事実
        内容: 全体展開と研修:営業担当30名と管理職の方を対象に研修を行います
        行: [65]
        重み: 裏づけ
      - 種別: 事実
        内容: 引き継ぎルールの整備:異動・退職の際に SFA に何を残し、後任者が何を確認するかを決め、社内のルールとして定めます
        行: [66]
        重み: 裏づけ
      - 種別: 事実
        内容: 効果測定と運用の引き渡し:効果目標に対する結果を測定し、支援終了後も御社だけで運用を続けられるよう体制を整えます
        行: [67]
        重み: 裏づけ
    並列:
      切り口: 導入から引き渡しまでの作業
      項目:
        - 内容: 初期設定
          行: [62]
        - 内容: 既存データの移行
          行: [63]
        - 内容: 試行導入
          行: [64]
        - 内容: 全体展開と研修
          行: [65]
        - 内容: 引き継ぎルールの整備
          行: [66]
        - 内容: 効果測定と運用の引き渡し
          行: [67]

  - 名前: 現場で使われ続けるための工夫
    種類: 論証
    主張: 当社はこの点を最も重要な課題と考え、次の4つの工夫を組み込んでいます。
    行: [69, 71]
    論拠: 営業担当が毎日記録を入れて、初めて引き継ぎにも新人育成にも使える情報がたまります
    根拠:
      - 種別: 意見
        内容: SFA は、入れただけでは効果が出ません
        行: [71]
        重み: 裏づけ
      - 種別: 推論
        内容: 御社の営業担当は平均年齢が高く、新しいツールへの抵抗も予想されます
        行: [71]
        重み: 決裁に要る
      - 種別: 推論
        内容: 入力の手間が多いほど、記録は続きません
        行: [74]
        重み: 裏づけ
      - 種別: 意見
        内容: 現場の第一線にいる方の意見を設定に反映することで、実際に使える仕組みになります
        行: [77]
        重み: 補足
      - 種別: 事実
        内容: 現在の日報や上長への報告がどのように作られているかを診断で確認し、SFA への入力で代わりにできるものは置き換えます
        行: [80]
        重み: 補足
      - 種別: 事実
        内容: 集合研修だけで終わらせず、操作に不安のある方には個別にサポートします
        行: [83]
        重み: 補足
      - 種別: 事実
        内容: ベテランの方に記録をお願いする際には、それがご本人の仕事を会社に残し、後輩に引き継ぐことでもあるとお伝えしていきます
        行: [85]
        重み: 補足
    並列:
      切り口: 記録を続けてもらうための工夫(4つ)
      項目:
        - 内容: 入力項目を最小限に絞る
          行: [73, 74]
        - 内容: ベテランの担当者に試行段階から参加していただく
          行: [76, 77]
        - 内容: 入力することが本人の手間を減らす形にする
          行: [79, 80]
        - 内容: 一人ひとりに合わせて支援する
          行: [82, 83]

  - 名前: 引き継ぎによる失注の削減
    種類: 論証
    主張: 情報の抜け落ちによる失注を減らせます。
    行: [89, 91, 93]
    論拠: 顧客ごとの訪問履歴や商談の経緯が SFA にまとまるため、後任者は着任前に過去のやりとりを確認できます
    根拠:
      - 種別: 推論
        内容: 顧客ごとの訪問履歴や商談の経緯が SFA にまとまるため、後任者は着任前に過去のやりとりを確認できます
        行: [93]
        重み: 決裁に要る
      - 種別: 推論
        内容: 引き継ぎルールを整えることで、口頭説明だけに頼る引き継ぎがなくなり
        行: [93]
        重み: 決裁に要る

  - 名前: 新人の立ち上がり期間の短縮
    種類: 論証
    主張: 新人の立ち上がり期間が短縮される(見出しの言葉)
    行: [95, 97]
    論拠: 本文にない
    根拠:
      - 種別: 推論
        内容: 新人は担当する顧客の過去の記録を読んで、これまでの経緯をつかんだうえで訪問できます
        行: [97]
        重み: 決裁に要る
      - 種別: 推論
        内容: 上長も新人の訪問状況を SFA で確認できるため、つまずきに早く気づいて助言できます
        行: [97]
        重み: 決裁に要る

  - 名前: 同じ規模の食品卸での事例
    種類: 論証
    主張: 同業・同規模の会社で、営業記録の共有が成果につながった例です。
    行: [99, 101]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 御社と同規模の食品卸であるB社では、SFA の導入後に受注率が12%から15%に上がりました
        行: [101]
        重み: 裏づけ
    限界や条件:
      - 内容: B社と御社では顧客の構成や営業体制が異なります
        行: [103]
      - 内容: B社で改善したのは受注率であり、本提案で主に目指す引き継ぎ失注の削減や新人の立ち上がり短縮とは指標が異なります
        行: [103]
      - 内容: B社と同じ数字をお約束するものではなく、御社での効果目標は現状診断の結果をもとに設定します
        行: [103]

  - 名前: 効果の測り方
    種類: 記述
    主張: 3つの指標を使い、導入前後を比べて効果を確認する方法を並べている
    行: [105, 107]
    根拠:
      - 種別: 事実
        内容: 導入前の数値はフェーズ1で測定し、目標値は導入計画の中で御社と合意して決めます
        行: [107]
        重み: 裏づけ
      - 種別: 事実
        内容: 引き継ぎ顧客の失注率:担当が替わった顧客のうち、一定期間内に失注した割合
        行: [111]
        重み: 裏づけ
      - 種別: 事実
        内容: 新人の独り立ちまでの期間:入社(配属)から、単独で顧客を担当するまでの期間
        行: [112]
        重み: 裏づけ
      - 種別: 事実
        内容: SFA の入力率:訪問のうち、SFA に記録された割合
        行: [113]
        重み: 裏づけ
    並列:
      切り口: 効果を確かめる指標
      項目:
        - 内容: 引き継ぎ顧客の失注率
          行: [111]
        - 内容: 新人の独り立ちまでの期間
          行: [112]
        - 内容: SFA の入力率
          行: [113]

  - 名前: 投資額に見合う効果があるかの判断について
    種類: 論証
    主張: フェーズ1の最初の1か月で過去の引き継ぎ実績からこれらの数字を算出し、投資額に見合う効果が見込めるかをご報告します。
    行: [115, 121]
    論拠: 本文にない
    根拠:
      - 種別: 見積
        内容: 引き継ぎ失注の削減による効果は、おおよそ次の式で見積もれます。年間に担当が替わる顧客数 × 失注率の改善幅 × 1顧客あたりの年間取引額
        行: [117, 119]
        重み: 決裁に要る
      - 種別: 事実
        内容: 現時点で当社は御社の失注件数や取引額の資料を持っていないため、本資料では金額での試算を控えています
        行: [121]
        重み: 決裁に要る
    限界や条件:
      - 内容: 3か月目の継続判断は、この試算をもとに行っていただけます
        行: [121]

