      - 種別: 事実
        内容: 合計 9か月 2,700万円
        行: [131]
        重み: 決裁に要る
      - 種別: 事実
        内容: 当社の支援費用は月額300万円です
        行: [133]
        重み: 決裁に要る
      - 種別: 事実
        内容: SFA のライセンス費は上記に含まれていません。フェーズ1の製品選定の段階で候補製品ごとの見積もりをご提示します
        行: [135]
        重み: 決裁に要る

  - 名前: スケジュール
    種類: 記述
    主張: 9か月の月ごとの作業を並べている
    行: [139, 141]
    根拠:
