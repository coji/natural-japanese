        内容: 1か月目 現状診断 キックオフ、訪問記録の実態調査、引き継ぎ失注の分析と効果の試算
        行: [145]
        重み: 裏づけ
      - 種別: 事実
        内容: 2か月目 現状診断 営業担当・管理職へのヒアリング、新人の立ち上がりの実態把握
        行: [146]
        重み: 裏づけ
      - 種別: 事実
        内容: 3か月目 現状診断 SFA の要件整理と製品選定、導入計画と効果目標の策定、継続のご判断
        行: [147]
        重み: 裏づけ
      - 種別: 事実
