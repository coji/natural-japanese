# doc.review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。北都フーズの営業本部長と経営会議が読み、9か月・総額2,700万円の支援を発注するかを決める提案書

主結論:
  主張: 当社は、この訪問記録を個人の手元ではなく会社の資産として蓄積し、活用できる状態にするご支援を提案します。
  行: [10, 12, 14, 22]
  決裁事項:
    - 内容: 決めていただきたいのは、この9か月・総額2,700万円の支援を当社に発注するかどうかです。
      行: [16, 139]
    - 内容: 最初の3か月で現状を診断し、続く6か月で SFA(営業支援システム)の導入と、現場で使われ続ける状態になるまでの定着を支援します。
      行: [14, 20]
    - 内容: 現状診断が終わる3か月目の時点で、診断結果をもとに導入フェーズへ進むかどうかを営業本部長にご判断いただけます
      行: [23]
    - 内容: ご承認後、9か月分の契約を締結し、キックオフを行います
      行: [140]
  制約:
    - 内容: 9か月。現状診断3か月と SFA 導入・定着支援6か月
      行: [20]
    - 内容: 月額300万円、総額2,700万円。SFA のライセンス費は別途
      行: [21]
    - 内容: 御社の営業担当30名
      行: [12]
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 訪問記録が担当者それぞれの Excel にあるから、顧客の情報が後任に十分引き継がれず、失注につながっている
      行: [12]
      書き手の明示: あり
    - 種別: 前提
      内容: 営業担当が毎日記録を入れて、初めて引き継ぎにも新人育成にも使える情報がたまる
      行: [59]
      書き手の明示: あり
    - 種別: 前提
      内容: 引き継ぎ失注の金額は、投資額に見合う大きさである
      行: [14, 95]
      書き手の明示: なし
    - 種別: 前提
      内容: 3か月目に進まないと判断すれば、フェーズ2の費用は発生しない
      行: [23, 119]
      書き手の明示: なし
  依存:
    - 引き継ぎの場面での失注
    - 今後の引き継ぎの増加
    - 現場で使われ続けるための工夫
    - 引き継ぎによる失注の削減
    - 投資額に見合う効果の判断
    - 費用
    - 3か月目の継続判断

論点:
  - 名前: 担当者個人のもとにある顧客の情報
    種類: 論証
    主張: どの顧客と、いつ、どのような話をしたのかは、基本的に担当者本人しか分かりません。
    行: [27, 29, 31]
    論拠: 訪問記録が個人の Excel にあるため
    根拠:
      - 種別: 事実
        内容: 訪問記録が個人の Excel にある
        行: [31]
        重み: 決裁に要る
      - 種別: 事実
        内容: 書式や記録の細かさも人によって違います
        行: [31]
        重み: 裏づけ
      - 種別: 事実
        内容: 上長やほかの担当者が顧客の状況を知ろうとしても、本人に聞くほかないのが実情です
        行: [31]
        重み: 補足

  - 名前: 引き継ぎの場面での失注
    種類: 論証
    主張: 営業本部長からは、引き継ぎで2社を失ったと伺っています。
    行: [33, 35]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 営業本部長からは、引き継ぎで2社を失ったと伺っています
        行: [12, 35]
        重み: 決裁に要る
      - 種別: 事実
        内容: 去年の異動と退職は合わせて4名だったとも伺っています
        行: [35]
        重み: 裏づけ
      - 種別: 推論
        内容: 担当者が替わるとき、後任者は前任者の Excel と口頭の説明を手がかりに顧客を引き継ぐことになり、記録に残っていない経緯や顧客との約束事はここで抜け落ちやすくなります
        行: [35]
        重み: 裏づけ
    限界や条件:
      - 内容: どのような情報が抜けたことで失注に至ったのか、その件数と金額はどの程度かは、現状診断で具体的に確認します
        行: [35]

  - 名前: 今後の引き継ぎの増加
    種類: 論証
    主張: 今後数年のうちに退職に伴う引き継ぎが増えていくと見込まれます。
    行: [37, 39]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 御社の営業担当は平均年齢が高く
        行: [39]
        重み: 決裁に要る
      - 種別: 意見
        内容: ベテラン担当者が長年かけて築いてきた顧客との関係や知見を、在籍しているうちに会社として残しておけるかどうかが問われています
        行: [39]
        重み: 裏づけ
      - 種別: 推論
        内容: 対策を始めるなら、早いほど残せる情報は多くなります
        行: [39]
        重み: 裏づけ

  - 名前: フェーズ1 現状診断
    種類: 記述
    主張: SFA を入れる前の3か月で、御社の営業の実態と、引き継ぎで何が起きているのかを把握する作業と成果物を並べている
    行: [43, 45, 47, 49]
    根拠:
      - 種別: 意見
        内容: ここを丁寧に行うのは、現場に合わない仕組みを入れてしまう事態を避けるためです
        行: [49]
        重み: 補足
      - 種別: 事実
        内容: 過去の異動・退職で担当が替わった顧客を洗い出し、失注の件数・金額・原因を整理します
        行: [49, 151]
        重み: 裏づけ
      - 種別: 事実
        内容: フェーズ1の成果物として、診断報告書、効果の試算、SFA の要件と製品比較、候補製品ごとのお見積もり、効果目標を含む導入計画書をお渡しします
        行: [51]
        重み: 裏づけ
      - 種別: 事実
        内容: 付録Aのフェーズ1の作業6項目
        行: [146, 148, 150, 152, 153, 154, 155]
        重み: 裏づけ

  - 名前: フェーズ2 SFA 導入・定着支援
    種類: 記述
    主張: 続く6か月で、計画に沿って SFA を導入し、営業担当が日常的に使う状態まで支援する作業を並べている
    行: [53, 55]
    根拠:
      - 種別: 事実
        内容: 異動・退職の際に SFA に何を残し、後任者が何を確認するかも決め、社内のルールとして定めます
        行: [55, 163]
        重み: 裏づけ
      - 種別: 事実
        内容: 付録Aのフェーズ2の作業5項目
        行: [157, 159, 160, 161, 162, 164]
        重み: 裏づけ

  - 名前: 現場で使われ続けるための工夫
    種類: 論証
    主張: 当社は、現場で使われ続けることをこの支援で最も重要な点と考えています。
    行: [57, 59]
    論拠: 営業担当が毎日記録を入れて、初めて引き継ぎにも新人育成にも使える情報がたまります
    根拠:
      - 種別: 推論
        内容: 御社の営業担当は平均年齢が高く、新しいツールへの抵抗も予想されます
        行: [59]
        重み: 決裁に要る
      - 種別: 意見
        内容: SFA は、入れただけでは効果が出ません
        行: [59]
        重み: 裏づけ
      - 種別: 推論
        内容: 入力の手間が多いほど、記録は続きません
        行: [62]
        重み: 裏づけ
      - 種別: 事実
        内容: 現場の第一線にいる方の意見を設定に反映し、実際に使える仕組みに近づけます
        行: [65]
        重み: 補足
      - 種別: 事実
        内容: 現在の日報や上長への報告がどのように作られているかを診断で確認し、SFA への入力で代わりにできるものは置き換えます
        行: [68]
        重み: 補足
      - 種別: 事実
        内容: 集合研修だけで終わらせず、操作に不安のある方には個別にサポートします
        行: [71]
        重み: 補足
    並列:
      切り口: 記録を続けてもらうための工夫(4つ)
      項目:
        - 内容: 入力項目を最小限に絞る
          行: [61, 62]
        - 内容: ベテランの担当者に試行段階から参加していただく
          行: [64, 65]
        - 内容: 入力することが本人の手間を減らす形にする
          行: [67, 68]
        - 内容: 一人ひとりに合わせて支援する
          行: [70, 71]

  - 名前: 引き継ぎによる失注の削減
    種類: 論証
    主張: 情報の抜け落ちによる失注を減らせると見込んでいます。
    行: [75, 77, 79]
    論拠: 顧客ごとの訪問履歴や商談の経緯が SFA にまとまれば、後任者は着任前に過去のやりとりを確認できます
    根拠:
      - 種別: 推論
        内容: 顧客ごとの訪問履歴や商談の経緯が SFA にまとまれば、後任者は着任前に過去のやりとりを確認できます
        行: [79]
        重み: 決裁に要る
      - 種別: 推論
        内容: 引き継ぎルールを整えれば、口頭説明だけに頼る引き継ぎも減らせる見込みです
        行: [79]
        重み: 決裁に要る

  - 名前: 新人の立ち上がり期間の短縮
    種類: 論証
    主張: 新人が独り立ちするまでの期間も短くできると見込んでいます。
    行: [81, 83]
    論拠: 本文にない
    根拠:
      - 種別: 推論
        内容: 新人は担当する顧客の過去の記録を読んで、これまでの経緯をつかんだうえで訪問できます
        行: [83]
        重み: 裏づけ
      - 種別: 推論
        内容: 上長も新人の訪問状況を SFA で確認できるため、つまずきに早く気づいて助言しやすくなります
        行: [83]
        重み: 裏づけ

  - 名前: 同じ規模の食品卸での事例
    種類: 論証
    主張: 御社と同規模の食品卸であるB社では、SFA の導入後に受注率が12%から15%に上がりました。
    行: [85, 87]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 御社と同規模の食品卸であるB社では、SFA の導入後に受注率が12%から15%に上がりました
        行: [87]
        重み: 裏づけ
    限界や条件:
      - 内容: B社と御社では顧客の構成や営業体制が異なります
        行: [87]
      - 内容: B社で改善したのは受注率であり、本提案で主に目指す引き継ぎ失注の削減や新人の立ち上がり短縮とは指標が異なります
        行: [87]
      - 内容: B社と同じ数字をお約束するものではなく、御社での効果目標は現状診断の結果をもとに設定します
        行: [87]

  - 名前: 効果の測り方
    種類: 記述
    主張: 3つの指標で効果を確認する方法を並べている
    行: [89, 91]
    根拠:
      - 種別: 事実
        内容: 失注率と独り立ちまでの期間は、導入前の数値をフェーズ1で測定して導入後と比べます。目標値は導入計画の中で御社と合意して決めます
        行: [91]
        重み: 裏づけ
      - 種別: 事実
        内容: 引き継ぎ顧客の失注率:担当が替わった顧客のうち、一定期間内に失注した割合
        行: [182, 186]
        重み: 裏づけ
      - 種別: 事実
        内容: 新人の独り立ちまでの期間:入社または配属から、単独で顧客を担当するまでの期間
        行: [187]
        重み: 裏づけ
      - 種別: 事実
        内容: SFA の入力率:訪問のうち、SFA に記録された割合
        行: [188]
        重み: 裏づけ

  - 名前: 投資額に見合う効果の判断
    種類: 論証
    主張: 投資額に見合う効果が見込めるかは、フェーズ1の最初の1か月で試算してご報告します。
    行: [93, 95]
    論拠: 本文にない
    根拠:
      - 種別: 見積
        内容: 引き継ぎ失注の削減による効果は、おおよそ次の式で見積もれます。年間に担当が替わる顧客数 × 失注率の改善幅 × 1顧客あたりの年間取引額
        行: [95, 97]
        重み: 決裁に要る
      - 種別: 事実
        内容: 現時点で当社は御社の失注件数や取引額の資料を持っていないため、本資料では金額での試算を控えています
        行: [99]
        重み: 決裁に要る
      - 種別: 事実
        内容: 試算では、過去の引き継ぎ実績からこれらの数字を算出します
        行: [99]
        重み: 裏づけ
    限界や条件:
      - 内容: 3か月目の継続判断は、この試算をもとに行っていただけます
        行: [95]

  - 名前: 費用
    種類: 記述
    主張: フェーズごとの期間と費用、ライセンス費の扱いを並べている
    行: [103]
    根拠:
      - 種別: 事実
        内容: 当社の支援費用は月額300万円、総額2,700万円です
        行: [105]
        重み: 決裁に要る
      - 種別: 事実
        内容: フェーズ1 現状診断 3か月 900万円
        行: [109]
        重み: 決裁に要る
      - 種別: 事実
        内容: フェーズ2 SFA 導入・定着支援 6か月 1,800万円
        行: [110]
        重み: 決裁に要る
      - 種別: 事実
        内容: 合計 9か月 2,700万円
        行: [111]
        重み: 決裁に要る
      - 種別: 事実
        内容: SFA のライセンス費は上記に含まれていません。ライセンス費は選ぶ製品と利用人数によって決まるため、フェーズ1の製品選定の段階で候補製品ごとのお見積もりをご提示します
        行: [113]
        重み: 決裁に要る
      - 種別: 事実
        内容: 製品の決定は、そのお見積もりをご確認いただいてからで構いません
        行: [113]
        重み: 裏づけ

  - 名前: 3か月目の継続判断
    種類: 記述
    主張: 現状診断が終わった時点で、フェーズ2へ進むかどうかをご判断いただく段取りを書いている
    行: [117]
    根拠:
      - 種別: 事実
        内容: 現状診断が終わった時点で、診断報告書・効果の試算・SFA のお見積もり・導入計画をそろえてご報告します。営業本部長はその内容をもとに、フェーズ2へ進むかどうかをご判断いただけます
        行: [119]
        重み: 決裁に要る
      - 種別: 事実
        内容: 診断の結果、SFA 導入よりも先に取り組むべきことが見つかった場合は、その旨を率直にご報告します
        行: [119]
        重み: 裏づけ

  - 名前: スケジュールと進捗のご報告
    種類: 記述
    主張: 9か月の月ごとの作業と定例報告を並べている
    行: [45, 166]
    根拠:
      - 種別: 事実
        内容: 1か月目から3か月目の作業
        行: [170, 171, 172]
        重み: 裏づけ
      - 種別: 事実
        内容: 4か月目から9か月目の作業
        行: [173, 174, 175, 176, 177, 178]
        重み: 裏づけ
      - 種別: 事実
        内容: 月に1回、営業本部長に定例報告を行い、進捗と課題、次の月の予定をご説明します。判断が必要な事項はその場でご相談します
        行: [180]
        重み: 裏づけ

  - 名前: 体制
    種類: 記述
    主張: 当社の3名の役割と、御社に頼む協力を並べている
    行: [123, 125, 127, 190]
    根拠:
      - 種別: 事実
        内容: プロジェクトマネージャー 1名 全体の統括、営業本部長への報告、計画と進捗の管理
        行: [194]
        重み: 裏づけ
      - 種別: 事実
        内容: コンサルタント 1名 業務の診断、引き継ぎ失注の分析、引き継ぎルールの整備
        行: [195]
        重み: 裏づけ
      - 種別: 事実
        内容: コンサルタント 1名 SFA の要件整理と製品選定、初期設定、研修、定着支援
        行: [196]
        重み: 裏づけ
      - 種別: 事実
        内容: プロジェクトの責任者:営業本部長にお願いし、継続判断などの重要事項をご判断いただきます
        行: [129]
        重み: 裏づけ
      - 種別: 事実
        内容: 窓口のご担当者:社内の日程調整や資料のご提供をお願いする方を1名
        行: [130]
        重み: 裏づけ
      - 種別: 事実
        内容: 試行メンバー:フェーズ2の試行導入に参加いただく、ベテランの方を含む営業担当を数名
        行: [131]
        重み: 裏づけ
      - 種別: 事実
        内容: ヒアリングへのご協力:営業担当・管理職の方に、1人あたり1時間程度のお時間
        行: [132]
        重み: 裏づけ

  - 名前: 今後の進め方
    種類: 記述
    主張: 承認までの段取りと、経営会議の前に頼みたい資料を書いている
    行: [136]
    根拠:
      - 種別: 事実
        内容: 本資料について、営業本部長からご意見・ご質問をいただき、必要に応じて内容を修正します
        行: [138]
        重み: 裏づけ
      - 種別: 事実
        内容: 経営会議の前に、過去1〜2年の異動・退職の件数、そのときに担当が替わった顧客の数、失注件数と取引額をお教えいただければ、効果の概算を本資料に追加できます
        行: [142]
        重み: 裏づけ

対応なし:
  - 行: 1
    内容: 営業部門デジタル化支援のご提案
    理由: 意図の分かるもの(タイトル)
  - 行: 3
    内容: 北都フーズ株式会社 御中
    理由: 意図の分かるもの(宛先)
  - 行: 5
