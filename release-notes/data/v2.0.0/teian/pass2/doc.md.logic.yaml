  - 名前: 現場で使われ続けるための工夫
    種類: 論証
    主張: SFA は、入れただけでは効果が出ません。当社はこの点を最も重要な課題と考え、4つの工夫を組み込んでいます
    行: [69, 71, 85]
    論拠: 営業担当が毎日記録を入れて、初めて引き継ぎにも新人育成にも使える情報がたまる
    根拠:
      - 種別: 推論
        内容: 営業担当が毎日記録を入れて、初めて引き継ぎにも新人育成にも使える情報がたまります
        行: [71]
        重み: 決裁に要る
      - 種別: 推論
        内容: 御社の営業担当は平均年齢が高く、新しいツールへの抵抗も予想されます
        行: [71]
        重み: 裏づけ
      - 種別: 意見
        内容: ベテランの方に記録をお願いする際には、それがご本人の仕事を会社に残し、後輩に引き継ぐことでもあるとお伝えしていきます
        行: [85]
        重み: 補足
    並列:
      切り口: 記録が続かない理由ごとの工夫で分けている
      項目:
        - 内容: 入力項目を最小限に絞る。入力の手間が多いほど、記録は続きません
          行: [73, 74]
        - 内容: ベテランの担当者に試行段階から参加していただく。実際に使える仕組みになります
          行: [76, 77]
        - 内容: 入力することが本人の手間を減らす形にする。Excel と SFA の二重入力が生じないようにします
          行: [79, 80]
        - 内容: 一人ひとりに合わせて支援する。記録が止まっている方には早めに声をかけます
          行: [82, 83]

