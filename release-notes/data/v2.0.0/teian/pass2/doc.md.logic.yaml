    主張: 3か月で営業の実態と引き継ぎで何が起きているのかを把握し、3つの成果物を渡す
    行: [41, 43, 45, 47, 56]
    根拠:
      - 種別: 事実
        内容: ここを丁寧に行うことで、現場に合わない仕組みを入れてしまう事態を避けます
        行: [47]
        重み: 裏づけ
      - 種別: 事実
        内容: 成果物は診断報告書、SFA の要件と製品比較、導入計画書(効果目標を含む)
        行: [56]
        重み: 裏づけ
    並列:
