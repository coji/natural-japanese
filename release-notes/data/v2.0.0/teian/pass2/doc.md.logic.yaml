# doc.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。コンサルティング会社が北都フーズの営業本部長と経営会議に、営業部門のデジタル化支援の発注を決めてもらう提案書

主結論:
  主張: 当社は、この訪問記録を個人の手元ではなく会社の資産として蓄積し、活用できる状態にするご支援を提案します
  行: [14]
  決裁事項:
    - 内容: 最初の3か月で現状を診断し、続く6か月で SFA の導入と、現場で使われ続ける状態になるまでの定着を支援します。期間 9か月、費用 月額300万円、総額2,700万円(本文に「決めていただきたいこと」の一文はなく、行14と表と行189〜190から読んだ)
      行: [14, 18, 19, 189, 190]
  制約:
    - 内容: 期間 9か月(現状診断 3か月+SFA 導入・定着支援 6か月)
      行: [18]
    - 内容: 費用 月額300万円、総額2,700万円(SFA のライセンス費は別途)
      行: [19]
    - 内容: 現状診断が終わる3か月目の時点で、診断結果をもとに導入フェーズへ進むかどうかをご判断いただけます
      行: [21]
    - 内容: 対象は御社の営業担当30名
      行: [12, 65]
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 訪問記録が個人の Excel にあることが、引き継ぎの失注の原因である
      行: [12, 33]
      書き手の明示: あり
    - 種別: 前提
      内容: 引き継ぎによる失注の金額が、2,700万円とライセンス費に見合う大きさである
      行: [19, 121]
      書き手の明示: なし
    - 種別: 前提
      内容: 記録を SFA に集めれば、抜け落ちていた約束事や経緯も記録される
      行: [93]
      書き手の明示: なし
    - 種別: 前提
      内容: 営業担当30名が毎日 SFA に記録を入れ続ける
      行: [71]
      書き手の明示: あり
    - 種別: 前提
      内容: 今後の引き継ぎの増加は、いまの引き継ぎのやり方のままでは失注の増加につながる
      行: [37]
      書き手の明示: なし
    - 種別: 前提
      内容: 3か月目に進まないと判断したときは、フェーズ1の900万円で終えられる
      行: [21, 157]
      書き手の明示: なし
  依存: [顧客の情報が担当者個人のもとにある, 異動・退職のたびに失注が起きている, 今後、引き継ぎの機会は増えていく, 現場で使われ続けるための工夫, 引き継ぎによる失注の削減, 新人の立ち上がり期間の短縮, 投資額に見合う効果があるかの判断について, 費用, 3か月目の継続判断]

論点:
  - 名前: 本提案の要点
    種類: 記述
    主張: 課題、提案、期間・費用・効果・判断の区切りをまとめている
    行: [10, 12, 16, 18, 19, 20, 21]
    根拠:
      - 種別: 事実
        内容: 御社の営業担当30名の顧客訪問記録は、現在、担当者それぞれの Excel ファイルに保存されています
        行: [12]
        重み: 裏づけ
      - 種別: 推論
        内容: そのため担当者が異動・退職するたびに顧客の情報が後任に十分引き継がれず、失注が起きています
        行: [12]
        重み: 決裁に要る
      - 種別: 事実
        内容: 期待効果は引き継ぎによる失注の削減、新人が独り立ちするまでの期間の短縮
        行: [20]
        重み: 裏づけ

  - 名前: 顧客の情報が担当者個人のもとにある
    種類: 論証
    主張: 顧客の情報が担当者個人のもとにある
    行: [25, 27, 29]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: どの顧客と、いつ、どのような話をしたのかは、基本的に担当者本人しか分かりません
        行: [29]
        重み: 決裁に要る
      - 種別: 事実
        内容: 書式や記録の細かさも人によって違います
        行: [29]
        重み: 裏づけ
      - 種別: 事実
        内容: 上長やほかの担当者が顧客の状況を知ろうとしても、本人に聞くほかないのが実情です
        行: [29]
        重み: 裏づけ

  - 名前: 異動・退職のたびに失注が起きている
    種類: 論証
    主張: 異動・退職のたびに失注が起きている
    行: [31, 33]
    論拠: 記録に残っていない経緯や顧客との約束事は、引き継ぎで抜け落ちやすい
    根拠:
      - 種別: 事実
        内容: 後任者は前任者の Excel と口頭の説明を手がかりに顧客を引き継ぐことになります
        行: [33]
        重み: 裏づけ
      - 種別: 推論
        内容: 記録に残っていない経緯や顧客との約束事は、ここで抜け落ちやすくなります
        行: [33]
        重み: 裏づけ
      - 種別: 事実
        内容: 御社ではこの引き継ぎの場面で実際に失注が起きています
        行: [33]
        重み: 決裁に要る
    限界や条件:
      - 内容: どのような情報が抜けたことで失注に至ったのか、その件数と金額はどの程度か、は現状診断で具体的に確認します
        行: [33]

  - 名前: 今後、引き継ぎの機会は増えていく
    種類: 論証
    主張: 今後、引き継ぎの機会は増えていく
    行: [35, 37]
    論拠: 平均年齢が高いので、退職に伴う引き継ぎが増える
    根拠:
      - 種別: 事実
        内容: 御社の営業担当は平均年齢が高い
        行: [37]
        重み: 決裁に要る
      - 種別: 推論
        内容: 今後数年のうちに退職に伴う引き継ぎが増えていくと見込まれます
        行: [37]
        重み: 決裁に要る
      - 種別: 意見
        内容: ベテラン担当者が長年かけて築いてきた顧客との関係や知見を、在籍しているうちに会社として残しておけるかどうかが問われています
        行: [37]
        重み: 補足
      - 種別: 推論
        内容: 対策を始めるなら、早いほど残せる情報は多くなります
        行: [37]
        重み: 裏づけ

