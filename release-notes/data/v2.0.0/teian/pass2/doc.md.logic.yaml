  - 名前: 同じ規模の食品卸での事例
    種類: 論証
    主張: 同業・同規模の会社で、営業記録の共有が成果につながった例です
    行: [99, 101]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 御社と同規模の食品卸であるB社では、SFA の導入後に受注率が12%から15%に上がりました
        行: [101]
        重み: 決裁に要る
    限界や条件:
      - 内容: B社と御社では顧客の構成や営業体制が異なります。B社で改善したのは受注率であり、本提案で主に目指す引き継ぎ失注の削減や新人の立ち上がり短縮とは指標が異なります。B社と同じ数字をお約束するものではなく、御社での効果目標は現状診断の結果をもとに設定します
        行: [103]

