# doc.review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。コンサルティング会社が北都フーズの営業本部長と経営会議に、9か月・総額2,700万円の支援の発注を決めてもらう提案書

主結論:
  主張: 当社は、この訪問記録を個人の手元ではなく会社の資産として蓄積し、活用できる状態にするご支援を提案します
  行: [14]
  決裁事項:
    - 内容: 決めていただきたいのは、この9か月・総額2,700万円の支援を当社に発注するかどうかです
      行: [16]
  制約:
    - 内容: 期間 9か月。現状診断3か月と SFA 導入・定着支援6か月
      行: [20]
    - 内容: 費用 月額300万円、総額2,700万円。SFA のライセンス費は別途
      行: [21]
    - 内容: 現状診断が終わる3か月目の時点で、診断結果をもとに導入フェーズへ進むかどうかを営業本部長にご判断いただけます。進まない場合はフェーズ1の900万円で終わり、フェーズ2の1,800万円は発生しません
      行: [23]
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 顧客の情報が後任に十分引き継がれないことが失注につながっている
      行: [12]
      書き手の明示: あり
    - 種別: 前提
      内容: 効果を複数年分で見れば、支援費用に見合う
      行: [80]
      書き手の明示: なし
  依存: [引き継ぎの場面での失注, 現場で使われ続けるための工夫, 引き継ぎによる失注の削減, 投資額に見合う効果の判断, 費用, 3か月目の継続判断]

論点:
  - 名前: 本提案の要点
    種類: 記述
    主張: 課題、提案、頼むことをまとめている
    行: [10, 12, 18, 22]
    根拠:
      - 種別: 推論
        内容: 担当者が異動・退職するときに顧客の情報が後任に十分引き継がれず、失注につながっていると当社は見ています
        行: [12]
        重み: 決裁に要る
      - 種別: 事実
        内容: 営業本部長に見せていただいた台帳では、去年の異動・退職4名の担当顧客38社のうち2社の取引が翌年になくなり、その額は合計で年間約1,200万円です
        行: [12]
        重み: 決裁に要る
      - 種別: 事実
        内容: 期待効果は引き継ぎによる失注の削減、新人が独り立ちするまでの期間の短縮
        行: [22]
        重み: 裏づけ

  - 名前: 担当者個人のもとにある顧客の情報
    種類: 論証
    主張: 顧客の情報が担当者個人のもとにある
    行: [27, 29]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 訪問記録が個人の Excel にあるため、どの顧客と、いつ、どのような話をしたのかは、基本的に担当者本人しか分かりません。書式や記録の細かさも人によって違います。上長やほかの担当者が顧客の状況を知ろうとしても、本人に聞くほかないのが実情です
        行: [31]
        重み: 裏づけ

  - 名前: 引き継ぎの場面での失注
    種類: 論証
    主張: 去年の異動・退職4名の担当顧客38社で、2社を失い、5社の取引が半分以下に減った
    行: [33]
    論拠: 失った2社の先方が、前任者と話していた条件が引き継がれていないと言っている
    根拠:
      - 種別: 事実
        内容: 去年の異動・退職4名の担当顧客38社のうち、翌年の取引がなくなったのは2社で、合計で年間約1,200万円です
        行: [35]
        重み: 決裁に要る
      - 種別: 事実
        内容: 取引が半分以下に減った顧客も5社あり、減少分の合計は年間約900万円です
        行: [35]
        重み: 決裁に要る
      - 種別: 事実
        内容: 失った2社は、担当が替わった直後に先方から「前任者と話していた条件が引き継がれていない」と言われて失注しました
        行: [35]
        重み: 決裁に要る
      - 種別: 事実
        内容: 後任者は前任者の Excel と口頭の説明を手がかりに顧客を引き継ぎます
        行: [37]
        重み: 裏づけ
      - 種別: 推論
        内容: 記録に残っていない経緯や顧客との約束事は、ここで抜け落ちやすくなります
        行: [37]
        重み: 裏づけ

  - 名前: 今後の引き継ぎの増加
    種類: 論証
    主張: 今後数年のうちに退職に伴う引き継ぎが増えていくと見込まれます
    行: [39]
    論拠: 平均年齢が高いので、退職に伴う引き継ぎが増える
    根拠:
      - 種別: 事実
        内容: 御社の営業担当は平均年齢が高い
        行: [41]
        重み: 裏づけ
      - 種別: 意見
        内容: ベテラン担当者が長年かけて築いてきた顧客との関係や知見を、在籍しているうちに会社として残しておけるかどうかが問われています
        行: [41]
        重み: 補足
      - 種別: 推論
        内容: 対策を始めるなら、早いほど残せる情報は多くなります
        行: [41]
        重み: 裏づけ

  - 名前: ご提案内容
    種類: 記述
    主張: 支援の2つのフェーズを並べている
    行: [45, 47, 49, 53]
    根拠:
      - 種別: 事実
        内容: SFA を入れる前の3か月で、御社の営業の実態と、引き継ぎで何が起きているのかを把握します
        行: [51]
        重み: 決裁に要る
      - 種別: 事実
        内容: 現場に合わない仕組みを入れてしまう事態を避けるためです
        行: [51]
        重み: 裏づけ
      - 種別: 事実
        内容: 成果物として、診断報告書、SFA の要件と製品比較、効果目標を含む導入計画書をお渡しします
        行: [51]
        重み: 裏づけ
      - 種別: 事実
        内容: 続く6か月で、フェーズ1で決めた計画に沿って SFA を導入し、営業担当が日常的に使う状態まで支援します
        行: [55]
        重み: 決裁に要る
      - 種別: 事実
        内容: 異動・退職の際に SFA に何を残し、後任者が何を確認するかも決め、社内のルールとして定めます
        行: [55]
        重み: 裏づけ

  - 名前: 現場で使われ続けるための工夫
    種類: 論証
    主張: 当社は、現場で使われ続けることをこの支援で最も重要な点と考えています
    行: [57]
    論拠: 営業担当が毎日記録を入れて、初めて引き継ぎにも新人育成にも使える情報がたまる
    根拠:
      - 種別: 推論
        内容: SFA は、入れただけでは効果が出ません。営業担当が毎日記録を入れて、初めて引き継ぎにも新人育成にも使える情報がたまります
        行: [59]
        重み: 決裁に要る
      - 種別: 推論
        内容: 御社の営業担当は平均年齢が高く、新しいツールへの抵抗も予想されます
        行: [59]
        重み: 裏づけ
    並列:
      切り口: 記録が続かない理由ごとの工夫で分けている
      項目:
        - 内容: 入力項目を最小限に絞る
          行: [61]
        - 内容: ベテランの担当者に試行段階から参加していただく
          行: [62]
        - 内容: 入力することが本人の手間を減らす形にする
          行: [63]
        - 内容: 一人ひとりに合わせて支援する
          行: [64]

  - 名前: 引き継ぎによる失注の削減
    種類: 論証
    主張: 情報の抜け落ちによる失注を減らせる見込みです
    行: [68, 70]
    論拠: 訪問履歴と経緯が SFA にまとまれば、後任者が着任前に確認できる
    根拠:
      - 種別: 推論
        内容: 顧客ごとの訪問履歴や商談の経緯が SFA にまとまれば、後任者は着任前に過去のやりとりを確認できます
        行: [72]
        重み: 決裁に要る
      - 種別: 推論
        内容: 引き継ぎルールを整えることで、情報の抜け落ちによる失注を減らせる見込みです
        行: [72]
        重み: 決裁に要る
      - 種別: 事実
        内容: 失注は、御社とご相談のうえ、担当交代の翌年に取引がなくなった顧客とします
        行: [72]
        重み: 裏づけ

  - 名前: 新人の立ち上がり期間の短縮
    種類: 論証
    主張: 新人の立ち上がり期間の短縮
    行: [74]
    論拠: 本文にない
    根拠:
      - 種別: 推論
        内容: 記録がたまれば、新人は担当する顧客の過去の記録を読んで、これまでの経緯をつかんだうえで訪問できます
        行: [76]
        重み: 裏づけ
      - 種別: 推論
        内容: 上長も新人の訪問状況を SFA で確認でき、つまずきに早く気づいて助言できます
        行: [76]
        重み: 補足

  - 名前: 投資額に見合う効果の判断
    種類: 論証
    主張: 去年の実績では、失注と取引の減少をすべて防げたとしても、効果は年間約2,100万円で、支援費用の総額2,700万円を下回ります
    行: [78, 80]
    論拠: 効果の式に去年の実績を入れた額と、支援費用を比べる
    根拠:
      - 種別: 見積
        内容: 去年の担当交代は38社で、失注は2社でした。2社をすべて防げた場合の効果は、失った取引の年間約1,200万円です。これに取引が半分以下に減った5社の減少分、年間約900万円を足すと、年間約2,100万円になります。いずれも1年分の取引額です
        行: [84]
        重み: 決裁に要る
      - 種別: 見積
        内容: 年間に担当が替わる顧客数 × 失注率の改善幅 × 1顧客あたりの年間取引額
        行: [82]
        重み: 裏づけ
      - 種別: 事実
        内容: フェーズ1の最初の1か月で過去の引き継ぎ実績からこれらの数字を算出し、投資額に見合う効果が見込めるかをご報告します。3か月目の継続判断は、この試算をもとに行っていただけます
        行: [86]
        重み: 決裁に要る

  - 名前: 同じ規模の食品卸での事例
    種類: 論証
    主張: 御社と同規模の食品卸であるB社の例
    行: [88]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 御社と同規模の食品卸であるB社では、SFA の導入後に受注率が12%から15%に上がりました
        行: [90]
        重み: 裏づけ
    限界や条件:
      - 内容: B社と御社では顧客の構成や営業体制が異なり、改善した受注率も本提案で主に目指す指標とは異なります。B社と同じ数字をお約束するものではなく、御社での効果目標は現状診断の結果をもとに設定します
        行: [90]

  - 名前: 効果の測り方
    種類: 記述
    主張: 指標を使って導入前後を比べる
    行: [92]
    根拠:
      - 種別: 事実
        内容: 指標を使って導入前後を比べ、効果を確認します。導入前の数値はフェーズ1で測定し、目標値は導入計画の中で御社と合意して決めます。指標は付録Dにまとめました
        行: [94]
        重み: 裏づけ

  - 名前: 費用
    種類: 記述
    主張: フェーズごとの費用と、別途となるライセンス費を並べている
    行: [98, 100]
    根拠:
      - 種別: 事実
        内容: フェーズ1 現状診断 3か月 900万円
        行: [102]
        重み: 決裁に要る
      - 種別: 事実
        内容: フェーズ2 SFA 導入・定着支援 6か月 1,800万円
        行: [103]
        重み: 決裁に要る
      - 種別: 事実
        内容: 合計 9か月 2,700万円
        行: [104]
        重み: 決裁に要る
      - 種別: 事実
        内容: 当社の支援費用は月額300万円です
        行: [106]
        重み: 決裁に要る
      - 種別: 事実
        内容: SFA のライセンス費は上記に含まれていません。ライセンス費は選ぶ製品と利用人数によって決まるため、フェーズ1の製品選定の段階で候補製品ごとの見積もりをご提示します。製品の決定は、そのお見積もりをご確認いただいてからで構いません
        行: [108]
        重み: 決裁に要る

  - 名前: 3か月目の継続判断
    種類: 記述
    主張: 現状診断が終わった時点で報告をそろえ、営業本部長がフェーズ2へ進むかどうかを判断する
    行: [112, 114]
    根拠:
      - 種別: 事実
        内容: 現状診断が終わった時点で、診断報告書・効果の試算・SFA のお見積もり・導入計画をそろえてご報告します。営業本部長には、その内容をもとに、フェーズ2へ進むかどうかをご判断いただけます。進まない場合はフェーズ1の900万円で終わり、フェーズ2の1,800万円は発生しません。契約は2つに分け、フェーズ2の契約はこの報告のあとに結びます
        行: [116]
        重み: 決裁に要る
      - 種別: 事実
        内容: 診断の結果、SFA 導入よりも先に取り組むべきことが見つかった場合は、その旨を率直にご報告します
        行: [116]
        重み: 裏づけ

