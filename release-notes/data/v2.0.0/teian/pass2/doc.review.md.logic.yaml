      行: [14]
    - 内容: 期間 9か月。現状診断が3か月、SFA 導入・定着支援が6か月
      行: [18]
    - 内容: 費用 月額300万円、総額2,700万円。SFA のライセンス費は別途
      行: [19]
    - 内容: 経営会議で、9か月・総額2,700万円の支援の発注をご審議いただきます
      行: [154]
    - 内容: ご承認後、フェーズ1の契約を締結し、キックオフを行います。フェーズ2の契約は、3か月目の報告のあとに結びます
      行: [155]
  制約:
    - 内容: 現状診断が終わる3か月目の時点で、診断結果をもとに導入フェーズへ進むかどうかをご判断いただけます。進まない場合はフェーズ1の900万円で終わり、フェーズ2の1,800万円は発生しません
      行: [21, 145]
    - 内容: 対象は営業担当30名
      行: [12, 69]
    - 内容: SFA のライセンス費は別途
      行: [19, 137]
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 記録が個人の手元にあることが、この失注につながっている
      行: [12]
      書き手の明示: あり
    - 種別: 前提
      内容: 営業担当が毎日記録を入れれば、引き継ぎにも新人育成にも使える情報がたまる
      行: [75]
      書き手の明示: あり
  依存: [異動・退職で失注が起きている, 今後、引き継ぎの機会は増えていく, 現場で使われ続けるための工夫, 引き継ぎによる失注の削減, 投資額に見合う効果の判断, 費用, 3か月目の継続判断]

論点:
  - 名前: 顧客の情報が担当者個人のもとにある
    種類: 論証
    主張: 顧客の情報が担当者個人のもとにある
    行: [27]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 御社の営業担当30名の顧客訪問記録は、現在、担当者それぞれの Excel ファイルに保存されています
        行: [12]
        重み: 裏づけ
      - 種別: 推論
        内容: どの顧客と、いつ、どのような話をしたのかは、基本的に担当者本人しか分かりません。書式や記録の細かさも人によって違います。上長やほかの担当者が顧客の状況を知るには、本人に聞くことが多いと見ています
        行: [29]
        重み: 裏づけ

  - 名前: 異動・退職で失注が起きている
    種類: 論証
    主張: 記録が個人の手元にあることが、この失注につながっていると当社は見ています
    行: [12, 31]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 営業本部長に見せていただいた台帳では、昨年の異動・退職は4名で、その担当顧客は合計38社でした。このうち2社からは、担当が替わった直後に「前任者と話していた条件が引き継がれていない」と言われ、翌年の取引がなくなりました。失った取引は合計で年間約1,200万円です
        行: [35]
        重み: 決裁に要る
      - 種別: 事実
        内容: ほかに5社で取引が半分以下に減り、減少分は合計で年間約900万円でした
        行: [35]
        重み: 裏づけ
      - 種別: 推論
        内容: 後任者は前任者の Excel と口頭の説明を手がかりに顧客を引き継ぐことになります。記録に残っていない経緯や顧客との約束事は、ここで抜け落ちやすいと見ています
        行: [33]
        重み: 裏づけ
      - 種別: 事実
        内容: 失注の定義は、御社とご相談して「担当交代の翌年に取引がなくなった顧客」とします。この定義では、昨年の失注は2社です
        行: [37]
        重み: 裏づけ
    限界や条件:
      - 内容: どのような情報が抜けたことで失注に至ったのかは、現状診断で具体的に確認します
        行: [37]

