        行: [120]
        重み: 裏づけ
      - 種別: 事実
        内容: 経営会議でご審議いただきます
        行: [121]
        重み: 決裁に要る
      - 種別: 事実
        内容: ご承認後、フェーズ1の契約を締結し、キックオフを行います
        行: [122]
        重み: 決裁に要る

