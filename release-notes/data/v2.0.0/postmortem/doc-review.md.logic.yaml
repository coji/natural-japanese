# doc-review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 報告しつつ決めてもらう文書。10月21日の受注管理システムの障害について、情報システム部長と営業本部長に報告し、再発防止の3つの方向と、改修が原因かどうかの調査に1週間かけることの了承を求める

主結論:
  主張: 決めていただきたいことが2つある。再発防止の3つの方向でよいかと、受注検索の改修が障害の原因かどうかの調査に1週間かけてよいかである。10月21日(火)の午前中、受注管理システムの Web 画面が1時間半ほど応答しなくなった。アプリケーションサーバーのメモリが上限に達したためと見ていて、サーバーを再起動し、11:50 ごろに復旧した。メモリが上限に達した原因は確定しておらず、前日の夕方に本番へ反映した受注検索の改修を疑っている。改修は切り戻しておらず、本番に残っている。再起動後はメモリ使用量を1時間ごとに見ていて、10月28日の時点で再発はない
  行: [6, 8, 10, 14]
  決裁事項:
    - 内容: 再発防止の3つの方向でよいか
      行: [8, 39]
    - 内容: 受注検索の改修が障害の原因かどうかの調査に1週間かけてよいか
      行: [8]
  制約:
    - 内容: 具体的な内容、担当、期限は、調査の結果が出てから改めて出します
      行: [39]
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 画面が応答しなくなり始めたのは、監視の通知が出た 10:15 ごろである(10:15 から 11:50 までを「1時間半ほど」としている)
      行: [10, 21]
      書き手の明示: なし
    - 種別: 前提
      内容: 入力に失敗した約40件は、今回の障害によって失敗した
      行: [12, 35]
      書き手の明示: なし
    - 種別: 前提
      内容: 改修を本番に残したままでも、調査の1週間のあいだ再発に備えられる
      行: [8, 14]
      書き手の明示: なし
    - 種別: 前提
      内容: 原因が確定していない段階でも、3つの方向の了承を求められる
      行: [8, 31, 39]
      書き手の明示: なし
  依存: [経緯, 原因, 影響, 再発防止策]

論点:
  - 名前: 経緯
    種類: 記述
    主張: 改修の反映から復旧までの出来事を時刻順に並べる
    行: [16, 18]
    根拠:
      - 種別: 事実
        内容: 10月20日 夕方、受注検索の改修を本番に反映した。レビューは1人で行った
        行: [20]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 10:15、監視の通知が出て、運用チームが調べた。メモリが上限に達していた
        行: [21]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 11:05、サーバーを再起動した
        行: [22]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 11:50 ごろ、復旧した
        行: [23]
        重み: 裏づけ
      - 種別: 事実
        内容: 通知から再起動までに50分、再起動から復旧までに約45分かかった
        行: [25]
        重み: 裏づけ

  - 名前: 原因
    種類: 論証
    主張: 直接の原因は、メモリが上限に達したことと見ている。メモリが上限に達した理由は確定していない
    行: [27, 29, 31]
    論拠: 本文にない(メモリの上限到達が応答停止を起こしたと言える理由は書かれておらず、調査で状態を確認し、再起動のあとに復旧したことだけが書かれている)
    根拠:
      - 種別: 事実
        内容: 調査でこの状態を確認し、サーバーの再起動のあとに復旧した
        行: [29]
        重み: 決裁に要る
      - 種別: 事実
        内容: 改修を疑う根拠は反映と障害の時期が近いことだけで、改修がメモリの使用量を増やしたことはまだ確かめていない
        行: [31]
        重み: 決裁に要る
      - 種別: 事実
        内容: 半年前に1度、同じサーバーのメモリで通知が出たことがある。そのときは再起動で収まり、原因は調べていない
        行: [31]
        重み: 決裁に要る

  - 名前: 影響
    種類: 論証
    主張: 約40件の分は、顧客に再入力の手間をかけている
    行: [33, 35]
    論拠: 失敗した分は、営業が顧客に再入力を頼んだ
    根拠:
      - 種別: 事実
        内容: この時間帯に営業が入力した注文約300件のうち約40件(約13%)が入力に失敗し、営業が顧客に再入力を頼んだ
        行: [12, 35]
        重み: 決裁に要る
      - 種別: 事実
        内容: 顧客からの問い合わせはなかった
        行: [12]
        重み: 裏づけ
      - 種別: 推論
        内容: 残りの約260件は入力できている
        行: [35]
        重み: 裏づけ
    限界や条件:
      - 内容: 入力し直すのが営業か顧客かは確認中
        行: [12]

  - 名前: 再発防止策
    種類: 論証
    主張: 次の3つの方向でよいかの了承をお願いする
    行: [37, 39, 41]
    論拠: 本文にない(表の「今回の障害との関係」は今回の出来事を書くだけで、その策が再発を防ぐ理由は書かれていない)
    根拠:
      - 種別: 事実
        内容: 改修のメモリ使用量の確認。改修がメモリの使用量を増やしたかは、まだ確かめていない
        行: [43]
        重み: 決裁に要る
      - 種別: 事実
        内容: 監視のしきい値(通知を出す基準の値)の見直し。今回、運用チームが調べ始めたきっかけは 10:15 の通知だった
        行: [44]
        重み: 決裁に要る
      - 種別: 推論
        内容: レビュー体制の強化。今回の改修のレビューは1人で行った。障害との関係は、改修が原因かどうかが分かるまで判断できない
        行: [45]
        重み: 決裁に要る
    並列:
      切り口: 本文は切り口を書いていない。表の列は「今回の障害との関係」
      項目:
        - 内容: 改修のメモリ使用量の確認
          行: [43]
        - 内容: 監視のしきい値(通知を出す基準の値)の見直し
          行: [44]
        - 内容: レビュー体制の強化
          行: [45]
    限界や条件:
      - 内容: 1つ目の確認は改修が原因かどうかを判断する材料になり、結果によっては、ほかの2つの策の中身も変わることがある
        行: [47]

対応なし:
  - 行: 1
    内容: 受注管理システム障害報告書(10月21日発生分)
    理由: 意図の分かるもの(タイトル)
  - 行: 3
    内容: 宛先:情報システム部長、営業本部長
    理由: 意図の分かるもの(宛先)
  - 行: 4
    内容: 作成:情報システム部 運用チーム
    理由: 意図の分かるもの(作成者)
