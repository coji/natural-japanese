# doc.review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 報告し、了承を求める文書。10月21日の受注管理システム障害の経過、原因の調査状況、影響を情報システム部長と営業本部長に報告し、再発防止の3つの方向と調査の1週間の了承を求める

主結論:
  主張: 10月21日(火)の午前中、受注管理システムの Web 画面が1時間半ほど応答しなくなった。残りの約260件は入力できているので、止まり方が全面的だったのか断続的だったのかは確認中。メモリが上限に達した原因はまだ確定しておらず、受注検索の改修を疑っている。改修は切り戻しておらず、本番に残っている。再起動後はメモリ使用量を1時間ごとに見ていて、10月28日の時点で再発はない
  行: [6, 10, 12, 14]
  決裁事項:
    - 内容: 了承をお願いしたいのは、再発防止の3つの方向と、受注検索の改修が原因かどうかの調査に1週間かけることの2つです
      行: [8, 41, 49]
  制約:
    - 内容: 防止策の中身、担当、期限は、調査の結果が出てから改めて出します
      行: [8]
    - 内容: 1週間あればできる見込みです
      行: [49]
  比べた案:
    - 内容: なし
      行: [41]
  前提:
    - 種別: 前提
      内容: 10:15 の通知の時刻が、Web 画面が応答しなくなった時刻とほぼ同じである
      行: [10, 21]
      書き手の明示: なし
    - 種別: 前提
      内容: メモリが上限に達したことで Web 画面が応答しなくなった
      行: [10, 29]
      書き手の明示: あり
    - 種別: 前提
      内容: 障害の前に入った変更で、時期が近いものは受注検索の改修だけである
      行: [31]
      書き手の明示: なし
  依存: [原因, 影響, 再発防止策]

