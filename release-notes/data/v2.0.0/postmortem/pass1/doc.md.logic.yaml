# doc.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 報告する文書。10月21日の受注管理システム障害の経過、原因の調査状況、影響、検討中の再発防止策を、情報システム部長と営業本部長に報告する。決めてもらうことは本文に書かれていない

主結論:
  主張: 10月21日(火)の午前中、受注管理システムの Web 画面が1時間半ほど応答しなくなった。メモリが上限に達した原因はまだ確定していない
  行: [6, 8, 10, 12]
  決裁事項: []
  制約: []
  比べた案:
    - 内容: なし
      行: [41]
  前提:
