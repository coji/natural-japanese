    種類: 論証
    主張: 直接の原因はアプリケーションサーバーのメモリが上限に達したことで、メモリが上限に達した理由は確定していない
    行: [25, 27, 29]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 調査でメモリが上限に達した状態を確認し、サーバーの再起動のあとに復旧した
        行: [27]
        重み: 決裁に要る
      - 種別: 推論
        内容: 疑っているのは前日の夕方に反映した受注検索の改修
        行: [12, 29]
        重み: 決裁に要る
      - 種別: 事実
        内容: 疑う根拠は反映と障害の時期が近いことだけで、改修がメモリの使用量を増やしたことはまだ確かめていない
        行: [29]
        重み: 決裁に要る
      - 種別: 事実
        内容: 改修のレビューは1人で行った
        行: [31]
        重み: 補足
    限界や条件:
