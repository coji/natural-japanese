      内容: 10:15 の通知の時刻が、Web 画面が応答しなくなった時刻とほぼ同じである
      行: [8, 19]
      書き手の明示: なし
    - 種別: 前提
      内容: メモリが上限に達したことで Web 画面が応答しなくなった
      行: [8, 27]
      書き手の明示: あり
    - 種別: 前提
      内容: 障害の前に入った変更で、時期が近いものは受注検索の改修だけである
      行: [29]
      書き手の明示: なし
    - 種別: 前提
      内容: 失敗した約40件は、顧客に頼んだ再入力で回復している
      行: [10, 35]
      書き手の明示: なし
  依存: [経緯, 原因, 影響, 再発防止策]

