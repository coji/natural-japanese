# doc.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 報告する文書。10月21日の受注管理システムの障害について、情報システム部長と営業本部長に経緯、原因、影響、再発防止策を報告する。読み手に何かを決めてもらう文は本文にない

主結論:
  主張: 10月21日(火)の午前中、受注管理システムの Web 画面が1時間半ほど応答しなくなった。アプリケーションサーバーのメモリが上限に達したためで、再起動し 11:50 ごろに復旧した。上限に達した原因はまだ確定しておらず、再発防止策は3つを考えていて、いずれも検討中である
  行: [6, 8, 10, 12]
  決裁事項: []
  制約: []
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 画面が応答しなくなり始めたのは、監視の通知が出た 10:15 ごろである(10:15 から 11:50 までを「1時間半ほど」としている)
      行: [8, 19]
      書き手の明示: なし
    - 種別: 前提
      内容: 入力に失敗した約40件は、今回の障害によって失敗した
      行: [10, 35]
      書き手の明示: なし
    - 種別: 前提
      内容: メモリが上限に達した原因が確定していなくても、「復旧」したと報告してよい状態にある
      行: [8, 12]
      書き手の明示: なし
    - 種別: 前提
      内容: 原因が確定していない段階でも、挙げた3つは再発防止策と呼べる
      行: [12, 29, 41]
      書き手の明示: なし
  依存: [経緯, 原因, 影響, 再発防止策]

論点:
  - 名前: 経緯
    種類: 記述
    主張: 改修の反映から復旧までの出来事を時刻順に並べる
    行: [14]
    根拠:
      - 種別: 事実
        内容: 10月20日 夕方、受注検索の改修を本番に反映した。レビューは1人で行った
        行: [18]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 10:15、監視の通知が出て、運用チームが調べた。アプリケーションサーバーのメモリが上限に達していた
        行: [19]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 11:05、サーバーを再起動した
        行: [20]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 11:50 ごろ、復旧した
        行: [21]
        重み: 裏づけ
      - 種別: 事実
        内容: 通知から再起動までに50分、再起動から復旧までに約45分かかった
        行: [23]
        重み: 裏づけ

  - 名前: 原因
    種類: 論証
    主張: 直接の原因は、アプリケーションサーバーのメモリが上限に達したこと。メモリが上限に達した理由は確定していない
    行: [25, 27, 29]
    論拠: 本文にない(メモリの上限到達が応答停止を起こしたと言える理由は書かれておらず、調査で状態を確認し、再起動のあとに復旧したことだけが書かれている)
    根拠:
      - 種別: 事実
        内容: 調査でこの状態を確認し、サーバーの再起動のあとに復旧した
        行: [27]
        重み: 決裁に要る
      - 種別: 事実
        内容: 疑っているのは前日の夕方に反映した受注検索の改修だが、根拠は反映と障害の時期が近いことだけで、改修がメモリの使用量を増やしたことはまだ確かめていない
        行: [29]
        重み: 決裁に要る
      - 種別: 推論
        内容: 改修のレビューは1人で行った。レビューの体制が障害につながったかどうかは、改修が原因かどうかが分かるまで判断できない
        行: [31]
        重み: 裏づけ
    限界や条件:
      - 内容: 改修が原因かどうかが分かるまで、レビューの体制と障害の関係は判断できない
        行: [31]

  - 名前: 影響
    種類: 論証
    主張: 約40件の分は顧客に再入力の手間をかけた。止まり方が全面的だったのか断続的だったのかは確認中
    行: [33]
    論拠: 失敗した分は、営業が顧客に再入力を頼んだ
    根拠:
      - 種別: 事実
        内容: この時間帯に営業が入力した注文は約300件で、そのうち約40件(約13%)が入力に失敗した。失敗した分は、営業が顧客に再入力を頼んだ
        行: [35]
        重み: 決裁に要る
      - 種別: 事実
        内容: 顧客からの問い合わせはなかった
        行: [35]
        重み: 裏づけ
      - 種別: 推論
        内容: 残りの約260件は入力できている。画面が応答しなかった時間帯にも入力できた注文があることになる
        行: [37]
        重み: 決裁に要る
    限界や条件:
      - 内容: 止まり方が全面的だったのか断続的だったのかは確認中
        行: [37]

  - 名前: 再発防止策
    種類: 論証
    主張: 改修のメモリ使用量の確認、監視のしきい値の見直し、レビュー体制の強化の3つを考えている
    行: [39, 41]
    論拠: 本文にない(表の「今回の障害との関係」は、改修の確認では判断の材料になると書くが、ほかの2つは今回の出来事を書くだけで、その策が再発を防ぐ理由は書かれていない)
    根拠:
      - 種別: 推論
        内容: 改修のメモリ使用量の確認は、受注検索の改修がメモリ上限到達の原因かどうかを判断する材料になる
        行: [45]
        重み: 決裁に要る
      - 種別: 事実
        内容: 監視のしきい値の見直しについて、今回、運用チームが調べ始めたきっかけは 10:15 の通知だった
        行: [46]
        重み: 決裁に要る
      - 種別: 事実
        内容: レビュー体制の強化について、今回の改修のレビューは1人で行った
        行: [47]
        重み: 決裁に要る
    並列:
      切り口: 本文は切り口を書いていない。表の列は「今回の障害との関係」
      項目:
        - 内容: 改修のメモリ使用量の確認
          行: [45]
        - 内容: 監視のしきい値(通知を出す基準の値)の見直し
          行: [46]
        - 内容: レビュー体制の強化
          行: [47]
    限界や条件:
      - 内容: いずれも検討中で、具体的な内容、担当、期限はまだ決まっていない
        行: [41]
      - 内容: 改修のメモリ使用量を確認した結果によっては、ほかの2つの策の中身も変わることがある
        行: [49]

対応なし:
  - 行: 1
    内容: 受注管理システム障害報告書(10月21日発生分)
    理由: 意図の分かるもの(タイトル)
  - 行: 3
    内容: 宛先:情報システム部長、営業本部長
    理由: 意図の分かるもの(宛先)
  - 行: 4
