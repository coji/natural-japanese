# doc.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 報告する文書。10月21日の受注管理システムの障害を、情報システム部長と営業本部長に報告する。読み手に決めてもらうことは本文に書かれていない

主結論:
  主張: 10月21日の午前中に受注管理システムの Web 画面が1時間半ほど応答しなくなり、サーバーの再起動のあと 11:50 ごろに復旧した。メモリが上限に達した原因はまだ確定しておらず、再発防止策は3つを考えている
  行: [6, 8, 10, 12]
  決裁事項:
    - 内容: ""
      行: []
  制約:
    - 内容: ""
      行: []
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: メモリが上限に達したことが、画面が応答しなくなった原因である
      行: [8, 27]
      書き手の明示: あり
    - 種別: 前提
      内容: サーバーの再起動で障害は収まり、当面は再発しない
      行: [8, 20, 21]
      書き手の明示: なし
    - 種別: 前提
      内容: 改修を本番に置いたままでも、再発防止の検討を待てる
      行: [12, 41]
      書き手の明示: なし
    - 種別: 前提
      内容: 改修のほかに、同じ時期に本番で変わったものはない
      行: [29]
      書き手の明示: なし
    - 種別: 前提
      内容: 入力に失敗した約40件は、すべて入力し直された
      行: [10, 35]
      書き手の明示: なし
  依存: [原因, 影響, 再発防止策]

論点:
  - 名前: 経緯
    種類: 記述
    主張: 改修の反映から復旧までの時刻と出来事を並べている
    行: [14, 16]
    根拠:
      - 種別: 事実
        内容: 10月20日 夕方に受注検索の改修を本番に反映した。レビューは1人で行った
        行: [18]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 10:15 に監視の通知が出て、運用チームが調べた。アプリケーションサーバーのメモリが上限に達していた
        行: [19]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 11:05 にサーバーを再起動した
        行: [20]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 11:50 ごろに復旧した
        行: [21]
        重み: 裏づけ
      - 種別: 事実
        内容: 通知から再起動までに50分、再起動から復旧までに約45分かかった
        行: [23]
        重み: 補足

  - 名前: 原因
    種類: 論証
    主張: 直接の原因はメモリが上限に達したことで、上限に達した理由は確定していない
    行: [25]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 調査でこの状態を確認し、サーバーの再起動のあとに復旧した
        行: [27]
        重み: 決裁に要る
      - 種別: 推論
        内容: 疑っているのは前日の夕方に反映した受注検索の改修で、根拠は反映と障害の時期が近いことだけ
        行: [29]
        重み: 決裁に要る
      - 種別: 事実
        内容: 改修がメモリの使用量を増やしたことはまだ確かめていない
        行: [29]
        重み: 決裁に要る
      - 種別: 事実
        内容: 改修のレビューは1人で行った
        行: [31]
        重み: 補足
    限界や条件:
      - 内容: レビューの体制が障害につながったかどうかは、改修が原因かどうかが分かるまで判断できない
        行: [31]

  - 名前: 影響
    種類: 記述
    主張: 入力に失敗した注文の件数と、その後の対応を並べている
    行: [33]
    根拠:
      - 種別: 事実
        内容: この時間帯に営業が入力した注文は約300件で、そのうち約40件、約13%が入力に失敗した
        行: [35]
        重み: 裏づけ
      - 種別: 事実
        内容: 失敗した分は、営業が顧客に再入力を頼んだ
        行: [35]
        重み: 裏づけ
      - 種別: 事実
        内容: 顧客からの問い合わせはなかったが、約40件の分は顧客に再入力の手間をかけている
        行: [35]
        重み: 裏づけ
      - 種別: 事実
        内容: 残りの約260件は入力できている
        行: [37]
        重み: 裏づけ
      - 種別: 推論
        内容: 画面が応答しなかった時間帯にも入力できた注文があることになる
        行: [37]
        重み: 補足
    限界や条件:
      - 内容: 止まり方が全面的だったのか断続的だったのかは確認中
        行: [37]

  - 名前: 再発防止策
    種類: 記述
    主張: 考えている再発防止策3つと、今回の障害との関係を並べている
    行: [39, 41, 43]
    根拠:
      - 種別: 事実
        内容: 改修のメモリ使用量の確認。受注検索の改修がメモリ上限到達の原因かどうかを判断する材料になる
        行: [45]
        重み: 裏づけ
      - 種別: 事実
        内容: 監視のしきい値の見直し。今回、運用チームが調べ始めたきっかけは 10:15 の通知だった
        行: [46]
        重み: 裏づけ
      - 種別: 事実
        内容: レビュー体制の強化。今回の改修のレビューは1人で行った
        行: [47]
        重み: 裏づけ
    並列:
      切り口: 本文に書かれていない。行45は調査、行46は検知、行47は開発の工程を扱っている
      項目:
        - 内容: 改修のメモリ使用量の確認
          行: [45]
        - 内容: 監視のしきい値の見直し
          行: [46]
        - 内容: レビュー体制の強化
          行: [47]
    限界や条件:
      - 内容: いずれも検討中で、具体的な内容、担当、期限はまだ決まっていない
        行: [41]
      - 内容: 改修のメモリ使用量を確認した結果によっては、ほかの2つの策の中身も変わることがある
        行: [49]

