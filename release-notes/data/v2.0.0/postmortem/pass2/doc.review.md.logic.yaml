# doc.review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 報告と判断の依頼をあわせた文書。情報システム部長に2つを決めてもらい、営業本部長には報告する

主結論:
  主張: 情報システム部長に、再発防止の3つの方向でよいかと、受注検索の改修が原因かどうかの調査に1週間かけてよいかを決めてもらう。障害は 11:50 ごろに復旧し、注文約40件は入力し直した。メモリが上限に達した理由はまだ確定していない
  行: [6, 8, 10, 12, 14]
  決裁事項:
    - 内容: 再発防止の3つの方向でよいか
      行: [8]
    - 内容: 受注検索の改修が原因かどうかの調査に1週間かけてよいか
      行: [8]
  制約:
    - 内容: 営業本部長には報告のみです
      行: [8]
    - 内容: 10月29日に始めて11月5日に終えます
      行: [20]
    - 内容: 中身、担当、期限は、調査の結果が出てから改めて出したいと考えています
      行: [32]
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 改修を本番に置いたままでも、調査の1週間は待てる
      行: [14, 22]
      書き手の明示: なし
    - 種別: 前提
      内容: 原因が分かる前に、3つの方向だけは決められる
      行: [8, 32, 40]
      書き手の明示: なし
  依存: [原因, 再発防止策]

論点:
  - 名前: 原因
    種類: 論証
    主張: 直接の原因はメモリが上限に達したことだと見ているが、上限に達した理由は確定していない
    行: [16]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 調査でこの状態を確認し、サーバーの再起動のあとに復旧した
        行: [18]
        重み: 決裁に要る
      - 種別: 推論
        内容: 疑っているのは前日の夕方に反映した受注検索の改修で、根拠は反映と障害の時期が近いことだけで、改修がメモリの使用量を増やしたことはまだ確かめていない
        行: [20]
        重み: 決裁に要る
      - 種別: 事実
        内容: 1週間の調査は、運用チームの担当者2名が検証環境で改修の前後のメモリ使用量を比べるもので、10月29日に始めて11月5日に終える
        行: [20]
        重み: 決裁に要る
      - 種別: 事実
        内容: 改修は切り戻しておらず、本番に残っている
        行: [22]
        重み: 裏づけ
      - 種別: 事実
        内容: 再起動後はメモリ使用量を1時間ごとに見ていて、使用率は再起動直後が45%、その後1週間は60〜70%で推移し、増え続けてはいない
        行: [22]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月28日の時点で再発はない
        行: [14]
        重み: 裏づけ

  - 名前: 影響
    種類: 記述
    主張: 入力に失敗した注文の件数とその後の対応、応答の遅れ方を並べている
    行: [24]
    根拠:
      - 種別: 事実
        内容: この時間帯に営業が入力した注文は約300件で、そのうち約13%の約40件が入力に失敗した
        行: [26]
        重み: 裏づけ
      - 種別: 事実
        内容: 失敗した分は、営業が顧客に聞き直して入力し直した
        行: [26]
        重み: 裏づけ
      - 種別: 事実
        内容: 納期の遅れが出ていないことは営業本部に確認した
        行: [26]
        重み: 裏づけ
      - 種別: 事実
        内容: 顧客からの問い合わせはなかったが、約40件の分は顧客に聞き直しの手間をかけている
        行: [26]
        重み: 裏づけ
      - 種別: 事実
        内容: 残りの約260件は入力できている
        行: [28]
        重み: 裏づけ
      - 種別: 事実
        内容: アクセスログでは、応答に30秒以上かかったリクエストが全体の約8割で、全面停止ではなかった
        行: [28]
        重み: 裏づけ

  - 名前: 再発防止策
    種類: 記述
    主張: 考えている再発防止の3つの方向と、今回の障害との関係を並べている
    行: [30, 32, 34]
    根拠:
      - 種別: 事実
        内容: 改修のメモリ使用量の確認。受注検索の改修がメモリ上限到達の原因かどうかを判断する材料になる
        行: [36]
        重み: 決裁に要る
      - 種別: 事実
        内容: 監視のしきい値の見直し。しきい値は通知を出す基準の値で、今回、運用チームが調べ始めたきっかけは 10:15 の通知だった
        行: [37]
        重み: 決裁に要る
      - 種別: 事実
        内容: レビュー体制の強化。今回の改修のレビューは1人で行った。体制が障害につながったかは、改修が原因かどうかが分かるまで判断できない
        行: [38]
        重み: 決裁に要る
    並列:
      切り口: 本文に書かれていない。行36は調査、行37は検知、行38は開発の工程を扱っている
      項目:
        - 内容: 改修のメモリ使用量の確認
          行: [36]
        - 内容: 監視のしきい値の見直し
          行: [37]
        - 内容: レビュー体制の強化
          行: [38]
    限界や条件:
      - 内容: 調査の結果によっては、ほかの2つの策の中身も変わることがある
        行: [40]

  - 名前: 付録:経緯
    種類: 記述
    主張: 改修の反映から復旧までの時刻と出来事を並べている
    行: [42, 44]
    根拠:
      - 種別: 事実
        内容: 10月20日 夕方に受注検索の改修を本番に反映した。レビューは1人で行った
        行: [46]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 10:05 に Web 画面の応答が極端に遅くなり始めた。11:50 までのリクエストは、全体の約8割の応答に30秒以上かかり、残りの約2割は数秒で返っていた
        行: [47]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 10:15 に監視の通知が出て、運用チームが調べた。アプリケーションサーバーのメモリが上限に達していた
        行: [48]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 11:05 にサーバーを再起動した
        行: [49]
        重み: 裏づけ
      - 種別: 事実
        内容: 10月21日 11:50 ごろに復旧した
        行: [50]
        重み: 裏づけ
      - 種別: 事実
        内容: 通知から再起動までに50分、再起動から復旧までに約45分かかった
        行: [52]
        重み: 補足

対応なし:
  - 行: 1
    内容: 受注管理システム障害報告書(10月21日発生分)
    理由: 意図の分かるもの(タイトル)
  - 行: 3
    内容: 宛先
    理由: 意図の分かるもの(宛先)
  - 行: 4
    内容: 作成
    理由: 意図の分かるもの(作成者)
