# doc.review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。経営会議が、議事録作成支援ツールの試験導入と費用の上限を決める稟議書

主結論:
  主張: 顧客打ち合わせの議事録作成にかかる時間を減らすため、音声の文字起こしと要約を行うクラウドツール「ミナトノート」を、営業部の営業担当12名のうち内勤寄りの3名を除く9名で、6か月間試験導入したい
  行: [1, 8, 10, 12]
  決裁事項:
    - 内容: 「ミナトノート」を営業部の営業担当12名のうち内勤寄りの3名を除く9名で6か月間試験導入すること
      行: [108, 110]
    - 内容: 費用の上限を月額8万円、6か月合計50万円とすること
      行: [111]
  制約:
    - 内容: 承認後の【2026年12月】から6か月
      行: [14]
    - 内容: 月額の上限は8万円、6か月の総額は50万円以内
      行: [15]
    - 内容: 営業部の営業担当12名のうち内勤寄りの3名を除く9名
      行: [12, 36]
    - 内容: 上限を超える支出は行わない
      行: [73]
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 減った作成時間を時間単価で換算し、費用と比べてよい
      行: [49]
      書き手の明示: なし
    - 種別: 前提
      内容: 月約28件のすべてでツールを使える
      行: [51]
      書き手の明示: あり
  依存: [背景と課題, 議事録作成時間の削減, 費用対効果の目安, 費用, リスクと対策, 評価の方法]

論点:
  - 名前: 申請内容
    種類: 記述
    主張: 期間、費用、進め方を並べている
    行: [10, 12]
    根拠:
      - 種別: 事実
        内容: 期間は承認後の【2026年12月】から6か月
        行: [14]
        重み: 決裁に要る
      - 種別: 事実
        内容: 費用は月額の上限8万円、6か月の総額50万円以内。見込みは月額59,400円、6か月で356,400円
        行: [15]
        重み: 決裁に要る
      - 種別: 事実
        内容: 試験期間中に効果と情報管理の状況を測定する。3か月目に中間評価、6か月目に最終評価を行い、本導入・規模縮小・中止のいずれにするかを経営会議で改めて判断する
        行: [16]
        重み: 裏づけ

  - 名前: 背景と課題
    種類: 論証
    主張: 議事録の作成に、営業部全体で月に約32時間かかっている
    行: [18, 20]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 営業部全体の顧客打ち合わせは週に平均8件、月に約35件である。営業支援システムの訪問記録の直近6か月から出した
        行: [22]
        重み: 決裁に要る
      - 種別: 事実
        内容: 営業担当12名の作成時間を、2週間で打ち合わせ16件分記録した。1件あたりの平均は55分、最短25分、最長110分である
        行: [23]
        重み: 決裁に要る
      - 種別: 推論
        内容: 担当者は打ち合わせ後、手書きメモをもとに議事録を作成している。議事録の正確さは担当者のメモの取り方に左右されると見ている
        行: [24]
        重み: 補足
      - 種別: 事実
        内容: 対象の9名の打ち合わせは、2週間で13件、月に約28件である
        行: [25]
        重み: 裏づけ

  - 名前: 導入するツール
    種類: 記述
    主張: 導入するのは、月単位で解約でき、人数も増減できるクラウドサービスである
    行: [27, 29, 31]
    根拠:
      - 種別: 事実
        内容: ミナトノート(クラウドサービス)
        行: [33]
        重み: 裏づけ
      - 種別: 事実
        内容: 主な機能は打ち合わせ音声の文字起こし、要約
        行: [34]
        重み: 裏づけ
      - 種別: 事実
        内容: 1人あたり月額6,600円(税込)
        行: [35]
        重み: 決裁に要る
      - 種別: 事実
        内容: 利用者は営業部の営業担当9名
        行: [36]
        重み: 決裁に要る
      - 種別: 事実
        内容: 同業のA社(従業員300名)が全社で導入している
        行: [37]
        重み: 裏づけ
    限界や条件:
      - 内容: A社での効果や運用上の注意点については、可能であれば開始前に聞き取りを行い、運用ルールづくりに活かす
        行: [39]

  - 名前: 議事録作成時間の削減
    種類: 論証
    主張: 1件あたりの作成時間がどこまで減るかを、この試験導入で確かめる
    行: [41, 43, 45]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 先月、営業2課の担当者1名が無料版を1件の打ち合わせで試したところ、議事録の作成時間が普段の60分から30分に減った
        行: [45]
        重み: 決裁に要る
    限界や条件:
      - 内容: この結果は1名・1件だけのものであり、参考値にとどまる
        行: [45]

  - 名前: 費用対効果の目安
    種類: 論証
    主張: 1件あたり約36分減れば費用に見合うので、本導入へ進む線を36分とする
    行: [47, 49]
    論拠: 月額を時間単価で割った時間だけ減れば、換算した金額が月額と同じになる
    根拠:
      - 種別: 見積
        内容: 月額59,400円を、経理部が社内の試算に使う標準単価の1時間3,500円で割ると月約17時間になり、月約28件で割ると1件あたり約36分になる
        行: [49, 119, 120, 121, 122, 123]
        重み: 決裁に要る
      - 種別: 見積
        内容: 参考値の30分では、月約14時間、金額にして49,000円で、月額に届かない
        行: [51]
        重み: 決裁に要る
      - 種別: 見積
        内容: 1件15分で月約7時間・約8,500円、30分で月約14時間・約4,200円、36分で月約17時間・約3,500円、45分で月約21時間・約2,800円
        行: [125, 127, 128, 129, 130]
        重み: 裏づけ
      - 種別: 事実
        内容: 2週間の記録の担当者別の件数は、2件以上が5名、1件が6名、0件が1名で、件数の少ない数名は内勤寄りの担当である
        行: [132]
        重み: 裏づけ
    限界や条件:
      - 内容: 36分は月約28件のすべてでツールを使えたときの線で、同意が得られない打ち合わせがあれば、1件あたりに要る削減は大きくなる
        行: [51]

  - 名前: 金額にしにくい効果
    種類: 論証
    主張: 次の効果も見込まれるが、まだ確かめられていないため、試験期間中に利用者アンケートで確認する
    行: [53, 55]
    論拠: 本文にない
    根拠:
      - 種別: 推論
        内容: 発言が記録に残るため、聞き漏らしや顧客との認識違いを後から確認できること
        行: [57]
        重み: 補足
      - 種別: 推論
        内容: 議事録が早くできあがり、顧客へのフォローや社内共有を早く始められること
        行: [58]
        重み: 補足
      - 種別: 推論
        内容: 担当者が交代するとき、過去の打ち合わせ内容を引き継ぎやすいこと
        行: [59]
        重み: 補足

  - 名前: 費用
    種類: 記述
    主張: 費用の見込みは月額59,400円、6か月で356,400円で、申請する上限の範囲に収まる
    行: [61, 63, 65]
    根拠:
      - 種別: 事実
        内容: 単価(税込)6,600円/人・月
        行: [67]
        重み: 決裁に要る
      - 種別: 事実
        内容: 人数9名
        行: [68]
        重み: 決裁に要る
      - 種別: 見積
        内容: 月額(見込み)59,400円
        行: [69]
        重み: 決裁に要る
      - 種別: 見積
        内容: 6か月合計(見込み)356,400円
        行: [70]
        重み: 決裁に要る
      - 種別: 事実
        内容: 申請する上限は月額8万円、6か月合計50万円
        行: [71]
        重み: 決裁に要る
      - 種別: 事実
        内容: 上限を超える支出は行わない。機材などの上記以外の費用は想定していない。必要になった場合も上限の範囲で対応し、超える場合は改めて申請する
        行: [73]
        重み: 裏づけ

  - 名前: リスクと対策
    種類: 記述
    主張: 顧客情報の保存と扱いは、社内規程に合っていると情報システム部門が確認した。リスクごとの対策を並べている
    行: [75, 77, 79]
    根拠:
      - 種別: 事実
        内容: 録音の前に、必ず顧客の同意を得る。同意を求める手順と文面を統一し、同意を得たことを記録に残す。同意が得られない打ち合わせでは録音せず、従来どおり手書きで議事録を作る
        行: [81]
        重み: 裏づけ
      - 種別: 事実
        内容: 同意を得られた割合を毎月集計する。利用が少ない場合は、中間評価で人数の縮小を検討する。ライセンスは月単位で減らせる
        行: [82]
        重み: 裏づけ
      - 種別: 事実
        内容: 保存先は国内のデータセンターで、音声と文字起こしはAIの学習に使われない。録音と文字起こしは契約中は無期限で保存され、解約後は30日で削除される。社内規程は社外保存の期間に上限を置いていない。削除は依頼から30日以内で、アクセス権は管理者が設定できる
        行: [83]
        重み: 決裁に要る
      - 種別: 事実
        内容: ツールの出力をそのまま議事録にせず、担当者が必ず確認・修正してから確定する
        行: [84]
        重み: 裏づけ
      - 種別: 事実
        内容: 3か月目の中間評価で効果を確かめ、見合わない場合は規模縮小か中止を経営会議で判断する。月単位で解約でき、最低契約期間はないと販売店に確認した
        行: [85]
        重み: 裏づけ
      - 種別: 事実
        内容: 月額の上限を設け、ライセンス数は9名分より増やさない
        行: [86]
        重み: 裏づけ

  - 名前: 評価の方法
    種類: 記述
    主張: 作成時間が開始前より平均36分以上短くなり、情報管理上の問題がなければ、本導入へ進む
    行: [88, 90, 92, 94, 102]
    根拠:
      - 種別: 意見
        内容: 1件あたりの議事録作成時間の目安(案)は、開始前より平均36分短い
        行: [96]
        重み: 決裁に要る
      - 種別: 意見
        内容: ツールの利用率の目安(案)は【 】%以上
        行: [97]
        重み: 決裁に要る
      - 種別: 意見
        内容: 議事録の品質の目安(案)は開始前と同等以上
        行: [98]
        重み: 裏づけ
      - 種別: 意見
        内容: 情報管理の目安(案)は情報漏えい・同意なしの録音が0件
        行: [99]
        重み: 決裁に要る
      - 種別: 意見
        内容: 費用の目安(案)は月額8万円以内
        行: [100]
        重み: 決裁に要る
      - 種別: 意見
        内容: 本導入へ進むのは、作成時間が開始前より平均36分以上短くなり、情報管理上の問題がない場合
        行: [104]
        重み: 決裁に要る
      - 種別: 意見
        内容: 規模を縮小して続けるのは、平均36分以上短くなったが、利用率が目安を下回る場合。ライセンス数を減らすなどして続ける
        行: [105]
        重み: 決裁に要る
      - 種別: 意見
        内容: 中止するのは、短くなった時間が平均36分に届かず費用に見合わない場合、または情報管理上の重大な問題が起きた場合。情報管理上の重大な問題が起きたときは、期間の途中でも利用を止める
        行: [106]
        重み: 決裁に要る
      - 種別: 事実
        内容: 開始前は、記録した2週間分の議事録作成時間を、比較の基準とする
        行: [134, 136]
        重み: 裏づけ
      - 種別: 事実
        内容: 試験期間中は打ち合わせごとに、議事録の作成時間と、録音の同意を得られたかどうかを記録シートに記入する
        行: [137]
        重み: 裏づけ
      - 種別: 事実
        内容: 3か月目末に中間評価を行い、結果を経営会議に報告する
        行: [138]
        重み: 裏づけ
      - 種別: 事実
        内容: 6か月目末に最終評価を行い、本導入・規模縮小・中止の判断案を経営会議に提出する
        行: [139]
        重み: 裏づけ
    並列:
      切り口: 判断の結果で分けている
      項目:
        - 内容: 本導入へ進む
          行: [104]
        - 内容: 規模を縮小して続ける
          行: [105]
        - 内容: 中止する
          行: [106]

  - 名前: 実施体制
    種類: 記述
    主張: 責任者、情報管理担当者、利用者、相談先の役割を並べている
    行: [141, 143]
    根拠:
      - 種別: 事実
        内容: 責任者は営業部長【氏名】。全体の管理、中間評価・最終評価の報告
        行: [145]
        重み: 裏づけ
      - 種別: 事実
        内容: 情報管理担当者は【氏名】(1名)。利用ルールの整備と周知、録音データの管理状況の点検
        行: [146]
        重み: 裏づけ
      - 種別: 事実
        内容: 利用者は営業担当9名。ツールの利用、作成時間と録音同意の記録、アンケートへの回答
        行: [147]
        重み: 裏づけ
      - 種別: 事実
        内容: 相談先は情報システム部門、法務担当。セキュリティと契約内容の確認
        行: [148]
        重み: 補足

  - 名前: スケジュール
    種類: 記述
    主張: 承認後から最終評価までの時期と内容を並べている
    行: [150, 152]
    根拠:
      - 種別: 事実
        内容: 承認後〜開始前は、同意取得の手順づくり、利用者への説明会
        行: [154]
        重み: 裏づけ
      - 種別: 事実
        内容: 1〜3か月目は運用開始、利用状況と費用を毎月確認
        行: [155]
        重み: 裏づけ
      - 種別: 事実
        内容: 3か月目末は中間評価、経営会議へ報告
        行: [156]
        重み: 裏づけ
      - 種別: 事実
        内容: 4〜6か月目は運用を続ける(中間評価の結果に応じて見直す)
        行: [157]
        重み: 裏づけ
      - 種別: 事実
        内容: 6か月目末は最終評価、判断案を経営会議へ提出
        行: [158]
        重み: 裏づけ

対応なし:
  - 行: 3
    内容: 項目 | 内容(表の見出し)
    理由: 意図の分かるもの(表の区切り)
  - 行: 5
    内容: 起案日 2026年【 】月【 】日
    理由: 意図の分かるもの(様式の欄)
  - 行: 6
    内容: 起案者 営業部長【氏名】
    理由: 意図の分かるもの(様式の欄)
  - 行: 7
    内容: 提出先 経営会議
    理由: 意図の分かるもの(様式の欄)
  - 行: 113
    内容: 以上
    理由: 意図の分かるもの(結語)
  - 行: 115
    内容: 付録A 費用対効果の試算
    理由: 意図の分かるもの(付録の見出し)
  - 行: 117
