# doc-review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。議事録作成支援ツール「ミナトノート」の6か月の試験導入と費用の上限を、経営会議が決める稟議書

主結論:
  主張: 顧客打ち合わせの議事録作成にかかる時間を減らすため、音声の文字起こしと要約を行うクラウドツール「ミナトノート」を、営業部の営業担当12名で6か月間試験導入したい。ただし、今ある参考値(1件30分の削減)では費用に見合わず、データの扱いが社内規程に合うかもまだ確かめていない。
  行: [1, 8, 10, 12]
  決裁事項:
    - 内容: 「ミナトノート」を営業部の営業担当12名で6か月間試験導入すること
      行: [86]
    - 内容: 費用の上限を月額10万円、6か月合計60万円とすること
      行: [87]
  制約:
    - 内容: 営業部の営業担当12名で6か月間
      行: [12, 86]
    - 内容: 承認後の【2026年12月】から6か月
      行: [14]
    - 内容: 月額の上限は10万円、6か月の総額は60万円以内(見込みは475,200円)
      行: [15, 45, 87]
    - 内容: 試験期間中に効果と情報管理の状況を測定する。3か月目に中間評価、6か月目に最終評価を行い、本導入・規模縮小・中止のいずれにするかを経営会議で改めて判断する
      行: [16]
    - 内容: 上限を超える支出は行わない
      行: [48]
    - 内容: 必要になった場合も上限の範囲で対応し、超える場合は改めて申請する
      行: [49]
    - 内容: ライセンス数を12名分に固定する
      行: [62]
    - 内容: 問題があれば導入しない
      行: [53, 59]
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 部全体で同じ効果が出るかどうかは、この試験導入で確かめる
      行: [31]
      書き手の明示: あり
    - 種別: 前提
      内容: データの扱いが社内規程に合っている(問題があれば導入しない)
      行: [53]
      書き手の明示: あり
    - 種別: 前提
      内容: 無料版で出た効果が、申請するプランでも同じように出る
      行: [31, 97]
      書き手の明示: なし
    - 種別: 前提
      内容: 減った作業時間が、人件費として費用の回収につながる
      行: [33]
      書き手の明示: なし
    - 種別: 前提
      内容: 確認中の点が決まらなくても、試験導入の可否は決められる
      行: [61, 62, 72, 86]
      書き手の明示: なし
  依存: [背景と課題, 期待効果, 費用, リスクと対策, 評価の方法]

論点:
  - 名前: 背景と課題
    種類: 論証
    主張: 議事録作成にかかる時間は、1件60分が全件に当てはまるとすると、部全体で月約35時間、1人あたり月約3時間である
    行: [18, 20]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 顧客打ち合わせは営業部全体で週に平均8件(月に約35件)ある
        行: [22]
        重み: 決裁に要る
      - 種別: 事実
        内容: 60分は、先月ツールを試した担当者の普段の時間である
        行: [23]
        重み: 決裁に要る
      - 種別: 事実
        内容: 週8件は1人あたりの件数ではなく、営業支援システムの訪問記録の直近6か月から出した
        行: [22]
        重み: 裏づけ
      - 種別: 事実
        内容: 担当者は打ち合わせ後、手書きメモをもとに議事録を作成している
        行: [23]
        重み: 補足
      - 種別: 推論
        内容: 手書きメモと記憶をもとに作るため、議事録の正確さは担当者のメモの取り方に左右されると見ている
        行: [24]
        重み: 裏づけ
    限界や条件:
      - 内容: 部全体での平均作成時間はまだ測っていない。開始前に測定する予定で(付録E)、2週間あれば12名分を記録でき、承認の前に測ることもできる
        行: [25]

  - 名前: 期待効果
    種類: 論証
    主張: 費用に見合うのは、打ち合わせの全件で使い、1件あたり約39分以上減った場合で、今ある参考値の30分では届かない
    行: [27, 29]
    論拠: 営業担当者の時間単価がこの金額を上回れば、費用は回収できる計算になる(行33)
    根拠:
      - 種別: 見積
        内容: 費用に見合う水準は、月額費用を時間単価で割り、月の件数で割って求めた。月額79,200円、時間単価1時間3,500円では、月約22.6時間、1件あたり約39分になる
        行: [33, 120]
        重み: 決裁に要る
      - 種別: 事実
        内容: 先月、営業2課の担当者1名が無料版を1件の打ち合わせで試したところ、議事録の作成時間が普段の60分から30分に減った
        行: [31]
        重み: 決裁に要る
      - 種別: 見積
        内容: 30分(参考値)で月約17.3時間、削減1時間あたり約4,600円、時間単価3,500円で回収できない
        行: [38]
        重み: 決裁に要る
      - 種別: 見積
        内容: 15分で月約8.7時間、削減1時間あたり約9,100円、回収できない
        行: [37]
        重み: 裏づけ
      - 種別: 見積
        内容: 45分で月約26時間、削減1時間あたり約3,000円、回収できる
        行: [39]
        重み: 裏づけ
    限界や条件:
      - 内容: この結果は1名・1件だけのものであり、参考値にとどまる。部全体で同じ効果が出るかどうかは、この試験導入で確かめる
        行: [31]
      - 内容: 表は月約35件のすべてでツールを使った場合の値である。同意が得られず使えない打ち合わせがあれば、その分だけ削減時間は減り、1時間あたりの費用は上がる
        行: [35, 41]
      - 内容: 単価が税抜の場合は費用がどの行も1割高くなり、約39分は約43分になる
        行: [41]
      - 内容: 比べているのは利用料だけで、同意の取得や記録などで増える時間は入れていない
        行: [41]

  - 名前: 費用
    種類: 記述
    主張: 申請する上限と、単価と人数から出る見込みを並べている
    行: [43, 45]
    根拠:
      - 種別: 事実
        内容: 申請する上限は月額10万円、6か月合計60万円である
        行: [45]
        重み: 決裁に要る
      - 種別: 見積
        内容: 見込みは1人月額6,600円の12名分で、月額79,200円、6か月合計475,200円になる
        行: [45]
        重み: 決裁に要る
      - 種別: 意見
        内容: 上限と見込みの差額は、税区分や契約条件の確認結果に備えるためのものである
        行: [48]
        重み: 決裁に要る
      - 種別: 意見
        内容: 上限を超える支出は行わない
        行: [48]
        重み: 決裁に要る
      - 種別: 意見
        内容: 上記以外の費用(機材など)は想定していない。必要になった場合も上限の範囲で対応し、超える場合は改めて申請する
        行: [49]
        重み: 決裁に要る
      - 種別: 見積
        内容: 単価6,600円が税込か税抜かは、契約前に確認する。税抜の場合でも月額は87,120円で、上限の範囲に収まる
        行: [47]
        重み: 裏づけ

  - 名前: リスクと対策
    種類: 記述
    主張: データの扱いが社内規程に合うかは、まだ確かめていない
    行: [51, 53]
    根拠:
      - 種別: 事実
        内容: 情報システム部門には声をかけただけで、ミナトノートのデータの扱いの資料は取り寄せていない。問題があれば導入しない
        行: [53]
        重み: 決裁に要る
      - 種別: 意見
        内容: 録音について顧客の同意を得ないまま録音してしまうリスクと、その対策
        行: [55, 57]
        重み: 裏づけ
      - 種別: 意見
        内容: 顧客の同意が得られず、ツールを使える打ち合わせが少ないリスクと、その対策
        行: [58]
        重み: 裏づけ
      - 種別: 意見
        内容: クラウドに保存した顧客情報が漏れるリスクと、その対策
        行: [59]
        重み: 裏づけ
      - 種別: 意見
        内容: 文字起こしや要約に誤りがあるリスクと、その対策
        行: [60]
        重み: 裏づけ
      - 種別: 意見
        内容: 期待した効果が出ないリスクと、その対策。中間評価は経営会議への報告としており、そこで判断するかは確認中である
        行: [61]
        重み: 裏づけ
      - 種別: 意見
        内容: 費用が想定を超えるリスクと、その対策。途中で減らせるかは確認中。解約は月単位ででき、最低契約期間もないので、6か月で解約できる(販売店に確認済み)
        行: [62]
        重み: 裏づけ

  - 名前: 評価の方法
    種類: 記述
    主張: 判断の中心は、作成時間の削減が費用に見合うかと、情報管理上の問題がないかの2つである
    行: [64, 66, 68, 70, 78]
    根拠:
      - 種別: 意見
        内容: 本導入へ進む:作成時間の削減が費用に見合い、情報管理上の問題がない場合
        行: [80]
        重み: 決裁に要る
      - 種別: 意見
        内容: 規模を縮小して続ける:1件あたりの時間は減っているが、利用率が低い場合(ライセンス数を減らすなど)
        行: [81]
        重み: 決裁に要る
      - 種別: 意見
        内容: 中止する:削減効果が費用に見合わない場合、または情報管理上の重大な問題が起きた場合(この場合は期間の途中でも利用を止める)
        行: [82]
        重み: 決裁に要る
      - 種別: 意見
        内容: 1件あたりの議事録作成時間の目安は、開始前より平均30分短い。最低でも、3章の費用対効果が見合う水準で、全件で使う場合は約39分である。30分より長く、どちらを目安にするかは確認中である
        行: [72]
        重み: 決裁に要る
      - 種別: 意見
        内容: ツールの利用率の目安は【 】%以上
        行: [73]
        重み: 決裁に要る
      - 種別: 意見
        内容: 情報管理の目安は、情報漏えい・同意なしの録音が0件
        行: [75]
        重み: 決裁に要る
      - 種別: 意見
        内容: 費用の目安は月額10万円以内
        行: [76]
        重み: 決裁に要る
      - 種別: 意見
        内容: 議事録の品質の目安は開始前と同等以上(利用者アンケート、上長による確認)
        行: [74]
        重み: 裏づけ

  - 名前: 導入するツール
    種類: 記述
    主張: ツール名、主な機能、プラン、利用者、社外の利用例を並べている
    行: [91, 93]
    根拠:
      - 種別: 事実
        内容: ミナトノート(クラウドサービス)
        行: [95]
        重み: 裏づけ
      - 種別: 事実
        内容: 主な機能は打ち合わせ音声の文字起こし、要約
        行: [96]
        重み: 裏づけ
      - 種別: 事実
        内容: プランは1人あたり月額6,600円
        行: [97]
        重み: 裏づけ
      - 種別: 事実
        内容: 利用者は営業部の営業担当12名
        行: [98]
        重み: 裏づけ
      - 種別: 事実
        内容: 同業のA社(従業員300名)が全社で導入している
        行: [99]
        重み: 補足
      - 種別: 意見
        内容: A社での効果や運用上の注意点については、可能であれば開始前に聞き取りを行い、運用ルールづくりに活かす
        行: [101]
        重み: 補足

  - 名前: 金額にしにくい効果
    種類: 記述
    主張: 次の効果も見込まれるが、まだ確かめられていないため、試験期間中に利用者アンケートで確認する
    行: [103, 105]
    根拠:
      - 種別: 推論
        内容: 録音した打ち合わせで、聞き漏らしや顧客との認識違いを後から確認できること
        行: [107]
        重み: 裏づけ
      - 種別: 推論
        内容: 議事録が早くできあがり、顧客へのフォローや社内共有を早く始められること
        行: [108]
        重み: 裏づけ
      - 種別: 推論
        内容: 担当者が交代するとき、過去の打ち合わせ内容を引き継ぎやすいこと
        行: [109]
        重み: 裏づけ

  - 名前: 削減時間の計算
    種類: 記述
    主張: 参考値30分での削減時間の計算と、費用に見合う水準の計算を並べている
    行: [111, 113]
    根拠:
      - 種別: 見積
        内容: 月あたりの打ち合わせ件数は約35件(週8件 × 52週 ÷ 12か月 = 約34.7件)
        行: [115]
        重み: 裏づけ
      - 種別: 見積
        内容: 1件あたり30分、月あたり約17.3時間、6か月約104時間
        行: [116, 117, 118]
        重み: 裏づけ

  - 名前: 実施体制
    種類: 記述
    主張: 責任者、情報管理担当者、利用者、相談先の役割を並べている
    行: [122, 124]
    根拠:
      - 種別: 事実
        内容: 責任者は営業部長【氏名】。全体の管理、中間評価・最終評価の報告
        行: [126]
        重み: 裏づけ
      - 種別: 事実
        内容: 情報管理担当者は【氏名】(1名)。契約条件とデータの扱いの確認、利用ルールの整備と周知、録音データの管理状況の点検
        行: [127]
        重み: 裏づけ
      - 種別: 事実
        内容: 利用者は営業担当12名。ツールの利用、作成時間と録音同意の記録、アンケートへの回答
        行: [128]
        重み: 裏づけ
      - 種別: 事実
        内容: 相談先は情報システム部門、法務担当。セキュリティと契約内容の確認
        行: [129]
        重み: 裏づけ

  - 名前: 測定の進め方
    種類: 記述
    主張: 測定と評価の手順を時期の順に並べている
    行: [131]
    根拠:
      - 種別: 事実
        内容: 開始前(2週間)に、現在の議事録作成時間を担当者ごとに打ち合わせ1件単位で記録し、比較の基準とする
        行: [133]
        重み: 裏づけ
      - 種別: 事実
        内容: 試験期間中は、打ち合わせごとに、議事録の作成時間と、録音の同意を得られたかどうかを記録シートに記入する
        行: [134]
        重み: 裏づけ
      - 種別: 事実
        内容: 3か月目末に中間評価を行い、結果を経営会議に報告する
        行: [135]
        重み: 裏づけ
      - 種別: 事実
        内容: 6か月目末に最終評価を行い、本導入・規模縮小・中止の判断案を経営会議に提出する
        行: [136]
        重み: 裏づけ

  - 名前: スケジュール
    種類: 記述
    主張: 承認後から6か月目末までの段取りを並べている
    行: [138, 140]
    根拠:
      - 種別: 事実
        内容: 承認後〜開始前は、契約条件とデータの扱いの確認、同意取得の手順づくり、現在の作成時間の測定、利用者への説明会
        行: [142]
        重み: 裏づけ
      - 種別: 事実
        内容: 1〜3か月目は運用開始、利用状況と費用を毎月確認
        行: [143]
        重み: 裏づけ
      - 種別: 事実
        内容: 3か月目末に中間評価、経営会議へ報告
        行: [144]
        重み: 裏づけ
      - 種別: 事実
        内容: 4〜6か月目は運用を続ける(中間評価の結果に応じて見直す)
        行: [145]
        重み: 裏づけ
      - 種別: 事実
        内容: 6か月目末に最終評価、判断案を経営会議へ提出
        行: [146]
        重み: 裏づけ

