  行: [12, 141]
  決裁事項:
    - 内容: 「ミナトノート」を営業部の営業担当12名で6か月間試験導入すること
      行: [143]
    - 内容: 費用の上限を月額10万円、6か月合計60万円とすること
      行: [144]
  制約:
    - 内容: 期間は承認後の【2026年12月】から6か月
      行: [14]
    - 内容: 月額の上限は10万円、6か月の総額は60万円以内(見込みは475,200円)
      行: [15]
    - 内容: 上限を超える支出は行わない
      行: [83]
    - 内容: 上記以外の費用(機材など)は想定していない。必要になった場合も上限の範囲で対応し、超える場合は改めて申請する
      行: [84]
    - 内容: 利用者は営業部の営業担当12名
      行: [32]
    - 内容: 月額の上限を設け、ライセンス数を12名分に固定する
      行: [104]
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 部全体で同じ効果が出るかどうかは、この試験導入で確かめる
      行: [41]
      書き手の明示: あり
    - 種別: 前提
      内容: 週に平均8件(月に約35件)は、ツールを使う営業担当12名全員の打ち合わせの合計である
      行: [20, 47]
      書き手の明示: なし
    - 種別: 前提
      内容: 月約35件のすべての打ち合わせでツールを使える
      行: [47, 49, 99, 100]
      書き手の明示: なし
    - 種別: 前提
      内容: 無料版を1件で試した結果を、1人あたり月額6,600円のプランの見込みに使える
      行: [31, 41, 48]
      書き手の明示: なし
    - 種別: 前提
      内容: 試行の30分の削減には、ツールの出力を担当者が確認・修正する時間が含まれている
      行: [41, 102]
      書き手の明示: なし
    - 種別: 前提
      内容: 削減した時間は、時間単価どおりの金額の価値になる
      行: [54]
      書き手の明示: なし
    - 種別: 前提
      内容: 6か月で解約できる。解約できなければ総額は6か月分の見込みに収まらない
      行: [15, 83, 104]
      書き手の明示: なし
  依存: [申請内容, 背景と課題, 議事録作成時間の削減, 費用対効果の目安, 費用, リスクと対策, 評価の指標, 判断の基準]

論点:
  - 名前: 申請内容
    種類: 記述
    主張: 営業担当12名で6か月間試験導入する期間、費用、進め方を並べている
    行: [10, 12, 14, 15, 16]
    根拠:
      - 種別: 事実
        内容: 期間は承認後の【2026年12月】から6か月
        行: [14]
        重み: 決裁に要る
      - 種別: 事実
        内容: 月額の上限は10万円、6か月の総額は60万円以内(見込みは475,200円)
        行: [15]
        重み: 決裁に要る
      - 種別: 事実
        内容: 試験期間中に効果と情報管理の状況を測定する。3か月目に中間評価、6か月目に最終評価を行い、本導入・規模縮小・中止のいずれにするかを経営会議で改めて判断する
        行: [16]
