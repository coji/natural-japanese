        行: [77]
        重み: 決裁に要る
      - 種別: 見積
        内容: 月額(見込み)は79,200円
        行: [78]
        重み: 決裁に要る
      - 種別: 見積
        内容: 6か月合計(見込み)は475,200円
        行: [79]
