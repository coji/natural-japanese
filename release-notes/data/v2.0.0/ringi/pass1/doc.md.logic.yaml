        行: [82]
        重み: 決裁に要る
      - 種別: 意見
        内容: 上限と見込みの差額は、税区分や契約条件の確認結果に備えるためのものである。上限を超える支出は行わない
        行: [83]
        重み: 決裁に要る
      - 種別: 意見
        内容: 上記以外の費用(機材など)は想定していない。必要になった場合も上限の範囲で対応し、超える場合は改めて申請する
        行: [84]
        重み: 決裁に要る

