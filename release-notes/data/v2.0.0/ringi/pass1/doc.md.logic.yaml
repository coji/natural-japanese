        行: [129]
        重み: 決裁に要る
    並列:
      切り口: 効果、利用率、情報管理の状況で3つの判断に分けている
      項目:
        - 内容: 本導入へ進む
          行: [127]
        - 内容: 規模を縮小して続ける
          行: [128]
        - 内容: 中止する
          行: [129]

