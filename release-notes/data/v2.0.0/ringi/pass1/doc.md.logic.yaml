  - 名前: 背景と課題
    種類: 論証
    主張: 議事録の作成に時間がかかり、正確さも担当者のメモの取り方に左右される
    行: [18, 20, 21, 22, 23]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 営業部では、顧客打ち合わせが週に平均8件(月に約35件)ある
        行: [20]
        重み: 裏づけ
      - 種別: 事実
        内容: 担当者は打ち合わせ後、手書きメモをもとに議事録を作成している。先月ツールを試した担当者の場合、普段は1件あたり約60分かかっている
        行: [21]
        重み: 決裁に要る
      - 種別: 推論
        内容: 手書きメモと記憶をもとに作るため、議事録の正確さは担当者のメモの取り方に左右される
        行: [22]
        重み: 裏づけ
    限界や条件:
      - 内容: 部全体での平均作成時間はまだ測っていない。試験導入の開始前に測定する(8章)
        行: [23]

  - 名前: 導入するツール
    種類: 記述
    主張: ツール名、主な機能、プラン、利用者、社外の利用例を並べている
    行: [25, 27, 29, 30, 31, 32, 33, 35]
    根拠:
      - 種別: 事実
        内容: ツール名はミナトノート(クラウドサービス)
        行: [29]
        重み: 裏づけ
      - 種別: 事実
        内容: 主な機能は打ち合わせ音声の文字起こし、要約
        行: [30]
        重み: 裏づけ
      - 種別: 事実
        内容: プランは1人あたり月額6,600円
        行: [31]
        重み: 決裁に要る
      - 種別: 事実
        内容: 利用者は営業部の営業担当12名
        行: [32]
        重み: 決裁に要る
      - 種別: 事実
        内容: 同業のA社(従業員300名)が全社で導入している
        行: [33]
        重み: 裏づけ
      - 種別: 意見
        内容: A社での効果や運用上の注意点については、可能であれば開始前に聞き取りを行い、運用ルールづくりに活かす
        行: [35]
        重み: 補足

  - 名前: 議事録作成時間の削減
    種類: 論証
    主張: 参考値どおり1件あたり30分減れば、月約17時間、6か月で約104時間減る
    行: [37, 39, 41, 43, 45, 47, 48, 49, 50]
    論拠: 本文にない。1件の試行の削減幅が全打ち合わせに当てはまると仮定した計算として書かれている
    根拠:
      - 種別: 事実
        内容: 先月、営業2課の担当者1名が無料版を1件の打ち合わせで試したところ、議事録の作成時間が普段の60分から30分に減った
        行: [41]
        重み: 裏づけ
      - 種別: 見積
        内容: 約35件(週8件 × 52週 ÷ 12か月)× 1件30分(試行時の参考値)= 月約17時間、6か月で約104時間
        行: [43, 47, 48, 49, 50]
        重み: 決裁に要る
    限界や条件:
      - 内容: この結果は1名・1件だけのものであり、参考値にとどまる。部全体で同じ効果が出るかどうかは、この試験導入で確かめる
        行: [41]

  - 名前: 費用対効果の目安
    種類: 論証
    主張: 営業担当者の時間単価が削減1時間あたりの費用を上回れば、費用は回収できる
    行: [52, 54, 56, 58, 59, 60, 62]
    論拠: 月額費用79,200円を月あたりの削減時間で割ると、削減できる1時間あたりの費用になる
    根拠:
      - 種別: 見積
        内容: 月額79,200円 ÷ 月の削減時間 = 1件15分で約9,100円、30分(参考値)で約4,600円、45分で約3,000円
        行: [54, 56, 58, 59, 60]
        重み: 決裁に要る
      - 種別: 事実
        内容: 当社の営業担当者の時間単価は【 】円(人事・経理部門に確認して記入)。値は書かれていない
        行: [62]
        重み: 決裁に要る

  - 名前: 金額にしにくい効果
    種類: 論証
    主張: 金額にしにくい効果も見込まれるが、まだ確かめられていないため、試験期間中に利用者アンケートで確認する
    行: [64, 66, 68, 69, 70]
    論拠: 本文にない
    根拠:
