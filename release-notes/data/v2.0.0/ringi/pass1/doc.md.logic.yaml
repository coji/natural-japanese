        行: [102]
        重み: 裏づけ
      - 種別: 意見
        内容: 3か月目の中間評価で効果を確かめ、見合わない場合は規模縮小か中止を判断する
        行: [103]
        重み: 裏づけ
      - 種別: 意見
        内容: 月額の上限を設け、ライセンス数を12名分に固定する。6か月で解約できるかなど、契約期間と中途解約の条件を契約前に確認する
        行: [104]
        重み: 裏づけ

