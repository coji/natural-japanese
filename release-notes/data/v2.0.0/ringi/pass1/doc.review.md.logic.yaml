        行: [119]
        重み: 補足

  - 名前: 金額にしにくい効果
    種類: 論証
    主張: 金額にしにくい効果も見込まれるが、まだ確かめられていないため、試験期間中に利用者アンケートで確認する
    行: [121, 123, 125, 126, 127]
    論拠: 本文にない
    根拠:
      - 種別: 推論
        内容: 発言が記録に残るため、聞き漏らしや顧客との認識違いを後から確認できる
        行: [125]
        重み: 補足
      - 種別: 推論
        内容: 議事録が早くできあがり、顧客へのフォローや社内共有を早く始められる
        行: [126]
        重み: 補足
      - 種別: 推論
        内容: 担当者が交代するとき、過去の打ち合わせ内容を引き継ぎやすい
        行: [127]
        重み: 補足
    限界や条件:
      - 内容: まだ確かめられていないため、試験期間中に利用者アンケートで確認する
        行: [123]

  - 名前: 実施体制
    種類: 記述
    主張: 責任者、情報管理担当者、利用者、相談先の役割を並べている
    行: [138, 140, 142, 143, 144, 145]
    根拠:
