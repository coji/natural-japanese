# doc.review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。経営会議が、議事録作成支援ツール「ミナトノート」の6か月の試験導入と費用の上限を決める稟議書

主結論:
  主張: 顧客打ち合わせの議事録作成にかかる時間を減らすため、音声の文字起こしと要約を行うクラウドツール「ミナトノート」を、営業部の営業担当12名で6か月間試験導入したい
  行: [12]
  決裁事項:
    - 内容: 「ミナトノート」を営業部の営業担当12名で6か月間試験導入すること
      行: [99, 101]
    - 内容: 費用の上限を月額10万円、6か月合計60万円とすること
      行: [102]
  制約:
    - 内容: 期間は承認後の【2026年12月】から6か月
      行: [14]
    - 内容: 月額の上限は10万円、6か月の総額は60万円以内。見込みは475,200円
      行: [15]
    - 内容: 上限を超える支出は行わない
      行: [61]
    - 内容: 機材などの費用は想定していない。必要になった場合も上限の範囲で対応し、超える場合は改めて申請する
      行: [62]
    - 内容: 利用者は営業部の営業担当12名
      行: [116]
    - 内容: 月額の上限を設け、ライセンス数を12名分に固定する
      行: [75]
  比べた案:
    - 内容: なし
      行: []
  前提:
    - 種別: 前提
      内容: 部全体で同じ効果が出るかどうかは、この試験導入で確かめる
      行: [32]
      書き手の明示: あり
    - 種別: 前提
      内容: 月約35件のすべてでツールを使えた場合
      行: [30]
      書き手の明示: あり
    - 種別: 前提
      内容: 無料版を1件で試した結果を、1人あたり月額6,600円のプランの見込みに使える
      行: [32, 115, 134]
      書き手の明示: なし
    - 種別: 前提
      内容: 試行の30分の削減には、ツールの出力を担当者が確認・修正する時間が含まれている
      行: [32, 73]
      書き手の明示: なし
    - 種別: 前提
      内容: 削減した時間は、時間単価どおりの金額の価値になる
      行: [38]
      書き手の明示: なし
  依存: [申請内容, 背景と課題, 議事録作成時間の削減, 費用対効果の目安, 費用, リスクと対策, 評価の指標, 判断の基準]

論点:
  - 名前: 申請内容
    種類: 記述
    主張: 営業担当12名で6か月間試験導入する期間、費用、進め方を並べている
    行: [10, 12, 14, 15, 16]
    根拠:
      - 種別: 事実
        内容: 期間は承認後の【2026年12月】から6か月
        行: [14]
        重み: 決裁に要る
      - 種別: 事実
        内容: 月額の上限は10万円、6か月の総額は60万円以内。見込みは475,200円
        行: [15]
        重み: 決裁に要る
      - 種別: 事実
        内容: 試験期間中に効果と情報管理の状況を測定する。3か月目に中間評価、6か月目に最終評価を行い、本導入・規模縮小・中止のいずれにするかを経営会議で改めて判断する
        行: [16]
        重み: 裏づけ

  - 名前: 背景と課題
    種類: 論証
    主張: 議事録の作成は1件約60分で、1人あたり月に約3時間になる
    行: [18, 20, 22, 23, 24]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 議事録の作成には、先月ツールを試した担当者の場合、普段は1件あたり約60分かかっている。担当者は打ち合わせ後、手書きメモをもとに議事録を作成している
        行: [20]
        重み: 裏づけ
      - 種別: 見積
        内容: 営業支援システムの直近6か月の訪問記録では、顧客打ち合わせは営業部全体で週に平均8件、月に約35件ある。12名で割ると1人あたり月に約3件で、1件約60分なら作成時間は1人あたり月に約3時間になる
        行: [22]
        重み: 決裁に要る
      - 種別: 推論
        内容: 手書きメモと記憶をもとに作るため、議事録の正確さは担当者のメモの取り方に左右されると考えられる
        行: [23]
        重み: 裏づけ
    限界や条件:
      - 内容: 部全体での平均作成時間は、試験導入の開始前に測定する
        行: [24]

  - 名前: 議事録作成時間の削減
    種類: 論証
    主張: 参考値どおり1件あたり30分減り、月約35件のすべてでツールを使えた場合、削減時間は月約17時間、6か月で約104時間になる
    行: [26, 28, 30, 32, 129, 131, 133, 134, 135, 136]
    論拠: 本文にない。1件の試行の削減幅が全打ち合わせに当てはまると仮定した計算として書かれている
    根拠:
      - 種別: 事実
        内容: 先月、営業2課の担当者1名が無料版を1件の打ち合わせで試したところ、議事録の作成時間が普段の約60分から30分に減った
        行: [32]
        重み: 裏づけ
      - 種別: 見積
        内容: 約35件(週8件 × 52週 ÷ 12か月)× 1件30分(試行時の参考値)= 月約17時間、6か月で約104時間
        行: [30, 129, 131, 133, 134, 135, 136]
        重み: 決裁に要る
    限界や条件:
      - 内容: この結果は1名・1件だけのものであり、参考値にとどまる。部全体で同じ効果が出るかどうかは、この試験導入で確かめる
        行: [32]

  - 名前: 費用対効果の目安
    種類: 論証
    主張: 参考値の1件30分では費用を回収できず、回収には1件あたり約39分の削減が要る
    行: [34, 36, 38, 40, 42, 43, 44, 46]
    論拠: 月額費用79,200円を月あたりの削減時間で割ると、削減できる1時間あたりの費用になる。営業担当者の時間単価がこの金額を上回れば、費用は回収できる
    根拠:
      - 種別: 見積
        内容: 時間単価は経理部が社内の試算に使う標準単価の1時間3,500円。月額79,200円 ÷ 月の削減時間 = 1件15分で約9,100円、30分(参考値)で約4,600円、45分で約3,000円
        行: [38, 40, 42, 43, 44]
        重み: 決裁に要る
      - 種別: 見積
        内容: 単価6,600円が税抜の場合は月額87,120円になり、回収には1件あたり約43分の削減が要る
        行: [46]
        重み: 決裁に要る

  - 名前: 費用
    種類: 記述
    主張: 単価と人数からの見込み額と、申請する上限を並べている
    行: [48, 50, 52, 54, 55, 56, 57, 58, 60, 61, 62]
    根拠:
      - 種別: 事実
        内容: 単価は6,600円/人・月
        行: [54]
        重み: 決裁に要る
      - 種別: 事実
        内容: 人数は12名
        行: [55]
        重み: 決裁に要る
      - 種別: 見積
        内容: 月額の見込みは79,200円
        行: [56]
        重み: 決裁に要る
      - 種別: 見積
        内容: 6か月合計の見込みは475,200円
        行: [57]
        重み: 決裁に要る
      - 種別: 事実
        内容: 申請する上限は月額10万円、6か月合計60万円
        行: [58]
        重み: 決裁に要る
      - 種別: 見積
        内容: 単価6,600円が税込か税抜かは、契約前に確認する。税抜の場合でも月額は87,120円で、上限の範囲に収まる
        行: [60]
        重み: 決裁に要る
      - 種別: 意見
        内容: 上限と見込みの差額は、税区分や契約条件の確認結果に備えるためのものである。上限を超える支出は行わない
        行: [61]
        重み: 決裁に要る
      - 種別: 意見
        内容: 機材などの費用は想定していない。必要になった場合も上限の範囲で対応し、超える場合は改めて申請する
        行: [62]
        重み: 決裁に要る

  - 名前: リスクと対策
    種類: 記述
    主張: リスクは次の6つで、それぞれの対策を示す
    行: [64, 66, 68, 70, 71, 72, 73, 74, 75]
    根拠:
      - 種別: 意見
        内容: 録音の前に、必ず顧客の同意を得る。同意が得られない打ち合わせでは録音せず、従来どおり手書きで議事録を作る
        行: [70]
        重み: 裏づけ
      - 種別: 意見
        内容: 同意を得られた割合を毎月集計する。利用が少ない場合は、中間評価で人数の縮小を検討する
        行: [71]
        重み: 裏づけ
      - 種別: 意見
        内容: 契約の前に、情報管理担当者がデータの保存場所、AIの学習に使われるかどうか、保存期間と削除の方法、アクセス権の設定を確認する。社内規程に合っているかどうかを情報システム部門と確認し、問題があれば導入しない
        行: [72]
        重み: 決裁に要る
      - 種別: 意見
        内容: ツールの出力をそのまま議事録にせず、担当者が必ず確認・修正してから確定する
        行: [73]
        重み: 裏づけ
      - 種別: 意見
        内容: 3か月目の中間評価で効果を確かめて経営会議に報告し、見合わない場合は規模縮小か中止を経営会議で判断する
        行: [74]
        重み: 裏づけ
      - 種別: 事実
        内容: 月額の上限を設け、ライセンス数を12名分に固定する。月単位で解約でき、最低契約期間はないと販売店に確認した
        行: [75]
        重み: 裏づけ

  - 名前: 評価の指標
    種類: 記述
    主張: 評価の指標は次の5つである
    行: [77, 79, 81, 83, 85, 86, 87, 88, 89]
    根拠:
      - 種別: 意見
        内容: 1件あたりの議事録作成時間は記録シートで開始前と比較し、目安は開始前より平均30分短い。最低でも、3.2の費用対効果が見合う水準
        行: [85]
        重み: 決裁に要る
      - 種別: 意見
        内容: ツールの利用率は記録シートで、利用した件数 ÷ 打ち合わせ件数で測り、目安は【 】%以上
        行: [86]
        重み: 決裁に要る
      - 種別: 意見
        内容: 議事録の品質は利用者アンケート、上長による確認で測り、目安は開始前と同等以上
        行: [87]
        重み: 決裁に要る
      - 種別: 意見
        内容: 情報管理は情報管理担当者による点検で測り、目安は情報漏えい・同意なしの録音が0件
        行: [88]
        重み: 決裁に要る
      - 種別: 意見
        内容: 費用は請求額で測り、目安は月額10万円以内
        行: [89]
        重み: 決裁に要る

  - 名前: 判断の基準
    種類: 記述
    主張: 6か月目末に、次の基準で判断案を経営会議に提出する
    行: [91, 93, 95, 96, 97]
    根拠:
      - 種別: 意見
        内容: 本導入へ進む。作成時間の削減が費用に見合い、利用率と品質が6.1の目安に届き、情報管理上の問題がない場合
        行: [95]
        重み: 決裁に要る
      - 種別: 意見
        内容: 規模を縮小して続ける。効果は出ているが、利用率が低い場合。ライセンス数を減らすなどで続ける
        行: [96]
        重み: 決裁に要る
      - 種別: 意見
        内容: 中止する。削減効果が費用に見合わない場合、または情報管理上の重大な問題が起きた場合。重大な問題が起きた場合は、期間の途中でも利用を止める
        行: [97]
        重み: 決裁に要る
    並列:
      切り口: 効果、利用率、情報管理の状況で3つの判断に分けている
      項目:
        - 内容: 本導入へ進む
          行: [95]
        - 内容: 規模を縮小して続ける
          行: [96]
        - 内容: 中止する
          行: [97]

  - 名前: 導入するツール
    種類: 記述
    主張: ツール名、提供形態、主な機能、プラン、利用者、社外の利用例を並べている
    行: [108, 110, 112, 113, 114, 115, 116, 117, 119]
    根拠:
      - 種別: 事実
        内容: ツール名はミナトノートで、提供形態はクラウドサービス、主な機能は打ち合わせ音声の文字起こし、要約
        行: [112, 113, 114]
        重み: 裏づけ
      - 種別: 事実
        内容: プランは1人あたり月額6,600円
        行: [115]
        重み: 裏づけ
      - 種別: 事実
        内容: 利用者は営業部の営業担当12名
        行: [116]
        重み: 裏づけ
      - 種別: 事実
        内容: 従業員300名の同業A社が全社で導入している
        行: [117]
