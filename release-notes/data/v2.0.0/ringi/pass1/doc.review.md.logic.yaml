        行: [143]
        重み: 裏づけ
      - 種別: 事実
        内容: 利用者は営業担当12名で、ツールの利用、作成時間と録音同意の記録、アンケートへの回答を担う
        行: [144]
        重み: 裏づけ
      - 種別: 事実
