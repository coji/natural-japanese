# doc.review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。人事部の人事企画担当が経営会議に、週1日の在宅勤務制度を2027年4月から始める方針と、その準備への着手を諮る

主結論:
  主張: 内勤の従業員180名を対象に、週1日の在宅勤務制度を2027年4月から始める方針の承認をいただき、試行の結果を踏まえて2月に最終案をお諮りする
  行: [10, 115]
  決裁事項:
    - 内容: 内勤の従業員180名を対象に、週1日の在宅勤務制度を 2027年4月から 始める方針
      行: [8, 10]
    - 内容: 準備として、就業規則の改定、情報システム部との接続環境の調整、一部部署での試行に着手すること
      行: [11]
  制約:
    - 内容: 2027年4月から
      行: [10, 102]
    - 内容: 内勤の従業員180名。試用期間中の者は除く
      行: [50]
    - 内容: 週1日まで。翌週への繰り越しはしない
      行: [51]
    - 内容: 規程の条文や費用の確定額といった制度の詳細は、本日の承認を受けて詰め、2月の経営会議で最終案としてお諮りします
      行: [13]
  比べた案:
    - 内容: 競合の週1〜2日に合わせて最初から大きく始める案(週1日から始める理由として触れている)
      行: [46]
    - 内容: 曜日を本人の希望に任せる案(月曜や金曜に偏るおそれがあるとして退けている)
      行: [60]
  前提:
    - 種別: 前提
      内容: 退職者の言う「働き方の柔軟性のなさ」には、在宅勤務がないことが含まれている
      行: [21, 27, 29]
      書き手の明示: なし
    - 種別: 前提
      内容: 全社250名の離職率の差(年間およそ10名)は、内勤180名への施策で縮められる
      行: [25, 79]
      書き手の明示: なし
    - 種別: 前提
      内容: 外勤の方などのふだんのVPN利用を足しても、どの曜日も同時接続の上限100件に収まる
      行: [60, 62, 113]
      書き手の明示: なし
    - 種別: 前提
      内容: 部署の人数の組み合わせで、曜日ごとの在宅勤務者を均すことができる
      行: [58]
      書き手の明示: なし
    - 種別: 前提
      内容: ノートPCの追加購入と在宅勤務手当の費用が、離職の抑制と採用力の向上の効果に見合う
      行: [79, 85, 87]
      書き手の明示: なし
    - 種別: 前提
      内容: 1〜2部署30名程度の試行で、180名に広げたときの運用を判断できる
      行: [99, 100]
      書き手の明示: なし
  依存: [現状, 目的, 基本の設計, 曜日の割り当て, 期待効果, 費用, 進め方]

論点:
  - 名前: 現状
    種類: 論証
    主張: 当社の離職率は業界平均より4ポイント高く、在宅勤務がないことは「辞める理由」と「選ばれない理由」の両方になっていると考えます
    行: [17, 19, 21, 111, 112]
    論拠: 本文にない(柔軟性のなさと競合の制度の有無から、在宅勤務がないことが理由だと言える橋は書かれていない)
    根拠:
      - 種別: 事実
        内容: 昨年の離職率は12%。250名規模で退職者は31名、うち内勤19名、外勤など12名。業界平均は8%で、当社の規模に当てはめると年間およそ20名
        行: [25]
        重み: 決裁に要る
      - 種別: 事実
        内容: 当社に在宅勤務制度はなく、競合2社は週1〜2日を導入済み
        行: [26, 112]
        重み: 決裁に要る
      - 種別: 事実
        内容: 「働き方の柔軟性のなさ」が退職理由の上位。回答した22名のうち9名が挙げ、そのうち内勤は7名
        行: [27, 111]
        重み: 決裁に要る
      - 種別: 事実
        内容: 業界平均との差は、人数にすると年間でおよそ10名です。退職者アンケートで柔軟性のなさが挙がっていること、競合がすでに制度を持っていることから、在宅勤務がないことを理由と考えています
        行: [29]
        重み: 裏づけ
      - 種別: 推論
        内容: 競合はすでに在宅勤務を導入しており、採用でも見劣りしていると考えます
        行: [112]
        重み: 裏づけ

  - 名前: 目的
    種類: 論証
    主張: 在宅勤務制度の目的は、離職の抑制と採用力の向上です
    行: [31, 33]
    論拠: 退職理由のうち、働き方の柔軟性に関わる部分に手を打つ施策と位置づけています
    根拠:
      - 種別: 意見
        内容: 離職の抑制。柔軟性のなさを理由とした退職を減らす
        行: [35]
        重み: 決裁に要る
      - 種別: 意見
        内容: 採用力の向上。求人で競合と同じく在宅勤務制度があると示せるようにし、応募や内定承諾で見劣りしないようにする
        行: [36]
        重み: 決裁に要る
    並列:
      切り口: 離職と採用という人の出入りで分けている
      項目:
        - 内容: 離職の抑制
          行: [35]
        - 内容: 採用力の向上
          行: [36]
    限界や条件:
      - 内容: 在宅勤務だけで離職率が業界平均まで下がるとは考えていません
        行: [38]

  - 名前: 基本の設計
    種類: 記述
    主張: 週1日から始める理由と、対象者・日数・曜日を並べている
    行: [42, 44, 54]
    根拠:
      - 種別: 事実
        内容: 対象者は内勤の従業員180名。試用期間中の者は除く
        行: [50]
        重み: 決裁に要る
      - 種別: 事実
        内容: 日数は週1日まで。翌週への繰り越しはしない
        行: [51]
        重み: 決裁に要る
      - 種別: 事実
        内容: 曜日は部署ごとに割り当てる
        行: [52]
        重み: 決裁に要る
      - 種別: 意見
        内容: 当社はまず週1日から始め、運用が安定したら日数の見直しを検討します。競合は週1〜2日ですが、最初から大きく始めず、確実に回る形で始めることを優先します
        行: [46]
        重み: 裏づけ

  - 名前: 曜日の割り当て
    種類: 論証
    主張: 週1日・曜日の割り当て制で始めれば、外勤の方などのふだんの利用が大きくない限り、VPNの上限の範囲内で運用できる見込みです
    行: [56, 113]
    論拠: 本文にない(均等に分かれた場合の36名から、部署ごとの割り当てでも上限を大きく下回ると言える橋は書かれていない)
    根拠:
      - 種別: 事実
        内容: 情報システム部によると、VPNの同時接続は100件が上限
        行: [60]
        重み: 決裁に要る
      - 種別: 見積
        内容: 対象の180名が週1日ずつ在宅勤務をする場合、5日に均等に分かれれば1日あたり36名
        行: [60]
        重み: 決裁に要る
      - 種別: 推論
        内容: 本人の希望に任せると月曜や金曜に偏るおそれがあるので、部署ごとに在宅勤務の曜日を割り当て、どの曜日も1日あたりの在宅勤務者がVPNの同時接続の上限を大きく下回るようにする
        行: [58, 60]
        重み: 決裁に要る
    限界や条件:
      - 内容: 外勤の方などがふだんからVPNを使っている場合は、その分も上限に含めて考える必要があります
        行: [62]

  - 名前: 期待効果
    種類: 論証
    主張: 在宅勤務制度で、離職の抑制と採用力の向上を見込みます
    行: [66, 68]
    論拠: 本文にない(在宅勤務が週1日できることから、これらの効果が出ると言える橋は書かれていない)
    根拠:
      - 種別: 推論
        内容: 離職の抑制。柔軟性のなさを理由とした退職が減る。測り方は離職率、退職者アンケートでの理由の順位と割合
        行: [72]
        重み: 決裁に要る
      - 種別: 推論
        内容: 採用力の向上。求人に在宅勤務制度があると示せる。測り方は応募数、内定承諾率、面接辞退の理由
        行: [73]
        重み: 決裁に要る
      - 種別: 推論
        内容: 定着と満足度の面でも、通勤負担が減り、育児や介護との両立がしやすくなると見込み、従業員アンケートで測ります
        行: [75]
        重み: 裏づけ

  - 名前: 数字で示すために必要な情報
    種類: 記述
    主張: 効果を金額で示すのに要る情報と、何名分を埋められるかの確かめ方を並べている
    行: [77]
    根拠:
      - 種別: 事実
        内容: 効果を金額で示すには、退職者1名あたりの採用・育成コストが必要です
        行: [79]
        重み: 裏づけ
      - 種別: 見積
        内容: 仮にこのコストを1名あたり X 円とすると、離職者が年に1名減るごとに X 円の削減になります
        行: [79]
        重み: 裏づけ
    限界や条件:
      - 内容: 業界平均との差である年間およそ10名のうち、何名分を在宅勤務で埋められるかは、導入後の実績で確かめます
        行: [79]

  - 名前: 費用
    種類: 記述
    主張: ノートPCの追加購入の額と、在宅勤務手当の想定額を並べている
    行: [83, 114]
    根拠:
      - 種別: 見積
        内容: 持ち出せるノートPCを持っていない約60名の全員分を買うと、約900万円。内勤180名のうち約60名がデスクトップPCで、1台の購入費は約15万円
        行: [85, 114]
        重み: 決裁に要る
      - 種別: 事実
        内容: 通信費・光熱費を補助する在宅勤務手当を設ける場合は、1日あたり250円を想定
        行: [87]
        重み: 決裁に要る
      - 種別: 意見
        内容: 手当の要否と通勤手当の扱いを決め、金額は2月の最終案で示します
        行: [87, 114]
        重み: 決裁に要る

  - 名前: 進め方
    種類: 記述
    主張: 2027年4月の開始に向けた予定と、開始後の報告の時期を並べている
    行: [91, 93]
    根拠:
      - 種別: 事実
        内容: 2026年11月、本日の経営会議で方針を承認
        行: [97]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2026年11月〜12月、規程の原案を作成。情報システム部とVPN・PC・セキュリティのルールを調整。社会保険労務士に相談
        行: [98]
        重み: 裏づけ
      - 種別: 事実
        内容: 2027年1月〜2月、1〜2部署の30名程度で試行。VPNの接続数、業務への影響、利用者の声を確認
        行: [99]
        重み: 裏づけ
      - 種別: 事実
        内容: 2027年2月、試行の結果を受けて、規程・費用・運用ルールの最終案を経営会議に付議
        行: [100]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2027年2月〜3月、従業員代表への意見聴取、労働基準監督署への届出。管理職向け説明会、全従業員向け説明会
        行: [101]
        重み: 裏づけ
      - 種別: 事実
        内容: 2027年4月、内勤180名で開始
        行: [102]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2027年10月、半年の時点で、利用状況・離職率・採用の指標を経営会議に報告し、日数などの見直しを判断
        行: [103]
        重み: 裏づけ
    限界や条件:
      - 内容: 試行期間中に暫定的なルールが必要かどうかは、社会保険労務士に確認したうえで決めます
        行: [105]

  - 名前: 付録A 申請と勤務の扱い
    種類: 記述
    主張: 申請、勤務時間、勤務場所、出社が必要な日の扱いを並べている
    行: [119]
    根拠:
      - 種別: 事実
        内容: 前週までに上長へ申請し、上長が承認する
        行: [123]
        重み: 裏づけ
      - 種別: 事実
        内容: 通常の勤務時間と同じ。始業・終業は勤怠システムで打刻する
        行: [124]
        重み: 裏づけ
      - 種別: 事実
        内容: 自宅に限る。カフェ等は情報管理のため認めない
        行: [125]
        重み: 裏づけ
      - 種別: 事実
        内容: 会議や来客などで出社が必要な日は、上長が日を変更できる
        行: [126]
        重み: 裏づけ

  - 名前: 付録B 公平性への配慮
    種類: 記述
    主張: 対象外となる70名への説明と、対象外の職種に向けた施策の検討を並べている
    行: [128]
    根拠:
      - 種別: 意見
        内容: 対象外となる70名は内勤以外の従業員で、不公平だという声が出る可能性があります。業務の性質上、在宅勤務が難しい職種であることを丁寧に説明します。たとえば時差出勤や休暇の取りやすさの改善のような、対象外の職種に向けた施策を別途検討します
        行: [130]
        重み: 裏づけ

  - 名前: 付録C 懸念と対策
    種類: 記述
    主張: 導入にあたっての懸念6件と、それぞれの対策を並べている
    行: [132]
    根拠:
      - 種別: 意見
        内容: VPNの同時接続数の上限。部署ごとに曜日を割り当て、1日あたりの在宅勤務者を上限を大きく下回る人数に保つ。試行期間中に、実際の接続数の最大値を測る
        行: [136]
        重み: 裏づけ
      - 種別: 意見
        内容: 労働時間の管理。勤怠システムでの打刻を必須とする。在宅勤務日の時間外労働は事前申請制にする
        行: [137]
        重み: 裏づけ
      - 種別: 意見
        内容: 情報セキュリティ。会社貸与のPCのみ使用可とし、VPN経由で接続する。紙の書類の持ち出しは原則禁止とする。運用ルールは情報システム部と作る
        行: [138]
        重み: 裏づけ
      - 種別: 意見
        内容: 業務の滞りやコミュニケーションの低下。在宅勤務日でも連絡がつくチャットやオンライン会議の手段を決めておく。部署ごとに、在宅でできる業務とできない業務を整理する
        行: [139]
        重み: 裏づけ
      - 種別: 意見
        内容: 評価への不安。在宅勤務の利用の有無を評価に影響させないことを、規程と管理職向けの説明で明確にする
        行: [140]
        重み: 裏づけ
      - 種別: 意見
        内容: 対象外の従業員の不公平感。付録Bのとおり、説明と別施策の検討で対応する
        行: [141]
        重み: 裏づけ

  - 名前: 付録D 就業規則の改定
    種類: 記述
    主張: 就業規則の改定の手続きを並べている
    行: [143]
    根拠:
      - 種別: 事実
        内容: 在宅勤務規程を新設し、就業規則に位置づけます。従業員代表の意見を聴いたうえで、労働基準監督署に届け出ます。社会保険労務士に条文を確認してもらいます
        行: [145]
        重み: 裏づけ

