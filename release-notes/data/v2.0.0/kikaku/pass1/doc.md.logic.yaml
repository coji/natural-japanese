# doc.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。人事部の人事企画担当が経営会議に、週1日の在宅勤務制度を2027年4月から始めることと、その準備への着手を諮る

主結論:
  主張: 内勤の従業員180名を対象に、週1日の在宅勤務制度を2027年4月から始める。本日は方針の承認をいただき、試行の結果を踏まえて2月に最終案をお諮りする
  行: [10, 128]
  決裁事項:
    - 内容: 内勤の従業員180名を対象に、週1日の在宅勤務制度を 2027年4月から 始めること
      行: [8, 10]
    - 内容: 準備として、就業規則の改定、情報システム部との接続環境の調整、一部部署での試行に着手すること
      行: [11]
  制約:
    - 内容: 2027年4月から
      行: [10, 116]
    - 内容: 内勤の従業員180名(試用期間中の者は除く)
      行: [44]
    - 内容: 週1日まで。翌週への繰り越しはしない
      行: [45]
    - 内容: 制度の詳細(規程の条文、費用の確定額)は、本日の承認を受けて詰め、2月の経営会議で最終案としてお諮りします
      行: [13]
  比べた案:
    - 内容: 競合と同じ週2日までを含めて最初から大きく始める案(週1日から始める理由として触れている)
      行: [52]
    - 内容: 曜日を本人の希望に任せる案(月曜や金曜に偏るおそれがあるとして退けている)
      行: [58]
  前提:
    - 種別: 前提
      内容: 退職者の言う「働き方の柔軟性のなさ」は、在宅勤務がないことを指している
      行: [25, 27]
      書き手の明示: なし
    - 種別: 前提
      内容: 全社250名の離職率の差(年間およそ10名)は、内勤180名への施策で縮められる
      行: [23, 80]
      書き手の明示: なし
    - 種別: 前提
      内容: 外勤の方などのふだんのVPN利用を足しても、どの曜日も同時接続の上限100件に収まる
      行: [56, 60, 127]
      書き手の明示: なし
    - 種別: 前提
      内容: 部署の人数の組み合わせで、曜日ごとの在宅勤務者を均すことができる
      行: [58]
      書き手の明示: なし
    - 種別: 前提
      内容: 週1日の制度があれば、競合と同じ条件で求人を出せる
      行: [32, 73]
      書き手の明示: なし
    - 種別: 前提
      内容: 導入と運用の費用が、離職の抑制と採用力の向上の効果に見合う
      行: [78, 80, 95]
      書き手の明示: なし
    - 種別: 前提
      内容: 1〜2部署30名程度の試行で、180名に広げたときの運用を判断できる
      行: [113, 114]
      書き手の明示: なし
  依存: [現状, 目的, 基本の設計, 曜日の割り当て, 期待効果, 懸念と対策, 進め方]

論点:
  - 名前: 現状
    種類: 論証
    主張: 当社の離職率は業界平均より4ポイント高く、在宅勤務がないことは「辞める理由」と「選ばれない理由」の両方になっていると考えます
    行: [17, 19, 27, 125, 126]
    論拠: 本文にない(退職者が挙げる柔軟性のなさと競合の制度の有無から、在宅勤務がないことが理由だと言える橋は書かれていない)
    根拠:
      - 種別: 事実
        内容: 昨年の離職率は12%で250名規模で年間およそ30名、業界平均は8%で当社の規模に当てはめると年間およそ20名、差は年間およそ10名
        行: [23, 27]
        重み: 決裁に要る
      - 種別: 事実
        内容: 退職者アンケートで「働き方の柔軟性のなさ」が退職理由の上位
        行: [25, 27]
        重み: 決裁に要る
      - 種別: 事実
        内容: 当社に在宅勤務制度はなく、競合2社は週1〜2日を導入済み
        行: [24, 27]
        重み: 決裁に要る
      - 種別: 推論
        内容: 競合はすでに在宅勤務を導入しており、採用でも見劣りしています
        行: [126]
        重み: 裏づけ

  - 名前: 目的
    種類: 論証
    主張: 在宅勤務の目的は離職の抑制と採用力の向上で、退職理由のうち働き方の柔軟性に関わる部分に手を打つ施策と位置づける
    行: [29, 34]
    論拠: 退職理由のうち、働き方の柔軟性に関わる部分に手を打つ施策と位置づけています
    根拠:
      - 種別: 意見
        内容: 離職の抑制。柔軟性のなさを理由とした退職を減らす
        行: [31]
        重み: 決裁に要る
      - 種別: 意見
        内容: 採用力の向上。求人で競合と同じ条件を示せるようにし、応募や内定承諾で見劣りしないようにする
        行: [32]
        重み: 決裁に要る
    並列:
      切り口: 離職と採用という人の出入りで分けている
      項目:
        - 内容: 離職の抑制
          行: [31]
        - 内容: 採用力の向上
          行: [32]
    限界や条件:
      - 内容: 在宅勤務だけで離職率が業界平均まで下がるとは考えていません
        行: [34]

  - 名前: 基本の設計
    種類: 記述
    主張: 対象者・日数・曜日・申請・勤務時間・勤務場所・出社が必要な日の扱いを並べている
    行: [38, 40]
    根拠:
      - 種別: 事実
        内容: 対象者は内勤の従業員180名(試用期間中の者は除く)
        行: [44]
        重み: 決裁に要る
      - 種別: 事実
        内容: 日数は週1日まで。翌週への繰り越しはしない
        行: [45]
        重み: 決裁に要る
      - 種別: 事実
        内容: 曜日は部署ごとに割り当てる
        行: [46]
        重み: 決裁に要る
      - 種別: 事実
        内容: 前週までに上長へ申請し、上長が承認する
        行: [47]
        重み: 裏づけ
      - 種別: 事実
        内容: 勤務時間は通常と同じ。始業・終業は勤怠システムで打刻する
        行: [48]
        重み: 裏づけ
      - 種別: 事実
        内容: 勤務場所は自宅に限る(カフェ等は情報管理の観点から認めない)
        行: [49]
        重み: 裏づけ
      - 種別: 事実
        内容: 会議や来客などで出社が必要な日は、上長が日を変更できる
        行: [50]
        重み: 裏づけ
      - 種別: 意見
        内容: 競合は週1〜2日です。当社はまず週1日から始め、運用が安定したら日数の見直しを検討します。最初から大きく始めず、確実に回る形で始めることを優先します
        行: [52]
        重み: 裏づけ

  - 名前: 曜日の割り当て
    種類: 論証
    主張: 週1日・曜日の割り当て制で始めれば、VPNの上限の範囲内で運用できる見込みです
    行: [54, 127]
    論拠: 本文にない(均等に分かれた場合の36名から、部署ごとの割り当てでも上限を大きく下回ると言える橋は書かれていない)
    根拠:
      - 種別: 事実
        内容: 情報システム部によると、VPNの同時接続は100件が上限
        行: [56]
        重み: 決裁に要る
      - 種別: 見積
        内容: 対象の180名が週1日ずつ在宅勤務をする場合、5日に均等に分かれれば1日あたり36名
        行: [58]
        重み: 決裁に要る
      - 種別: 推論
        内容: 本人の希望に任せると月曜や金曜に偏るおそれがあるので、部署ごとに曜日を割り当て、どの曜日も1日あたりの在宅勤務者が上限を大きく下回るようにする
        行: [58]
        重み: 決裁に要る
    限界や条件:
      - 内容: 外勤の方などがふだんからVPNを使っている場合は、その分も上限に含めて考える必要があります。現在の利用状況は情報システム部に確認中です
        行: [60]

  - 名前: 公平性への配慮
    種類: 記述
    主張: 対象外となる70名への説明と、対象外の職種に向けた施策の検討を並べている
    行: [62]
    根拠:
      - 種別: 推論
        内容: 対象外となる70名(内勤以外の従業員)からは、不公平だという声が出る可能性があります
        行: [64]
        重み: 裏づけ
      - 種別: 意見
        内容: 業務の性質上、在宅勤務が難しい職種であることを丁寧に説明する
        行: [64]
        重み: 裏づけ
      - 種別: 意見
        内容: 対象外の職種に向けた施策(たとえば時差出勤や休暇の取りやすさの改善)を、別途検討することを提案します
        行: [64]
        重み: 裏づけ

  - 名前: 期待効果
    種類: 論証
    主張: 離職の抑制、採用力の向上、定着と満足度の3つの効果を期待し、それぞれの測り方を置く
    行: [68]
    論拠: 本文にない(在宅勤務が週1日できることから、これらの効果が出ると言える橋は書かれていない)
    根拠:
      - 種別: 推論
        内容: 離職の抑制。柔軟性のなさを理由とした退職が減る。測り方は離職率、退職者アンケートでの理由の順位と割合
        行: [72]
        重み: 決裁に要る
      - 種別: 推論
        内容: 採用力の向上。求人の条件で競合と並ぶ。測り方は応募数、内定承諾率、面接辞退の理由
        行: [73]
        重み: 決裁に要る
      - 種別: 推論
        内容: 定着と満足度。通勤負担が減り、育児や介護との両立がしやすくなる。測り方は従業員アンケート
        行: [74]
        重み: 裏づけ
    並列:
      切り口: 効果の種類で分けている
      項目:
        - 内容: 離職の抑制
          行: [72]
        - 内容: 採用力の向上
          行: [73]
        - 内容: 定着と満足度
          行: [74]

  - 名前: 数字で示すために必要な情報
    種類: 記述
    主張: 効果を金額で示すのに足りない情報と、何名分を埋められるかの確かめ方を並べている
    行: [76]
    根拠:
      - 種別: 事実
        内容: 効果を金額で示すには、退職者1名あたりの採用・育成コストが必要です。これは現在、人事部で集計中です
        行: [78]
        重み: 裏づけ
      - 種別: 見積
        内容: 仮にこのコストを1名あたり X 円とすると、離職者が年に1名減るごとに X 円の削減になります
        行: [80]
        重み: 裏づけ
    限界や条件:
      - 内容: 業界平均との差(年間およそ10名)のうち、何名分を在宅勤務で埋められるかは、導入後の実績で確かめます
        行: [80]

  - 名前: 懸念と対策
    種類: 記述
    主張: 導入にあたっての懸念8件と、それぞれの対策を並べている
    行: [84]
    根拠:
      - 種別: 意見
        内容: VPNの同時接続数の上限(100)。部署ごとに曜日を割り当て、1日あたりの在宅勤務者を上限よりも十分少なく保つ。試行期間中に、実際の接続数の最大値を測る
        行: [88]
        重み: 裏づけ
      - 種別: 意見
        内容: 就業規則の改定が必要。在宅勤務規程を新設し、就業規則に位置づける。従業員代表の意見を聴いたうえで、労働基準監督署に届け出る。社会保険労務士に条文を確認してもらう
        行: [89]
        重み: 裏づけ
      - 種別: 意見
        内容: 労働時間の管理。勤怠システムでの打刻を必須とする。在宅勤務日の時間外労働は事前申請制にする
        行: [90]
        重み: 裏づけ
      - 種別: 意見
        内容: 情報セキュリティ。会社貸与のPCのみ使用可とし、VPN経由で接続する。紙の書類の持ち出しは原則禁止とする。運用ルールは情報システム部と作る
        行: [91]
        重み: 裏づけ
      - 種別: 意見
        内容: 業務の滞りやコミュニケーションの低下。連絡がつく手段を決めておく。部署ごとに、在宅でできる業務とできない業務を整理する
        行: [92]
        重み: 裏づけ
      - 種別: 意見
        内容: 評価への不安。在宅勤務の利用の有無を評価に影響させないことを、規程と管理職向けの説明で明確にする
        行: [93]
        重み: 裏づけ
      - 種別: 意見
        内容: 対象外の従業員の不公平感。説明と別施策の検討で対応する
        行: [94]
        重み: 裏づけ
      - 種別: 意見
        内容: 費用。通信費・光熱費の補助(在宅勤務手当)の要否、通勤手当の扱いを決める。金額は2月の最終案で示す
        行: [95]
        重み: 裏づけ

  - 名前: 事前に確認が必要なこと
    種類: 記述
    主張: まだ確認できていない3つを並べている
    行: [97]
    根拠:
      - 種別: 事実
        内容: 内勤180名のうち、持ち出せるPC(ノートPC)を持っていない人の数と、追加購入の費用
        行: [99]
        重み: 裏づけ
      - 種別: 事実
        内容: 外勤の方などによる、現在のVPNの利用状況
        行: [100]
        重み: 裏づけ
      - 種別: 事実
        内容: 在宅勤務手当を設ける場合の金額と、年間の総額
        行: [101]
        重み: 裏づけ

  - 名前: 進め方
    種類: 記述
    主張: 2027年4月の開始に向けた予定と、開始後の報告の時期を並べている
    行: [105, 107]
    根拠:
      - 種別: 事実
        内容: 2026年11月、経営会議で方針を承認(本日)
        行: [111]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2026年11月〜12月、規程の原案を作成。情報システム部とVPN・PC・セキュリティのルールを調整。社会保険労務士に相談
        行: [112]
        重み: 裏づけ
      - 種別: 事実
        内容: 2027年1月〜2月、1〜2部署(30名程度)で試行。VPNの接続数、業務への影響、利用者の声を確認
        行: [113]
        重み: 裏づけ
      - 種別: 事実
        内容: 2027年2月、試行の結果を受けて最終案を経営会議に付議(規程・費用・運用ルール)
        行: [114]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2027年2月〜3月、従業員代表への意見聴取、労働基準監督署への届出。管理職向け説明会、全従業員向け説明会
        行: [115]
        重み: 裏づけ
      - 種別: 事実
        内容: 2027年4月、全社(内勤180名)で開始
        行: [116]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2027年10月、半年の時点で、利用状況・離職率・採用の指標を経営会議に報告し、日数などの見直しを判断
        行: [117]
        重み: 裏づけ
    限界や条件:
      - 内容: 試行期間中の扱い(暫定的なルールが必要かどうか)は、社会保険労務士に確認したうえで決めます
        行: [119]

