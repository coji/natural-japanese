# doc.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。経営会議が、内勤180名を対象にした週1日の在宅勤務制度の導入と、その準備への着手を決める企画

主結論:
  主張: 内勤の従業員180名を対象に、週1日の在宅勤務制度を2027年4月から始める。本日は方針の承認をいただき、試行の結果を踏まえて2月に最終案をお諮りする
  行: [10, 123, 125, 126, 127, 128]
  決裁事項:
    - 内容: 内勤の従業員180名を対象に、週1日の在宅勤務制度を 2027年4月から 始めること
      行: [8, 10]
    - 内容: 準備として、就業規則の改定、情報システム部との接続環境の調整、一部部署での試行に着手すること
      行: [8, 11]
  制約:
    - 内容: 2027年4月から
      行: [10]
    - 内容: 内勤の従業員180名(試用期間中の者は除く)
      行: [10, 44]
    - 内容: 週1日まで。翌週への繰り越しはしない
      行: [45]
    - 内容: 制度の詳細(規程の条文、費用の確定額)は、本日の承認を受けて詰め、2月の経営会議で最終案としてお諮りします
      行: [13]
  比べた案:
    - 内容: 週2日まで(競合は週1〜2日。当社はまず週1日から始める)
      行: [52]
    - 内容: 曜日を本人の希望に任せる(月曜や金曜に偏るおそれがある)
      行: [58]
  前提:
    - 種別: 前提
      内容: 退職者が挙げる「働き方の柔軟性のなさ」は、在宅勤務制度がないことを指している
      行: [25, 27, 31]
      書き手の明示: なし
    - 種別: 前提
      内容: 業界平均との差にあたる退職者の少なくとも一部は、制度の対象である内勤180名から出ている
      行: [10, 23, 64]
      書き手の明示: なし
    - 種別: 前提
      内容: 内勤180名は全員、在宅勤務に使えるPCがあり、在宅でできる業務を持っている
      行: [10, 92, 99]
      書き手の明示: なし
    - 種別: 前提
      内容: 在宅勤務者1名につきVPNの同時接続は1件である
      行: [56, 58, 91]
      書き手の明示: なし
    - 種別: 前提
      内容: 外勤の方などがふだんからVPNを使っている場合は、その分も上限に含めて考える必要がある
      行: [60]
      書き手の明示: あり
  依存: [現状, 目的, 基本の設計, 曜日の割り当て, 3. 期待効果, 4. 懸念と対策, 事前に確認が必要なこと, 5. 進め方]

論点:
  - 名前: 現状
    種類: 論証
    主張: 在宅勤務がないことは「辞める理由」と「選ばれない理由」の両方になっていると考えます
    行: [17, 19, 27]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 退職者アンケートで「働き方の柔軟性のなさ」が退職理由の上位。退職者自身が柔軟性のなさを理由に挙げている
        行: [25, 27]
        重み: 決裁に要る
      - 種別: 事実
        内容: 当社に在宅勤務制度はなく、競合2社は週1〜2日を導入済み。競合がすでに制度を持っている
        行: [24, 27]
        重み: 決裁に要る
      - 種別: 見積
        内容: 昨年の離職率は12%(250名規模で年間およそ30名)、業界平均は8%(当社の規模に当てはめると年間およそ20名)。業界平均との差は、人数にすると年間でおよそ10名
        行: [23, 27]
        重み: 裏づけ

  - 名前: 目的
    種類: 論証
    主張: 在宅勤務は、退職理由のうち働き方の柔軟性に関わる部分に手を打つ施策と位置づけている。目的は離職の抑制と採用力の向上
    行: [29, 34]
    論拠: 本文にない
    根拠:
      - 種別: 意見
        内容: 離職の抑制。柔軟性のなさを理由とした退職を減らす
        行: [31]
        重み: 決裁に要る
      - 種別: 意見
        内容: 採用力の向上。求人で競合と同じ条件を示せるようにし、応募や内定承諾で見劣りしないようにする
        行: [32]
        重み: 決裁に要る
    並列:
      切り口: 制度で手を打つ先(今いる人の離職と、これから来る人の採用)で分けている
      項目:
        - 内容: 離職の抑制
          行: [31]
        - 内容: 採用力の向上
          行: [32]
    限界や条件:
      - 内容: 在宅勤務だけで離職率が業界平均まで下がるとは考えていません
        行: [34]

  - 名前: 基本の設計
    種類: 記述
    主張: 在宅勤務制度の案を項目ごとに並べている
    行: [38, 40]
    根拠:
      - 種別: 事実
        内容: 対象者は内勤の従業員180名(試用期間中の者は除く)
        行: [44]
        重み: 決裁に要る
      - 種別: 事実
        内容: 日数は週1日まで。翌週への繰り越しはしない
        行: [45]
        重み: 決裁に要る
      - 種別: 事実
        内容: 曜日は部署ごとに割り当てる
        行: [46]
        重み: 決裁に要る
      - 種別: 事実
        内容: 申請は前週までに上長へ申請し、上長が承認する
        行: [47]
        重み: 裏づけ
      - 種別: 事実
        内容: 勤務時間は通常の勤務時間と同じ。始業・終業は勤怠システムで打刻する
        行: [48]
        重み: 裏づけ
      - 種別: 事実
        内容: 勤務場所は自宅に限る(カフェ等は情報管理の観点から認めない)
        行: [49]
        重み: 裏づけ
      - 種別: 事実
        内容: 会議や来客などで出社が必要な日は、上長が日を変更できる
        行: [50]
        重み: 裏づけ
      - 種別: 意見
        内容: 競合は週1〜2日です。当社はまず週1日から始め、運用が安定したら日数の見直しを検討します。最初から大きく始めず、確実に回る形で始めることを優先します
        行: [52]
        重み: 裏づけ

  - 名前: 曜日の割り当て
    種類: 論証
    主張: 部署ごとに在宅勤務の曜日を割り当て、どの曜日も1日あたりの在宅勤務者が上限を大きく下回るようにします
    行: [54, 58]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 情報システム部によると、VPNの同時接続は100件が上限
        行: [56]
        重み: 決裁に要る
      - 種別: 推論
        内容: 本人の希望に任せると月曜や金曜に偏るおそれがあります
        行: [58]
        重み: 決裁に要る
      - 種別: 見積
        内容: 対象の180名が週1日ずつ在宅勤務をする場合、5日に均等に分かれれば1日あたり36名
        行: [58]
        重み: 裏づけ
    限界や条件:
      - 内容: 外勤の方などがふだんからVPNを使っている場合は、その分も上限に含めて考える必要があります。現在の利用状況は情報システム部に確認中です
        行: [60]

  - 名前: 公平性への配慮
    種類: 記述
    主張: 対象外となる70名への説明と、別の施策の検討の提案を書いている
    行: [62]
    根拠:
      - 種別: 推論
        内容: 対象外となる70名(内勤以外の従業員)からは、不公平だという声が出る可能性があります
        行: [64]
        重み: 裏づけ
      - 種別: 意見
        内容: 業務の性質上、在宅勤務が難しい職種であることを丁寧に説明するとともに、対象外の職種に向けた施策(たとえば時差出勤や休暇の取りやすさの改善)を、別途検討することを提案します
        行: [64]
        重み: 裏づけ

  - 名前: 3. 期待効果
    種類: 論証
    主張: 導入の効果として、離職の抑制、採用力の向上、定着と満足度の3つを見込む
    行: [68]
    論拠: 本文にない
    根拠:
      - 種別: 推論
        内容: 離職の抑制。柔軟性のなさを理由とした退職が減る。測り方は離職率、退職者アンケートでの理由の順位と割合
        行: [72]
        重み: 決裁に要る
      - 種別: 推論
        内容: 採用力の向上。求人の条件で競合と並ぶ。測り方は応募数、内定承諾率、面接辞退の理由
        行: [73]
        重み: 決裁に要る
      - 種別: 推論
        内容: 定着と満足度。通勤負担が減り、育児や介護との両立がしやすくなる。測り方は従業員アンケート
        行: [74]
        重み: 裏づけ
    並列:
      切り口: 効果の種類で分けている
      項目:
        - 内容: 離職の抑制
          行: [72]
        - 内容: 採用力の向上
          行: [73]
        - 内容: 定着と満足度
          行: [74]

  - 名前: 数字で示すために必要な情報
    種類: 記述
    主張: 効果を金額で示すのに足りない情報と、確かめる時期を書いている
    行: [76]
    根拠:
      - 種別: 事実
        内容: 効果を金額で示すには、退職者1名あたりの採用・育成コストが必要です。これは現在、人事部で集計中です
        行: [78]
        重み: 裏づけ
      - 種別: 見積
        内容: 仮にこのコストを1名あたり X 円とすると、離職者が年に1名減るごとに X 円の削減になります
        行: [80]
        重み: 裏づけ
      - 種別: 意見
        内容: 業界平均との差(年間およそ10名)のうち、何名分を在宅勤務で埋められるかは、導入後の実績で確かめます
        行: [80]
        重み: 裏づけ

  - 名前: 4. 懸念と対策
    種類: 記述
    主張: 導入で懸念されることと、その対策を8行で並べている
    行: [84]
    根拠:
      - 種別: 事実
        内容: VPNの同時接続数の上限(100)。部署ごとに曜日を割り当て、1日あたりの在宅勤務者を上限よりも十分少なく保つ。試行期間中に、実際の接続数の最大値を測る
        行: [88]
        重み: 裏づけ
      - 種別: 事実
        内容: 就業規則の改定が必要。在宅勤務規程を新設し、就業規則に位置づける。従業員代表の意見を聴いたうえで、労働基準監督署に届け出る。社会保険労務士に条文を確認してもらう
        行: [89]
        重み: 決裁に要る
      - 種別: 事実
        内容: 労働時間の管理。勤怠システムでの打刻を必須とする。在宅勤務日の時間外労働は事前申請制にする
        行: [90]
        重み: 裏づけ
      - 種別: 事実
        内容: 情報セキュリティ。会社貸与のPCのみ使用可とし、VPN経由で接続する。紙の書類の持ち出しは原則禁止とする。運用ルールは情報システム部と作る
        行: [91]
        重み: 裏づけ
      - 種別: 事実
        内容: 業務の滞りやコミュニケーションの低下。在宅勤務日でも連絡がつく手段を決めておく。部署ごとに、在宅でできる業務とできない業務を整理する
        行: [92]
        重み: 裏づけ
      - 種別: 事実
        内容: 評価への不安。在宅勤務の利用の有無を評価に影響させないことを、規程と管理職向けの説明で明確にする
        行: [93]
        重み: 裏づけ
      - 種別: 事実
        内容: 対象外の従業員の不公平感。2章の「公平性への配慮」のとおり、説明と別施策の検討で対応する
        行: [94]
        重み: 裏づけ
      - 種別: 事実
        内容: 費用。通信費・光熱費の補助(在宅勤務手当)の要否、通勤手当の扱いを決める。金額は2月の最終案で示す
        行: [95]
        重み: 裏づけ
    並列:
      切り口: 導入にあたって気にかかることで分けている
      項目:
        - 内容: VPNの同時接続数の上限(100)
          行: [88]
        - 内容: 就業規則の改定が必要
          行: [89]
        - 内容: 労働時間の管理
          行: [90]
        - 内容: 情報セキュリティ
          行: [91]
        - 内容: 業務の滞りやコミュニケーションの低下
          行: [92]
        - 内容: 評価への不安
          行: [93]
        - 内容: 対象外の従業員の不公平感
          行: [94]
        - 内容: 費用
          行: [95]

  - 名前: 事前に確認が必要なこと
    種類: 記述
    主張: 事前に確認が必要なことを3項目並べている
    行: [97]
    根拠:
      - 種別: 事実
        内容: 内勤180名のうち、持ち出せるPC(ノートPC)を持っていない人の数と、追加購入の費用
        行: [99]
        重み: 裏づけ
      - 種別: 事実
        内容: 外勤の方などによる、現在のVPNの利用状況
        行: [100]
        重み: 裏づけ
      - 種別: 事実
        内容: 在宅勤務手当を設ける場合の金額と、年間の総額
        行: [101]
        重み: 裏づけ

  - 名前: 5. 進め方
    種類: 記述
    主張: 2027年4月の開始に向けた予定を時期ごとに並べている
    行: [105, 107]
    根拠:
      - 種別: 事実
        内容: 2026年11月、経営会議で方針を承認(本日)
        行: [111]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2026年11月〜12月、規程の原案を作成。情報システム部とVPN・PC・セキュリティのルールを調整。社会保険労務士に相談
        行: [112]
        重み: 裏づけ
      - 種別: 事実
        内容: 2027年1月〜2月、1〜2部署(30名程度)で試行。VPNの接続数、業務への影響、利用者の声を確認
        行: [113]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2027年2月、試行の結果を受けて最終案を経営会議に付議(規程・費用・運用ルール)
        行: [114]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2027年2月〜3月、従業員代表への意見聴取、労働基準監督署への届出。管理職向け説明会、全従業員向け説明会
        行: [115]
        重み: 裏づけ
      - 種別: 事実
        内容: 2027年4月、全社(内勤180名)で開始
        行: [116]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2027年10月、半年の時点で、利用状況・離職率・採用の指標を経営会議に報告し、日数などの見直しを判断
        行: [117]
        重み: 裏づけ
    限界や条件:
      - 内容: 試行期間中の扱い(暫定的なルールが必要かどうか)は、社会保険労務士に確認したうえで決めます
        行: [119]

