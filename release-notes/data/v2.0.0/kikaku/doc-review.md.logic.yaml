        内容: VPNの同時接続数の上限(100)。部署ごとに曜日を割り当て、1日あたりの在宅勤務者が上限を大きく下回るように保つ。試行期間中に、実際の接続数の最大値を測る
        行: [96]
        重み: 裏づけ
      - 種別: 事実
        内容: 対象外の従業員の不公平感。2章の「公平性への配慮」のとおり、説明と別施策の検討で対応する
        行: [97]
        重み: 裏づけ

