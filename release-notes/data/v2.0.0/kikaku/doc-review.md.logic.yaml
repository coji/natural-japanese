# doc-review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。経営会議が、内勤180名を対象にした週1日の在宅勤務制度を作る方針と、規程と費用の準備の着手を承認するかを決める企画

主結論:
  主張: 内勤の従業員180名を対象に、週1日の在宅勤務制度を作る方針を承認いただき、規程と費用の準備を始める。試行の結果を踏まえて2月に、開始日を含む最終案をお諮りする
  行: [10, 11, 13, 121, 126]
  決裁事項:
    - 内容: 内勤の従業員180名を対象に、週1日の在宅勤務制度を作る方針を承認いただくこと(開始は 2027年4月 を目標とします)
      行: [8, 10]
    - 内容: 規程と費用の準備を始めること。就業規則の改定、情報システム部との接続環境の調整、一部部署での試行に着手します
      行: [8, 11]
  制約:
    - 内容: 開始は 2027年4月 を目標とします
      行: [10, 103, 112]
    - 内容: 内勤の従業員180名(試用期間中の者は除く)
      行: [10, 48]
    - 内容: 週1日まで。翌週への繰り越しはしない
      行: [49]
    - 内容: 制度の詳細(規程の条文、費用の確定額)は、本日の承認を受けて詰め、2月の経営会議で最終案としてお諮りします。開始日も、その最終案で改めて決めていただきます
      行: [13]
  比べた案:
    - 内容: 日数を最初から増やす(当社は増やさず、確実に回る形で始めることを優先する)
      行: [52]
    - 内容: 本人の希望に任せる(月曜や金曜に偏るおそれがある)
      行: [58]
  前提:
    - 種別: 前提
      内容: 制度が退職者の求めていた柔軟性に応えられる
      行: [76]
      書き手の明示: あり
    - 種別: 前提
      内容: 退職者が挙げる「働き方の柔軟性のなさ」は、在宅勤務制度がないことを指している
      行: [21, 27, 33]
      書き手の明示: なし
    - 種別: 前提
      内容: 業界平均との差にあたる退職者の少なくとも一部は、制度の対象である内勤180名から出ている
      行: [25, 29, 80]
      書き手の明示: なし
    - 種別: 前提
      内容: 在宅勤務者1名につきVPNの同時接続は1件である
      行: [58, 125]
      書き手の明示: なし
    - 種別: 前提
      内容: 外勤の方などがふだんからVPNを使っている場合は、その分も上限に含めて考える必要がある
      行: [60]
      書き手の明示: あり
  依存: [現状, 目的, 期待効果, 基本の設計, 曜日の割り当て, 費用, 5. 進め方]

論点:
  - 名前: 現状
    種類: 論証
    主張: 当社の離職率は業界平均より4ポイント高く、在宅勤務がないことは「辞める理由」の一部で、「選ばれない理由」にもなりうると考えます
    行: [17, 19, 21, 23]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 昨年の離職率 12%(250名規模で31名。内勤19名、外勤など12名)。業界平均 8%(当社の規模に当てはめると年間およそ20名)
        行: [25]
        重み: 決裁に要る
      - 種別: 事実
        内容: 在宅勤務制度はなし。競合2社は週1〜2日を導入済み
        行: [26]
        重み: 決裁に要る
      - 種別: 事実
        内容: 退職者アンケートの回答者は22名。「働き方の柔軟性のなさ」が退職理由の上位で、挙げたのは9名(うち内勤7名)。自由記述で在宅勤務に触れたのは4名
        行: [27]
        重み: 決裁に要る
      - 種別: 見積
        内容: 業界平均との差は、人数にすると年間でおよそ10名です
        行: [29]
        重み: 裏づけ
      - 種別: 事実
        内容: 当社の離職率は業界平均より4ポイント高く、退職者アンケートの回答者22名のうち9名が働き方の柔軟性のなさを理由に挙げています
        行: [123]
        重み: 裏づけ
      - 種別: 推論
        内容: 競合2社はすでに在宅勤務を導入しており、採用でも見劣りするおそれがあります
        行: [124]
        重み: 裏づけ

  - 名前: 目的
    種類: 論証
    主張: 在宅勤務は、退職理由のうち働き方の柔軟性に関わる部分に手を打つ施策と位置づけています
    行: [31, 33]
    論拠: 本文にない
    根拠:
      - 種別: 意見
        内容: 離職の抑制:柔軟性のなさを理由とした退職を減らす
        行: [35]
        重み: 裏づけ
      - 種別: 意見
        内容: 採用力の向上:求人で在宅勤務の制度を示せるようにし、応募や内定承諾で見劣りしないようにする
        行: [36]
        重み: 裏づけ
    並列:
      切り口: 辞める側と入る側で分けている
      項目:
        - 内容: 離職の抑制
          行: [35]
        - 内容: 採用力の向上
          行: [36]
    限界や条件:
      - 内容: 在宅勤務だけで離職率が業界平均まで下がるとは考えていません
        行: [33]

  - 名前: 基本の設計
    種類: 記述
    主張: 週1日まで、曜日は部署ごとの割り当てで始めます
    行: [40, 42, 44, 46]
    根拠:
      - 種別: 事実
        内容: 対象者 内勤の従業員180名(試用期間中の者は除く)
        行: [48]
        重み: 決裁に要る
      - 種別: 事実
        内容: 日数 週1日まで。翌週への繰り越しはしない
        行: [49]
        重み: 決裁に要る
      - 種別: 事実
        内容: 曜日 部署ごとに割り当てる
        行: [50]
        重み: 決裁に要る
      - 種別: 意見
        内容: 日数を最初から増やさず、確実に回る形で始めることを優先します
        行: [52]
        重み: 決裁に要る
      - 種別: 意見
        内容: 当社はまず週1日から始め、運用が安定したら日数の見直しを検討します
        行: [52]
        重み: 補足

  - 名前: 曜日の割り当て
    種類: 論証
    主張: 部署ごとに在宅勤務の曜日を割り当て、どの曜日も1日あたりの在宅勤務者が上限を大きく下回るようにします
    行: [54, 56]
    論拠: 本人の希望に任せると月曜や金曜に偏るおそれがある
    根拠:
      - 種別: 事実
        内容: 情報システム部によると、VPNの同時接続は100件が上限です
        行: [58]
        重み: 決裁に要る
      - 種別: 見積
        内容: 対象の180名が週1日ずつ在宅勤務をする場合、5日に均等に分かれれば1日あたり36名です
        行: [58]
        重み: 決裁に要る
      - 種別: 推論
        内容: 本人の希望に任せると月曜や金曜に偏るおそれがあります
        行: [58]
        重み: 決裁に要る
      - 種別: 推論
        内容: 週1日・曜日の割り当て制で始めれば、均等に分かれた場合の在宅勤務者は1日36名で、VPNの上限100件を下回ります。ふだんの利用分は確認中です
        行: [125]
        重み: 決裁に要る
    限界や条件:
      - 内容: 外勤の方などがふだんからVPNを使っている場合は、その分も上限に含めて考える必要があります。現在の利用状況は情報システム部に確認中です
        行: [60]

  - 名前: 公平性への配慮
    種類: 論証
    主張: 対象外となる70名(内勤以外の従業員)に説明するとともに、対象外の職種に向けた施策を別途検討することを提案します
    行: [62, 64]
    論拠: 不公平だという声が出る可能性があるためです
    根拠:
      - 種別: 推論
        内容: 不公平だという声が出る可能性があるためです
        行: [64]
        重み: 裏づけ
      - 種別: 事実
        内容: 業務の性質上、在宅勤務が難しい職種である
        行: [64]
        重み: 裏づけ

  - 名前: 期待効果
    種類: 論証
    主張: 見込む効果は離職の抑制と採用力の向上で、次の指標で測ります
    行: [68, 70, 72, 74]
    論拠: 制度が退職者の求めていた柔軟性に応えられれば、柔軟性のなさを理由とした退職が減る
    根拠:
      - 種別: 推論
        内容: 離職の抑制 制度が退職者の求めていた柔軟性に応えられれば、柔軟性のなさを理由とした退職が減る。離職率、退職者アンケートでの理由の順位と割合で測る
        行: [76]
        重み: 決裁に要る
      - 種別: 推論
        内容: 採用力の向上 求人で在宅勤務の制度を示せるようになり、応募や内定承諾で見劣りしにくくなる。応募数、内定承諾率、面接辞退の理由で測る
        行: [77]
        重み: 決裁に要る
      - 種別: 推論
        内容: 付随する効果 通勤負担が減り、育児や介護との両立がしやすくなる。従業員アンケートで測る
        行: [78]
        重み: 補足
    限界や条件:
      - 内容: 業界平均との差(年間およそ10名)のうち、何名分を在宅勤務で埋められるかは、導入後の実績で確かめます
        行: [80]

  - 名前: 費用
    種類: 記述
    主張: いま概算が出ている費用は、ノートPCの追加購入費の約900万円です
    行: [82, 84]
    根拠:
      - 種別: 見積
        内容: 内勤180名のうち約60名がデスクトップPCで、1台の購入費が約15万円なので、60台すべてを買う場合の金額です
        行: [84]
        重み: 決裁に要る
      - 種別: 見積
        内容: 在宅勤務手当は、設ける場合は1日あたり250円を想定しています
        行: [84]
        重み: 決裁に要る
      - 種別: 事実
        内容: 手当の要否と年間の総額、通勤手当の扱いは、2月の最終案で示します
        行: [84]
        重み: 決裁に要る
      - 種別: 事実
        内容: 効果を金額で示すには、退職者1名あたりの採用・育成コストが必要です。これは現在、人事部で集計中で、2月までに出ます
        行: [86]
        重み: 裏づけ
      - 種別: 推論
        内容: 離職者が年に1名減るごとに、このコスト1名分の削減になります
        行: [86]
        重み: 裏づけ

  - 名前: 4. 懸念と対策
    種類: 記述
    主張: VPNの上限と対象外の従業員の不公平感には、次のとおり手を打ちます
    行: [90, 92, 94]
    根拠:
