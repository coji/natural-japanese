# doc.review.md の論理構造
# 種別: 事実 = 出典やデータで確かめられること、または書き手が見聞きしたこと
#       推論 = 事実から書き手が導いたこと
#       意見 = 書き手の評価や考え
#       前提 = 確かめられていないが、論が成り立つのに必要な条件
#       見積 = 事実に係数を掛けた概算(数値があるときだけ)

文書の性格: 決めてもらう文書。経営会議が、内勤180名への週1日の在宅勤務制度の方針と準備の着手を決める。人事部の人事企画担当が書いた付議資料。

主結論:
  主張: 週1日・曜日の割り当て制で始めれば、VPNはいちばん多い曜日でも84件で、上限の100件に収まります。本日は方針の承認をいただき、試行の結果を踏まえて2月に最終案をお諮りします
  行: [123, 124, 125, 126, 127]
  決裁事項:
    - 内容: 内勤の従業員180名を対象に、週1日の在宅勤務制度を 2027年4月から 始めること
      行: [10]
    - 内容: 準備として、就業規則の改定、情報システム部との接続環境の調整、一部部署での試行に着手すること
      行: [11]
  制約:
    - 内容: 対象は内勤の従業員180名。試用期間中の者は除く
      行: [10, 48]
    - 内容: 週1日まで。翌週への繰り越しはしない
      行: [49]
    - 内容: 2027年4月から始める
      行: [10, 105, 114]
    - 内容: 規程の条文や費用の確定額といった制度の詳細は、本日の承認を受けて詰め、2月の経営会議で最終案としてお諮りします
      行: [13]
  比べた案:
    - 内容: 曜日を本人の希望に任せる案
      行: [59]
    - 内容: 競合の週1〜2日に対し、最初から大きく始める案
      行: [53]
  前提:
    - 種別: 前提
      内容: 応えられる中身を書いていた人は、在宅勤務があれば辞めなかった
      行: [21, 31]
      書き手の明示: なし
    - 種別: 前提
      内容: 競合2社に在宅勤務があることが、当社の応募や内定承諾に影響している
      行: [21, 26, 124]
      書き手の明示: なし
  依存: [現状, 基本の設計, 曜日の割り当て, 期待効果, 費用との比較, 懸念と対策, 進め方]

論点:
  - 名前: 現状
    種類: 論証
    主張: 在宅勤務がないことは、退職者の一部にとって「辞める理由」になっており、「選ばれない理由」にもなっていると考えます
    行: [17, 19, 21]
    論拠: 本文にない
    根拠:
      - 種別: 事実
        内容: 昨年の離職率は12%。250名規模で、退職者は31名。業界平均は8%で、当社の規模に当てはめると年間およそ20名
        行: [25]
        重み: 裏づけ
      - 種別: 事実
        内容: 当社に在宅勤務制度はなく、競合2社は週1〜2日を導入済み
        行: [26]
        重み: 決裁に要る
      - 種別: 事実
        内容: 回答した22名のうち9名が「働き方の柔軟性のなさ」を挙げ、退職理由の2位。1位は給与の11名
        行: [27]
        重み: 決裁に要る
      - 種別: 推論
        内容: 業界平均との差は、人数にすると年間でおよそ10名です。昨年の退職者31名のうち、内勤は19名、外勤などは12名でした。柔軟性のなさを挙げた9名のうち内勤は7名です
        行: [29]
        重み: 裏づけ
      - 種別: 事実
        内容: 9名のうち5名は、通院や送り迎えのための在宅のように、週1日の在宅勤務で応えられる中身を書いていて、そのうち内勤は4名です。残りの4名は時短や時差出勤を求めていて、在宅勤務では応えられません
        行: [31]
        重み: 決裁に要る

  - 名前: 目的
    種類: 記述
    主張: 離職の抑制と採用力の向上の2つを目的に置く
    行: [33]
    根拠:
      - 種別: 意見
        内容: 柔軟性のなさを理由とした退職を減らす
        行: [35]
        重み: 裏づけ
      - 種別: 意見
        内容: 求人で競合と同じく在宅勤務制度があると示せるようにし、応募や内定承諾で見劣りしないようにする
        行: [36]
        重み: 裏づけ
    限界や条件:
      - 内容: 在宅勤務だけで離職率が業界平均まで下がるとは考えていません。退職理由のうち、働き方の柔軟性に関わる部分に手を打つ施策と位置づけています
        行: [38]

  - 名前: 基本の設計
    種類: 記述
    主張: 対象者・日数・曜日・勤務場所の案を並べる
    行: [42, 44, 46]
    根拠:
      - 種別: 事実
        内容: 対象者は内勤の従業員180名。試用期間中の者は除く
        行: [48]
        重み: 決裁に要る
      - 種別: 事実
        内容: 週1日まで。翌週への繰り越しはしない
        行: [49]
        重み: 決裁に要る
      - 種別: 事実
        内容: 曜日は部署ごとに割り当てる
        行: [50]
        重み: 決裁に要る
      - 種別: 事実
        内容: 勤務場所は自宅に限る。カフェ等は情報管理の観点から認めない
        行: [51]
        重み: 裏づけ
      - 種別: 意見
        内容: 競合は週1〜2日です。当社はまず週1日から始め、運用が安定したら日数の見直しを検討します。最初から大きく始めず、確実に回る形で始めることを優先します
        行: [53]
        重み: 裏づけ

  - 名前: 曜日の割り当て
    種類: 論証
    主張: 部署ごとに曜日を割り当てれば、VPNの同時接続は、いちばん多い曜日でも上限の100件に収まります
    行: [55, 57]
    論拠: 在宅勤務者がいちばん多い曜日の人数と、外勤などのふだんの最大を足しても上限を下回る
    根拠:
      - 種別: 推論
        内容: 対象の180名が週1日ずつ在宅勤務をする場合、5日に均等に分かれれば1日あたり36名です。本人の希望に任せると月曜や金曜に偏るおそれがあるため、内勤の8部署それぞれに在宅勤務の曜日を割り当てます
        行: [59]
        重み: 裏づけ
      - 種別: 見積
        内容: 在宅勤務者がいちばん多い曜日は、2部署が重なる水曜の44名です。外勤など内勤以外のふだんの同時接続は最大で約40件なので、足すと84件で、上限に対して16件の余りがあります
        行: [61]
        重み: 決裁に要る

  - 名前: 公平性への配慮
    種類: 記述
    主張: 対象外の70名への説明と、対象外の職種に向けた施策の別途検討を述べる
    行: [63]
    根拠:
      - 種別: 推論
        内容: 内勤以外の従業員70名は対象外になるので、不公平だという声が出る可能性があります
        行: [65]
        重み: 裏づけ
      - 種別: 意見
        内容: 業務の性質上、在宅勤務が難しい職種であることを丁寧に説明するとともに、時差出勤や休暇の取りやすさの改善のような、対象外の職種に向けた施策を別途検討します
        行: [65]
        重み: 裏づけ

  - 名前: 期待効果
    種類: 論証
    主張: 離職の抑制、採用力の向上、定着と満足度の3つを効果として見込み、それぞれの測り方を決める
    行: [69, 71]
    論拠: 本文にない
    根拠:
      - 種別: 推論
        内容: 柔軟性のなさを理由とした退職が減る。離職率、退職者アンケートでの理由の順位と割合で測る
        行: [73]
        重み: 決裁に要る
      - 種別: 推論
        内容: 求人で在宅勤務制度があると示せる。応募数、内定承諾率、面接辞退の理由で測る
        行: [74]
        重み: 決裁に要る
      - 種別: 推論
        内容: 通勤負担が減り、育児や介護との両立がしやすくなる。従業員アンケートで測る
        行: [75]
        重み: 裏づけ

  - 名前: 費用との比較
    種類: 論証
    主張: ノートPCの購入と手当の1年分を合わせた費用は約786万円で、離職者およそ4.4名分です
    行: [77, 79]
    論拠: 離職者が年に1名減るごとに約180万円の削減になるので、費用を1名あたりのコストで割ると、何名分の削減に当たるかが分かる
    根拠:
      - 種別: 事実
        内容: 退職者1名あたりの採用・育成コストは約180万円で、採用費と教育期間の人件費を合わせた内勤の平均です。離職者が年に1名減るごとに約180万円の削減になります
        行: [81]
        重み: 決裁に要る
      - 種別: 見積
        内容: ノートPCを持っていないデスクトップPCの人は、内勤180名のうち約60名です。60台すべては買わず、まず希望者に限って配ります。在宅勤務を希望すると答えた112名のうちデスクトップの人は38名なので、1台約15万円で38台、約570万円です。離職者およそ3.2名分にあたります
        行: [83]
        重み: 決裁に要る
      - 種別: 見積
        内容: 在宅勤務手当は、設ける場合は1日あたり250円を想定しています。180名全員が48週使う計算で年間約216万円、離職者およそ1.2名分です
        行: [85]
        重み: 決裁に要る
    限界や条件:
      - 内容: 業界平均との差のおよそ10名のうち、何名分を在宅勤務で埋められるかは、導入後の実績で確かめます
        行: [87]

  - 名前: 懸念と対策
    種類: 記述
    主張: VPN、就業規則、費用の懸念と対策を並べる
    行: [91, 93]
    根拠:
      - 種別: 事実
        内容: VPNの同時接続数の上限100件に対し、部署ごとに曜日を割り当て、上限を超えないように保つ。試行期間中に、実際の接続数の最大値を測る
        行: [95]
        重み: 裏づけ
      - 種別: 事実
        内容: 在宅勤務規程を新設し、就業規則に位置づける。従業員代表の意見を聴いたうえで、労働基準監督署に届け出る。社会保険労務士に条文を確認してもらう
        行: [96]
        重み: 決裁に要る
      - 種別: 事実
        内容: 在宅勤務手当として通信費・光熱費を補助するかどうかと、通勤手当の扱いを決める。確定額は2月の最終案で示す
        行: [97]
        重み: 決裁に要る

  - 名前: 進め方
    種類: 記述
    主張: 2027年4月の開始に向けた予定を時期ごとに並べる
    行: [103, 105, 107]
    根拠:
      - 種別: 事実
        内容: 2026年11月 本日の経営会議で方針を承認
        行: [109]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2026年11月〜12月 規程の原案を作成。情報システム部とVPN・PC・セキュリティのルールを調整。社会保険労務士に相談
        行: [110]
        重み: 裏づけ
      - 種別: 事実
        内容: 2027年1月〜2月 1〜2部署の30名程度で試行。VPNの接続数、業務への影響、利用者の声を確認
        行: [111]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2027年2月 試行の結果を受けて、規程・費用・運用ルールの最終案を経営会議に付議
        行: [112]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2027年2月〜3月 従業員代表への意見聴取、労働基準監督署への届出。管理職向け説明会、全従業員向け説明会
        行: [113]
        重み: 裏づけ
      - 種別: 事実
        内容: 2027年4月 内勤180名で開始
        行: [114]
        重み: 決裁に要る
      - 種別: 事実
        内容: 2027年10月 半年の時点で、利用状況・離職率・採用の指標を経営会議に報告し、日数などの見直しを判断
        行: [115]
        重み: 裏づけ
    限界や条件:
      - 内容: 試行期間中に暫定的なルールが必要かどうかは、社会保険労務士に確認したうえで決めます
        行: [117]

  - 名前: 付録A 懸念と対策の残り
    種類: 記述
    主張: 労働時間、情報セキュリティ、業務、評価、不公平感の懸念と対策を並べる
    行: [131, 133]
    根拠:
      - 種別: 事実
        内容: 勤怠システムでの打刻を必須とする。在宅勤務日の時間外労働は事前申請制にする
        行: [135]
        重み: 裏づけ
      - 種別: 事実
        内容: 会社貸与のPCのみ使用可とし、VPN経由で接続する。紙の書類の持ち出しは原則禁止とする。運用ルールは情報システム部と作る
        行: [136]
        重み: 裏づけ
      - 種別: 事実
        内容: 在宅勤務日でも連絡がつく手段として、チャットとオンライン会議を決めておく。部署ごとに、在宅でできる業務とできない業務を整理する
        行: [137]
        重み: 裏づけ
      - 種別: 事実
        内容: 在宅勤務の利用の有無を評価に影響させないことを、規程と管理職向けの説明で明確にする
        行: [138]
        重み: 裏づけ
      - 種別: 事実
        内容: 2章の「公平性への配慮」のとおり、説明と別施策の検討で対応する
        行: [139]
        重み: 補足

  - 名前: 付録B 基本の設計の残り
    種類: 記述
    主張: 申請、勤務時間、業務上の必要の案を並べる
    行: [141, 143]
    根拠:
      - 種別: 事実
        内容: 前週までに上長へ申請し、上長が承認する
        行: [145]
        重み: 裏づけ
      - 種別: 事実
        内容: 通常の勤務時間と同じ。始業・終業は勤怠システムで打刻する
        行: [146]
        重み: 裏づけ
      - 種別: 事実
        内容: 会議や来客などで出社が必要な日は、上長が日を変更できる
        行: [147]
        重み: 裏づけ

  - 名前: 付録C 費用の計算の前提
    種類: 記述
    主張: 手当の計算式と48週の出どころを述べる
    行: [149]
    根拠:
      - 種別: 事実
        内容: 在宅勤務手当の年間約216万円は、1日250円、180名、週1日、48週を掛けた値です。48週は、人事部の勤怠の記録で年間の所定労働週数として使っている値です
        行: [151]
        重み: 補足

対応なし:
  - 行: 1
    内容: 在宅勤務制度（週1日）導入の企画
    理由: 意図の分かるもの(タイトル)
  - 行: 3
    内容: 人事部 人事企画担当
    理由: 意図の分かるもの(表紙)
  - 行: 4
    内容: 経営会議 付議資料
    理由: 意図の分かるもの(表紙)
  - 行: 8
    内容: 本日お諮りしたいこと
    理由: 意図の分かるもの(見出し。決裁事項を並べた節)
  - 行: 23
    内容: 項目、当社、比較対象
    理由: 意図の分かるもの(表の見出し)
  - 行: 99
    内容: そのほかの懸念と対策は付録Aに、制度の設計の残りの項目は付録Bに載せています
    理由: 意図の分かるもの(付録への案内)
